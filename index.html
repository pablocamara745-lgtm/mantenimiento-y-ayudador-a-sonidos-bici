const M = [["chain-lube","Limpiar y lubricar la cadena","Transmisión","Fácil","15–20 min","6–15 €","—","Cada 150–300 km o tras lluvia","Desengrasante, trapo, lubricante",["Pon la bici en un soporte o apoyada en una pared.","Pasa un trapo con desengrasante por la cadena mientras giras las bielas hacia atrás.","Déjala secar por completo.","Pon una gota en cada rodillo y gira las bielas varias vueltas.","Espera 10–15 minutos y quita el exceso con un trapo limpio."],"Lubricante húmedo para lluvia, seco para polvo."],["chain-wear","Medir el desgaste y cambiar la cadena","Transmisión","Media","30 min","15–60 €","10–20 € de mano de obra","Mide cada 500–1.000 km","Medidor de desgaste, tronchacadenas, falsa unión nueva",["Con la cadena limpia, coloca el medidor entre dos rodillos: si el lado «bien» entra y el otro no, el desgaste es bajo; si el segundo lado entra, hay que cambiarla.","Mide en varios puntos de la cadena.","Haz una foto del recorrido por el cambio y cuenta los eslabones.","Abre la cadena vieja con la falsa unión (con unas pinzas) o con el tronchacadenas.","Pasa la cadena nueva por roldanas y desviador delantero, iguálala en longitud con la vieja y comprueba con plato grande y piñón grande que el cambio no queda totalmente estirado.","Cierra con la falsa unión nueva y flexiona el eslabón en ambos sentidos para comprobar que no queda rígido.","Lubrica y prueba todas las marchas; si salta bajo carga, el cassette también está gastado."],"Cambiarla a tiempo alarga la vida de cassette y platos."],["cassette","Cambiar el cassette","Transmisión","Media","30 min","25–120 €","10–20 € de mano de obra","Cuando salta con cadena nueva","Llave de cassette, látigo, grasa",["Identifica el cuerpo de rueda libre (Shimano HG, SRAM XD, Microspline) y comprueba que el cassette nuevo es compatible con él y con tu número de velocidades.","Quita la rueda trasera y el eje.","Coloca el látigo en un piñón y la llave de cassette en el cierre; afloja girando en sentido antihorario.","Saca los piñones y anota el orden y los espaciadores.","Limpia las estrías del cuerpo de rueda libre y engrasa ligeramente.","Monta el cassette nuevo en orden y aprieta el cierre a unos 40 N·m.","Cambia también la cadena si no es nueva y reajusta el indexado."],"Cassette y cadena se cambian juntos para que engranen bien."],["indexado","Ajustar el cambio trasero","Transmisión","Media","30–45 min","0 €","10–25 €","Cuando cambia mal o salta","Allen, destornillador",["Pon la bici en un soporte, la cadena en el plato pequeño (o único) y en el piñón más pequeño.","Comprueba cable y funda: sin óxido, sin dobleces y bien asentados en sus topes. Si dudas, cámbialos antes de ajustar.","Gira el ajustador de barril del cambio y de la maneta hasta el fondo y luego medio giro hacia fuera para dejar margen en ambos sentidos.","Límite H: con la cadena en el piñón más pequeño, ajusta el tornillo H hasta que la roldana superior quede alineada con ese piñón sin que la cadena roce el siguiente.","Tensa el cable: deja la maneta en la posición del piñón más pequeño, tira del cable con el alicate y aprieta el tornillo de anclaje.","Cambia una marcha: la cadena debe subir al segundo piñón sin dudar. Si tarda, gira el barril un cuarto de vuelta en sentido antihorario (más tensión); si salta dos piñones, al contrario.","Recorre todas las marchas subiendo y bajando y ajusta el barril en cuartos de vuelta hasta que no haya roce.","Límite L: en el piñón más grande, ajusta el tornillo L para que la cadena no caiga hacia los radios. Ajusta el tornillo B para que la roldana superior quede lo más cerca posible del piñón grande sin tocarlo (normalmente unos 5–6 mm)."],"Gira el ajustador de barril un cuarto de vuelta cada vez."],["cables-cambio","Cambiar cables y fundas del cambio","Transmisión","Media","60 min","15–30 €","30–50 €","Una vez al año o cada 4.000 km","Alicates de cables, cortador de fundas, lubricante",["Pon la cadena en el piñón más pequeño y suelta el tornillo de anclaje del cable en el cambio.","Saca el cable viejo desde la maneta y extrae las fundas.","Mide y corta fundas nuevas con un cortador, quita las rebabas y coloca los topes.","Lubrica ligeramente el cable nuevo y pásalo por la maneta, las fundas y el cambio.","Tensa el cable con el alicate y aprieta el anclaje.","Ajusta el indexado (ver tarea «Ajustar el cambio trasero»).","Corta el sobrante y coloca el capuchón."],"Corta las fundas con un cortador específico: unas tijeras las aplastan."],["roldanas","Limpiar o cambiar las roldanas","Transmisión","Fácil","20 min","8–25 €","10–15 €","Cada 2.000 km o cuando chirrían","Allen, desengrasante",["Quita la jaula del cambio.","Saca las roldanas y límpialas.","Cámbialas si tienen juego o dientes afilados.","Móntalas en su posición y aprieta."],"Cada roldana tiene su posición y sentido: fíjate al desmontar."],["pedalier","Engrasar o cambiar la caja de pedalier","Transmisión","Media","45–60 min","15–80 €","20–35 € de mano de obra","Cada 6–12 meses o si cruje","Extractor de cazoletas, grasa, llave dinamométrica",["Identifica tu caja (roscada o a presión) y consigue la llave adecuada.","Saca las bielas siguiendo el sistema de tu marca.","Extrae las cazoletas; en rosca inglesa (BSA), la del lado de la transmisión tiene rosca inversa.","Limpia roscas y el tubo del cuadro, y revisa que no haya daños.","Monta con grasa en las roscas o retenedor en el encaje a presión.","Aprieta al par del fabricante (en cajas roscadas suele estar entre 35 y 50 N·m).","Monta las bielas con el par de tu sistema y comprueba que el eje gire suave."],"En rosca, grasa; en encaje a presión, retenedor."],["pedales","Engrasar o cambiar los pedales","Transmisión","Fácil","20 min","5–80 €","10–15 €","Una vez al año","Llave de pedal, grasa",["Desmonta cada pedal.","Limpia la rosca y engrasa.","Monta y aprieta; el izquierdo tiene rosca inversa.","Comprueba que el eje gire suave."],"El pedal izquierdo se afloja girando hacia la derecha."],["pastillas","Cambiar las pastillas de disco","Frenos","Fácil","20–30 min","10–35 € el par","10–20 €","Cuando quede cerca de 1 mm de material","Allen, alicates, espátula de plástico",["Quita la rueda y retira el pasador o tornillo de las pastillas.","Saca las pastillas y observa el material que queda: con aproximadamente 1 mm hay que cambiarlas.","Empuja los pistones con la espátula hasta el fondo y limpia la zona con alcohol.","Coloca las pastillas nuevas con su muelle y fija el pasador.","Monta la rueda y acciona la maneta varias veces hasta que haga tope.","Asienta con 10 frenadas progresivas desde unos 20 km/h y otras 10 desde unos 30 km/h.","Comprueba que no roce al girar la rueda."],"No toques pastillas ni disco con los dedos."],["purga","Purgar los frenos hidráulicos","Frenos","Taller","60 min","23–45 € (kit y fluido)","20–40 € por freno","Cada 1–2 años o si la maneta está esponjosa","Kit de purga, fluido correcto, guantes",["Identifica el fluido que indique el fabricante (DOT o aceite mineral) y usa el kit correcto.","Coloca la bici en soporte y deja la maneta en posición horizontal.","Quita las pastillas y pon un separador entre los pistones.","Conecta el kit en la pinza y en el depósito de la maneta según el manual de la marca.","Empuja el fluido desde la pinza hacia la maneta y golpea suavemente el latiguillo para sacar las burbujas.","Cierra la purga, retira el kit, limpia el fluido y cierra el depósito.","Monta pastillas y rueda y comprueba que la maneta queda firme.","Limpia cualquier gota con alcohol: el fluido contamina las pastillas."],"DOT y aceite mineral nunca se mezclan."],["disco","Cambiar o enderezar el disco","Frenos","Fácil","30 min","15–50 €","10–20 €","Si roza o está por debajo del grosor mínimo","Torx, llave dinamométrica",["Quita la rueda y apóyala sobre una superficie plana.","Afloja los tornillos en cruz y retira el disco.","Limpia el asiento del disco en el buje.","Monta el disco nuevo con el sentido de giro marcado y aprieta en cruz con llave dinamométrica (Shimano ≈2 N·m, SRAM ≈6 N·m; mira el valor marcado).","Limpia el disco nuevo con alcohol isopropílico.","Monta la rueda y centra la pinza si roza."],"Limpia el disco nuevo con alcohol antes de usarlo."],["zapatas","Cambiar las zapatas de llanta","Frenos","Fácil","20 min","6–20 € el par","8–15 €","Cuando se llegue al indicador de desgaste","Allen",["Suelta el tornillo de la zapata y retírala.","Coloca la nueva respetando el sentido de giro.","Oriéntala con 1–2 mm de convergencia (toe-in).","Aprieta y comprueba el recorrido de la maneta."],"Revisa las zapatas tras salidas con lluvia."],["presion","Revisar presión y estado de los neumáticos","Ruedas","Fácil","5 min","0 €","—","Antes de cada salida","Bomba con manómetro",["Mide la presión con el manómetro.","Ajusta según tu peso, ancho de cubierta y terreno.","Revisa cortes, grietas y piedras clavadas.","Comprueba que la válvula esté recta y cerrada."],"Mide justo antes de salir."],["pinchazo","Reparar un pinchazo o cambiar la cámara","Ruedas","Fácil","20 min","3–10 €","8–15 €","Cuando haya un pinchazo","Desmontables, bomba, parches",["Quita la rueda; con freno de llanta, abre antes el freno para sacarla.","Desinfla y despega un lado de la cubierta con los desmontables, de uno en uno; no uses un destornillador.","Saca la cámara y localiza el pinchazo: hincha y escucha o mira en agua.","Revisa el interior de la cubierta con los dedos, con cuidado, para encontrar la espina.","Aplica el parche (limpia, lija ligero, pega con pegamento y deja secar) o pon una cámara nueva.","Hincha un poco la cámara y colócala dentro de la cubierta, empezando por la válvula.","Mete la cubierta con las manos sin pellizcar la cámara e hincha a la presión correcta.","Comprueba que la cubierta asienta bien en la llanta."],"Pasa un dedo por dentro de la cubierta para encontrar la espina."],["tubeless","Cambiar el sellante tubeless","Ruedas","Fácil","20–30 min","8–15 €","10–20 €","Cada 3–6 meses","Inyector o jeringa, sellante",["Quita la rueda y desinfla la cubierta.","Saca el núcleo de la válvula y vacía el sellante viejo.","Despega un lado de la cubierta y limpia los restos de sellante seco.","Vuelve a colocar la cubierta y prepara la dosis recomendada de sellante (suele estar entre 30 y 60 ml por rueda).","Inyecta el sellante por la válvula con el inyector.","Hincha con bomba de alta presión o compresor para asentar la cubierta y gira la rueda.","Baja a la presión de uso y comprueba que no pierde."],"Revisa el sellante antes de salidas largas."],["centrado","Centrar la rueda y revisar radios","Ruedas","Taller","30–45 min","—","15–30 €","Si la rueda baila o suenan radios","Llave de radios, soporte de centrado",["Gira la rueda y mira dónde roza o salta.","Comprueba la tensión de los radios.","Ajusta los radios del lado que corresponda en pequeños pasos.","Repite hasta que gire recta."],"Sin soporte de centrado es mejor dejarlo al taller."],["bujes","Engrasar y revisar los bujes","Ruedas","Media","45–60 min","5–20 €","25–50 €","Cada 6–12 meses","Llaves de conos, grasa",["Identifica el tipo de buje (conos o cartucho) y consigue las llaves y el manual.","Quita la rueda y el eje y desmonta las tapas laterales.","Limpia rodamientos, conos y tazas con desengrasante.","Revisa muescas o corrosión y cambia las piezas dañadas.","Engrasa con grasa para rodamientos y monta con la precarga correcta.","Ajusta los conos hasta quitar el juego sin dejarlo duro y aprieta las contratuercas.","Comprueba que gira suave y sin juego."],"El eje debe girar suave y sin tope."],["direccion","Engrasar y ajustar la dirección","Dirección y cuadro","Media","45 min","5–10 €","25–45 €","Una vez al año","Allen, llave dinamométrica, grasa",["Afloja la potencia del tubo de dirección y retira la tapa.","Saca la horquilla con cuidado de no perder rodamientos, espaciadores y anillos.","Limpia cazoletas, rodamientos y el tubo de dirección con desengrasante.","Revisa muescas o corrosión y cambia las piezas dañadas.","Engrasa y vuelve a montar en orden.","Coloca la potencia y la tapa y aprieta el tornillo de la tapa hasta quitar el juego.","Alinea la potencia con la rueda y aprieta sus tornillos al par.","Comprueba que la dirección gira libre y sin juego."],"La tapa solo da precarga: no es para apretar fuerte."],["cinta","Cambiar cinta o puños del manillar","Dirección y cuadro","Fácil","20 min","5–25 €","10–20 €","Cuando estén gastados","Cúter, cinta o puños nuevos",["Quita la cinta o los puños viejos.","Limpia el manillar.","Coloca los nuevos con tensión uniforme.","Fija los extremos con tapones."],"Empieza por la parte baja y sube."],["pivotes-mant","Revisar y engrasar los pivotes de la suspensión","Suspensión y pivotes","Media","1–2 h","5–10 € de grasa · 20–80 € de rodamientos","40–100 €","Cada 6–12 meses o tras barro","Llaves allen y torx, llave dinamométrica, grasa",["Mueve el basculante de lado a lado para buscar juego.","Anota el orden de ejes, arandelas y espaciadores.","Limpia, engrasa y cambia los rodamientos con juego.","Monta y aprieta al par del fabricante."],"Haz una foto antes de desmontar."],["horquilla","Servicio de la horquilla de suspensión","Suspensión y pivotes","Taller","60 min","20–60 €","50–90 €","Cada 50 horas o 6–12 meses","Kit de servicio, aceite, herramientas específicas",["Anota la presión y el rebote actuales.","Quita la rueda y limpia la horquilla.","Desmonta las botellas siguiendo el manual del fabricante.","Vacía el aceite del tren inferior y limpia.","Cambia retenes, espumas y juntas que incluya el kit.","Rellena de aceite en la cantidad indicada.","Monta, ajusta presión y rebote."],"Sin herramientas específicas, mejor al taller."],["sag","Ajustar presión y SAG de la suspensión","Suspensión y pivotes","Fácil","15 min","20–40 € (bomba)","—","Al cambiar de terreno o de equipo","Bomba de suspensión",["Ponte en posición de marcha con el equipo.","Coloca el aro (o goma) del vástago en la posición cero.","Siéntate en posición de pedaleo sin rebotar y baja con cuidado.","Mide cuánto ha recorrido el aro: ese es el SAG.","Compáralo con el recomendado (suele estar entre el 20 y el 30 %, según el uso).","Ajusta la presión y repite la medida.","Ajusta el rebote y anota la presión."],"Cada fabricante da una tabla de partida."],["ebike","Revisar batería, contactos y conexiones","Eléctrica","Fácil","15 min","0 €","—","Cada mes","Trapo seco, llave del fabricante",["Quita la batería y limpia los contactos.","Revisa el soporte y el cierre.","Comprueba que no haya cables rozados.","Mira si el fabricante publica una actualización de firmware."],"No uses chorro a presión sobre motor ni batería."],["tornillos","Reapretar todos los tornillos","General","Fácil","30 min","0 €","—","Cada mes y tras caídas","Allen, torx, llave dinamométrica",["Sigue el checklist de tornillos.","Aprieta al par indicado en la pieza.","No sobrepases el par en carbono.","Comprueba que nada baile."],"Marca los tornillos con rotulador para ver si se mueven."],["limpieza","Limpiar la bici a fondo","General","Fácil","30–45 min","5–15 €","15–30 €","Cada mes o tras barro","Agua suave, cepillo, desengrasante",["Humedece con agua suave, sin presión.","Limpia la transmisión con desengrasante.","Lava el cuadro con jabón y aclara.","Seca y lubrica la cadena."],"Evita el chorro a presión en bujes, pedalier y dirección."],["revision","Revisión rápida antes de salir","General","Fácil","5–10 min","0 €","—","Antes de cada salida","Ninguna",["Aire: comprueba la presión.","Frenos: acciona ambos y revisa el recorrido.","Cadena: mira que esté lubricada.","Ejes y cierres: comprueba que estén cerrados.","Da una vuelta corta escuchando ruidos."],"Si ves u oyes algo raro, no salgas hasta resolverlo."],["freno-llanta","Ajustar los frenos de llanta y la tensión del cable","Frenos","Fácil","20 min","0 €","8–15 €","Cuando el recorrido de la maneta sea largo","Allen, alicates",["Afloja el tornillo de anclaje del cable en el brazo del freno.","Acerca las zapatas a la llanta a 1–2 mm y fija su altura.","Tensa el cable con alicates y aprieta el anclaje.","Afina con el ajustador de barril.","Comprueba que la rueda gira libre y que las zapatas tocan a la vez.","Prueba la frenada a baja velocidad."],"Las zapatas deben tocar la llanta a la vez."],["cable-freno","Cambiar el cable y la funda del freno","Frenos","Media","45 min","8–20 €","20–35 €","Una vez al año","Alicates de cables, cortador de fundas, lubricante",["Suelta el cable en la pinza y en la maneta.","Saca cable y funda viejos y mira si hay óxido, hilos rotos o dobleces.","Corta la funda nueva con un cortador, quita las rebabas y pon los topes.","Pon una gota de lubricante en el cable y pásalo por la funda.","Tensa el cable y aprieta el anclaje.","Afina con el ajustador de la maneta.","Comprueba que el freno vuelve sin ruido."],"Una funda aplastada hace que el freno vuelva lento."],["pinza-limpieza","Limpiar la pinza y los pistones del freno de disco","Frenos","Media","30 min","3–6 €","15–25 €","Cada 6 meses o si un pistón se pega","Alcohol isopropílico, espátula de plástico, trapo",["Quita la rueda y las pastillas.","Limpia la pinza con alcohol y un cepillo suave.","Empuja los pistones con la espátula y límpialos con alcohol sin dejar fluido.","Si un pistón se atasca, alterna entre empujarlo y accionar la maneta con un separador.","Comprueba que los pistones vuelven por igual.","Monta las pastillas y la rueda.","Prueba el freno y comprueba que no roza."],"No dejes fluido sobre las pastillas."],["rueda-libre","Engrasar el cuerpo de rueda libre","Transmisión","Media","30–45 min","3–8 €","20–35 €","Una vez al año","Allen, grasa o aceite ligero",["Quita la rueda y el cassette.","Retira el cuerpo de rueda libre si tu buje lo permite.","Limpia y aplica aceite ligero en el mecanismo.","Monta y comprueba que gire suave y sin juego."],"Mira el manual de tu buje: cambia según el fabricante."],["platos","Cambiar los platos o el monoplato","Transmisión","Media","40 min","25–120 €","15–30 €","Cuando los dientes estén afilados","Allen o torx, llave de platos, grasa",["Quita la biela de la transmisión siguiendo el sistema de tu marca.","Anota la posición y la orientación del plato.","Afloja los tornillos del plato en cruz con la llave específica.","Retira el plato y limpia la araña.","Monta el plato nuevo en la posición correcta.","Aprieta los tornillos en cruz y al par (suele estar entre 8 y 12 N·m).","Monta la biela y la cadena y revisa el cambio."],"Cambia cadena y cassette a la vez si el desgaste es alto."],["biela","Revisar bielas y sus tornillos","Transmisión","Fácil","15 min","0 €","—","Cada mes","Allen, llave dinamométrica",["Empuja cada biela de lado a lado: no debe haber juego.","Comprueba el par de los tornillos.","Mira si hay grietas en la biela.","Revisa el estado de las estrías."],"Un juego en la biela suena como crujido de pedalier."],["desviador-del","Ajustar el desviador delantero","Transmisión","Media","30 min","0 €","10–20 €","Cuando roza o cae la cadena","Allen, destornillador",["Pon la cadena en el plato pequeño y el piñón grande para ajustar el límite L, y en el plato grande y el piñón pequeño para el H.","Comprueba que el desviador esté a 1–3 mm del plato grande y paralelo.","Ajusta el tornillo L hasta que la cadena no caiga del plato pequeño hacia dentro.","Ajusta el tornillo H hasta que no se pase del plato grande hacia fuera.","Tensa el cable y afina con el barril hasta que cambie limpio.","Prueba todas las combinaciones y evita la cruzada extrema.","Comprueba que el roce ha desaparecido."],"Una separación de 1–3 mm con el plato grande es la habitual."],["patilla","Comprobar y alinear la patilla del cambio","Transmisión","Taller","15 min","—","10–20 €","Tras caídas o golpes en la rueda trasera","Alineador de patilla (taller)",["Mira desde atrás si el cambio queda en línea con los piñones.","Si queda torcido, no lo fuerces con la mano.","Lleva la bici a un taller con alineador.","Revisa el indexado después."],"Una patilla torcida causa saltos y ruido que ningún ajuste arregla."],["eje-pasante","Limpiar y engrasar ejes pasantes y cierres","Ruedas","Fácil","10 min","3–5 €","—","Cada 3 meses","Trapo, grasa",["Saca el eje y limpia la rosca.","Pon una capa fina de grasa.","Monta y aprieta al par del fabricante.","Comprueba que la rueda quede bien asentada."],"Un eje seco puede crujir en cada bache."],["valvula","Cambiar la cinta de llanta o la válvula","Ruedas","Media","20 min","3–10 €","8–15 €","Cuando haya pinchazos por los radios o la válvula pierda","Desmontables, bomba",["Desmonta la cubierta.","Sustituye la cinta o la válvula.","Comprueba que cubra todos los agujeros de los radios.","Monta la cubierta e hincha."],"Una cinta movida pincha la cámara."],["sillin-tija","Engrasar la tija y el sillín","Dirección y cuadro","Fácil","15 min","5 €","—","Cada 6 meses","Allen, grasa, trapo",["Saca la tija y limpia el tubo de sillín.","Aplica grasa (metal) o pasta de carbono.","Monta a la altura marcada.","Aprieta la abrazadera al par."],"En carbono, pasta de montaje y llave dinamométrica."],["tija-telesc","Servicio de la tija telescópica","Dirección y cuadro","Media","45 min","10–30 €","30–60 €","Cada 100–200 horas de uso","Llaves del fabricante, grasa, aceite",["Limpia la zona del tubo.","Desmonta el cartucho según el modelo.","Limpia y lubrica los casquillos.","Monta y comprueba el recorrido."],"Cada fabricante marca su propio intervalo."],["retenes","Cambiar los retenes de la horquilla","Suspensión y pivotes","Taller","60 min","15–40 €","40–80 €","Cuando haya fugas de aceite","Herramientas del fabricante, aceite",["Desmonta las botellas.","Retira el retén y limpia el alojamiento.","Monta el retén nuevo con la herramienta adecuada.","Rellena de aceite y ajusta."],"Un vástago sucio es la causa nº 1 de fugas."],["casquillos","Cambiar los casquillos del amortiguador","Suspensión y pivotes","Taller","60–90 min","15–50 €","40–80 €","Cuando haya juego en el ojal","Prensa de casquillos, llaves",["Desmonta el amortiguador.","Saca los casquillos viejos con la prensa.","Instala los nuevos sin golpearlos.","Monta y comprueba que no haya juego."],"El juego en el ojal da un golpeteo en cada bache."],["ebike-sensor","Revisar sensores, conectores y pantalla","Eléctrica","Fácil","15 min","0 €","—","Cada 3 meses","Trapo seco, llave del fabricante",["Revisa el sensor de velocidad y de cadencia.","Comprueba conectores y cables sin roces.","Mira que la pantalla funcione y esté fija.","Limpia sin agua a presión."],"Un sensor desalineado puede cortar la asistencia."],["bateria-carga","Cuidar la batería y la carga","Eléctrica","Fácil","5 min","0 €","—","Siempre","Cargador original",["Usa el cargador original.","No cargues con la batería muy caliente o helada.","Guarda a media carga si no la usas.","Revisa el conector de carga y mantenlo limpio."],"Evita dejarla totalmente descargada mucho tiempo."],["guardabarros","Montar y ajustar guardabarros y portabultos","General","Fácil","30 min","15–60 €","10–20 €","Al montarlos y cada mes","Allen, bridas, destornillador",["Presenta el guardabarros y centra respecto a la rueda.","Fija los soportes sin apretar del todo.","Ajusta la distancia con la cubierta.","Aprieta y comprueba que no roce."],"El roce en el guardabarros suena como un problema de rueda."],["luces","Revisar luces y reflectantes","General","Fácil","10 min","0–30 €","—","Antes de salir de noche","Destornillador",["Comprueba que enciendan y la batería.","Fija el soporte para que no vibre.","Limpia reflectantes y lente.","Ajusta la altura para no deslumbrar."],"Una luz suelta vibra y se confunde con ruido de cuadro."],["invierno","Preparar la bici para el invierno","General","Fácil","45 min","15–30 €","—","Antes de la época fría","Lubricante húmedo, desengrasante, trapo",["Lubrica la cadena con lubricante húmedo.","Revisa el estado de pastillas y cubiertas.","Revisa luces y guardabarros.","Engrasa pivotes y ejes."],"En frío, el aceite y la grasa se endurecen."],["almacenaje","Guardar la bici varios meses","General","Fácil","30 min","5–10 €","—","Antes de guardarla","Trapo, lubricante, bomba",["Limpia y seca la bici a fondo.","Lubrica la cadena y los pivotes.","Hincha las cubiertas y guárdala en seco.","Si es eléctrica, deja la batería a media carga."],"Cuélgala o muévela de vez en cuando para que las cubiertas no se deformen."],["cubiertas","Cambiar las cubiertas","Ruedas","Fácil","20–30 min por rueda","20–70 € cada una","8–15 € por rueda","Cuando el dibujo se agote o aparezcan cortes","Desmontables, bomba, jabón",["Desinfla y despega un lado de la cubierta con los desmontables.","Saca la cubierta y la cámara.","Revisa la llanta y la cinta de llanta.","Mira el sentido de giro marcado en la cubierta y colócala siguiendo la flecha.","Coloca la cámara o el sellante según tu sistema.","Asienta la cubierta con bomba y gira la rueda.","Ajusta la presión de uso."],"Respeta la flecha de sentido de giro."],["alcance-maneta","Ajustar el alcance y el punto de contacto de la maneta","Frenos","Fácil","5–10 min","0 €","—","Cuando la maneta quede lejos o cerca","Allen",["Localiza los tornillos de alcance y de punto de contacto en la maneta.","Gira el de alcance hasta que llegues cómodo con el dedo.","Prueba a frenar con la bici parada.","Ajusta el punto de contacto si tu maneta lo permite.","Comprueba que la maneta recorra libre y no toque el manillar."],"Un ajuste cómodo mejora el control en bajadas."],["vastagos","Limpiar y lubricar los vástagos de la horquilla","Suspensión y pivotes","Fácil","10 min","5–10 €","—","Después de cada salida con barro","Trapo limpio, aceite para suspensión",["Limpia los vástagos con un trapo limpio.","Aplica una gota de aceite de suspensión en el trapo y pásalo por los vástagos.","Comprime la horquilla varias veces.","Quita el exceso con un trapo limpio.","Mira si hay fugas de aceite en los retenes."],"Un vástago sucio acorta la vida de los retenes."],["rodamientos-direccion","Cambiar los rodamientos de la dirección","Dirección y cuadro","Media","60 min","15–45 €","30–60 €","Cuando haya dureza o juego persistente","Allen, llave dinamométrica, extractor, grasa",["Afloja la potencia y retira la tapa.","Saca la horquilla con cuidado.","Extrae las cazoletas y rodamientos con la herramienta adecuada.","Limpia los asientos y comprueba que no hay daños.","Monta los rodamientos nuevos con grasa.","Vuelve a montar la horquilla y ajusta la precarga.","Aprieta la potencia al par y comprueba el giro."],"Si no tienes herramientas de prensa, lleva el cuadro a un taller."],["monomarcha","Ajustar la tensión de la cadena en monomarcha o fixie","Transmisión","Fácil","15 min","0 €","—","Cuando la cadena cuelga o salta","Llave de tuercas o allen",["Afloja el eje de la rueda trasera.","Desplaza la rueda hacia atrás para tensar la cadena.","Comprueba la holgura vertical (alrededor de 1 cm en el centro).","Alinea la rueda para que quede recta.","Aprieta el eje.","Comprueba que la cadena no queda dura en ningún punto del giro."],"Una cadena demasiado tensa gasta rodamientos y transmisión."],["post-caida","Revisión tras una caída","General","Fácil","30 min","0 €","—","Después de cualquier caída","Allen, llave dinamométrica",["Mira cuadro y horquilla en busca de grietas, abolladuras o pintura levantada.","Gira las ruedas y comprueba que no rozan ni tienen radios sueltos.","Comprueba que manillar y potencia están alineados y apretados.","Revisa manetas, cables y latiguillos.","Comprueba el cambio y la patilla: alineación y funcionamiento.","Prueba los frenos a baja velocidad.","Reaprieta tornillos al par.","Si dudas del cuadro o de una pieza de carbono, no uses la bici y llévala a un taller."],"Una pieza de carbono golpeada puede tener daño interno que no se ve."],["revision-parque","Revisión tras un día de bike park o freeride","General","Fácil","45 min","0 €","—","Después de cada sesión","Allen, torx, llave dinamométrica, trapo",["Limpia la bici con agua suave y sin presión.","Revisa cuadro, horquilla y amortiguador en busca de grietas o fugas.","Comprueba el estado de pastillas y discos.","Revisa llantas y radios.","Comprueba con llave dinamométrica tornillos de potencia, manillar, tija, pinzas y pivotes.","Mueve el basculante y la bieleta buscando juego.","Revisa cadena, cambio y embrague.","Ajusta la presión de neumáticos y suspensión."],"Hacerla justo después de la sesión detecta los fallos antes de la siguiente."],["pivotes-par","Reapretar los pivotes tras impactos fuertes","Suspensión y pivotes","Fácil","30 min","0 €","—","Tras caídas o saltos fuertes","Llaves allen y torx, llave dinamométrica",["Consulta la tabla de pares de tu bici.","Descomprime la suspensión y comprueba el estado del cuadro.","Aprieta cada pivote y eje al par indicado, siguiendo el orden del fabricante.","Mueve el basculante buscando juego.","Comprime la suspensión varias veces y vuelve a revisar los pares."],"Marcar los tornillos con rotulador ayuda a ver si se mueven."],["amortiguador","Servicio del amortiguador (aceite y juntas)","Suspensión y pivotes","Taller","60–90 min","40–120 €","50–120 €","Cada 100–200 horas","Herramientas del fabricante, aceite",["Anota la presión y los ajustes actuales.","Libera la presión de aire del amortiguador.","Desmonta el cuerpo y cambia el aceite y las juntas según el manual.","Limpia y lubrica el pistón.","Monta y rellena la presión.","Comprueba el recorrido y el SAG."],"Sin herramientas específicas, mejor al taller."],["bieleta","Cambiar los rodamientos de la bieleta","Suspensión y pivotes","Media","90 min","20–80 €","40–100 €","Cuando haya juego o dureza","Llaves allen y torx, llave dinamométrica, extractor, grasa",["Descomprime la suspensión y anota el orden de ejes y espaciadores.","Desmonta los ejes de la bieleta.","Extrae los rodamientos con la herramienta adecuada.","Limpia los asientos y monta los rodamientos nuevos con grasa.","Monta y aprieta al par del fabricante.","Comprueba que no hay juego y que la suspensión comprime suave."],"Cambia siempre los rodamientos del mismo pivote juntos."],["embrague","Revisar el embrague del cambio","Transmisión","Fácil","15 min","0 €","—","Cada mes o tras golpes","Allen, trapo, lubricante",["Comprueba que el embrague esté activado.","Mueve la jaula con la mano: debe oponer resistencia al principio.","Limpia el cambio y lubrica el pivote.","Comprueba los tornillos del cambio y de la patilla."],"Un embrague sin resistencia debe revisarlo un taller."],["protector","Colocar un protector de vaina o de cuadro","General","Fácil","15 min","5–15 €","—","Al montar o cuando se desgaste","Alcohol, tijeras",["Limpia la zona con alcohol.","Corta el protector a medida.","Pégalo sin arrugas.","Comprueba que no roce con la rueda ni con la cadena."],"Reduce el golpeteo de la cadena y las rozaduras."],["llantas","Revisar llantas y radios tras saltos y escaleras","Ruedas","Fácil","20 min","0 €","—","Después de cada sesión","Llave de radios (opcional)",["Gira la rueda y mira si roza o salta.","Revisa la llanta en busca de abolladuras o grietas.","Pellizca los radios y comprueba la tensión.","Mira que las cubiertas asientan bien.","Lleva la rueda a un taller si hay abolladuras o radios flojos."],"Una grieta en la llanta obliga a cambiarla."],["presion-saltos","Ajustar la presión para saltos y escaleras","Ruedas","Fácil","10 min","0 €","—","Al cambiar de terreno","Bomba con manómetro",["Mide la presión actual.","Súbela en pasos pequeños si golpeas la llanta en aterrizajes.","Bájala si pierdes agarre o rebota demasiado.","Anota la presión que mejor funciona para repetirla."],"La presión ideal cambia con el peso, la cubierta y el terreno."],["pastillas-bajada","Montar pastillas y discos para bajadas largas","Frenos","Media","30 min","20–60 €","10–20 €","Antes de una temporada de bajadas","Allen, espátula, alcohol",["Elige pastillas metálicas o sinterizadas y un disco de tamaño adecuado.","Quita la rueda y cambia las pastillas.","Cambia el disco si hace falta.","Asienta los frenos con frenadas progresivas.","Comprueba que no hay roce."],"Las bajadas largas calientan  núcleo a presión hasta oír el clic y comprueba que gira libre y engancha al instante."],"Nunca uses grasa densa: deja los trinquetes pegados y el buje patina en falso."],["patilla-udh","Ajustar y apretar la patilla universal SRAM UDH","Transmisión","Fácil","15 min","0 €","10–15 €","Tras golpes o en cada revisión mensual","Llave allen de 8 mm, llave dinamométrica",["Afloja el eje pasante y retira la rueda trasera.","Comprueba que la patilla UDH esté limpia de arenilla y encajada en su rebaje del cuadro.","Introduce la llave allen de 8 mm en el tornillo central.","Recuerda: ¡la rosca es inversa! Aprieta girando en sentido ANTIHORARIO (a izquierdas).","Aplica un par de apriete exacto de 25 N·m con llave dinamométrica.","Vuelve a montar la rueda y aprieta el eje pasante a 12–15 N·m.","Comprueba que la distancia del cambio al cassette sea perfecta."],"La patilla UDH se aprieta a izquierdas (sentido antihorario) a 25 N·m."],["ajuste-electronico","Microajuste y calibración de cambio electrónico (Di2 / AXS)","Transmisión","Fácil","15 min","0 €","10–20 €","Cuando roce la cadena o salte al cambiar","App oficial o pulsadores de la maneta",["Coloca la bici en un soporte y pon la cadena en el piñón central.","Activa el modo de microajuste desde el pulsador del cambio o la app móvil.","Gira las bielas y pulsa el botón para desplazar el cambio en pasos de 0,2 mm hacia el piñón más grande hasta escuchar un ligero roce.","Desplaza en sentido contrario 2 a 3 clics hasta que la cadena ruede en total silencio.","Sal del modo de ajuste y prueba a engranar todos los piñones subiendo y bajando con rapidez.","Comprueba la distancia B-tension con la galga de la marca."],"El microajuste mueve el cambio en pasos micrométricos de 0,2 mm."],["mousse-inserto","Instalación y revisión de mousse tubeless","Ruedas","Media","45 min","10–20 € de sellante","15–30 € de mano de obra","Cada 4–6 meses","Desmontables específicos, sellante tubeless, bomba de alta presión",["Desinfla la rueda por completo y    open=!gr.startsWith("⚡")||(st.tipo&&st.tipo.includes("eMTB"));
   if(open)g+=`<h3 class="grp">${gr}</h3><div class="opts sm">`;
 }
 if(open)g+=card("tog",id,n,"",st.z.has(id),"z"," sm");

const norm=o=>{const t=Object.values(o).reduce((a,b)=>a+b,0)||1;return Object.fromEntries(Object.entries(o).map(([k,v])=>[k,v/t]))};
const topOf=(p,n)=>Object.entries(p).sort((a,b)=>b[1]-a[1]).slice(0,n);

function probs(){
let p=norm(st.zv||{});
for(const[id,a]of st.qa){
 if(a==="x")continue;
 const q=QS[id];
 if(!q)continue;
 for(const z in p)p[z]*=a==="s"?(q.z.includes(z)?2.6:.7):(q.z.includes(z)?.3:1.15);
 p=norm(p);
}
return p;
}

function nextQ(p){
let best=null,bs=9;
for(const[id,q]of Object.entries(QS)){
 if(st.qa.some(x=>x[0]===id)||(q.e&&(!st.tipo||!st.tipo.includes("eMTB"))))continue;
 const d=Math.abs(q.z.reduce((a,z)=>a+(p[z]||0),0)-.5);
 if(d<bs){bs=d;best=id;}
}
return best;
}

function calc(){
const m=st.m+" "+st.tipo,hz=new Set(),zs=new Set([...st.z].map(c=>COMP[c]?COMP[c][1]:c));
let h="";
for(const[re,tx,z]of H)if(re.test(m)){z.forEach(x=>hz.add(x));h+=`<p class="hint">${tx}</p>`;}
for(const t of st.t){if(T[t]){T[t][2].forEach(z=>hz.add(z));h+=`<p class="hint">${T[t][1]} ${T[t][3]}</p>`;}}
const any=st.w.size+st.s.size+st.z.size;
const all=C.filter(c=>!c.b||!st.fr||c.b.includes(st.fr)).map(c=>({c,v:c.p*.3+c.w.filter(x=>st.w.has(x)).length*3+(zs.has(c.z)?4:0)+(c.k||[]).filter(x=>st.z.has(x)).length*2+c.s.filter(x=>st.s.has(x)).length*2+(hz.has(c.z)?1.5:0)})).filter(x=>!any||x.v>x.c.p*.3+.01).sort((a,b)=>b.v-a.v),r=all.slice(0,12);
const zv={};all.forEach(x=>zv[x.c.z]=(zv[x.c.z]||0)+x.v);st.zv=zv;
const zt=Object.values(zv).reduce((a,b)=>a+b,0)||1;
const rawTop=topOf(zv,3);
const top=rawTop.length?rawTop.map(([z,v])=>[z,v/zt]):[["cuadro",1],["pedalier",0],["frenos",0]];
return{h,r,tot:r.reduce((a,x)=>a+x.v,0)||1,top};
}

function revision(c){

const conf=Math.max(5,Math.min(95,Math.round(p1*100*.6+(p1-p2)*100*.8+Math.min(n,10)*2.5))),lvl=conf>=65?"Alta":conf>=40?"Media":"Baja";
const zs=new Set([...st.z].map(k=>COMP[k]?COMP[k][1]:k)),tr=["pedalier","pedales","cadena","cassette","cambio"],any=a=>[...zs].some(z=>a.includes(z)),bad=[],al=[],miss=[];
if(st.w.has("sinpedal")&&any(tr))bad.push("Indicaste ruido al rodar sin pedalear, pero marcaste componentes de transmisión. Al no pedalear la cadena está quieta: comprueba bujes, ruedas, discos o cables.");

if(st.w.has("freno")&&st.w.size===1&&any(tr))bad.push("Si solo suena al frenar, es sumamente improbable que sea la transmisión.");
const t2=top.slice(0,2).map(t=>t[0]);
if(t2.includes("frenos"))al.push("Frenos: revisa el apriete de discos y estado de pastillas antes de salir a rodar rápido.");
if(c.r.slice(0,8).some(x=>x.c.n.startsWith("Grieta")))al.push("Riesgo estructural: ante cualquier sospecha de fisura en carbono o aluminio no uses la bici.");
if(!st.w.size)miss.push("Cuándo suena exactamente.");if(!st.s.size)miss.push("Qué sonido produce (crujido, clic, roce...).");
const cost={"Fácil":1,"Media":2,"Taller":3},plan=c.r.slice(0,6).map(x=>({c:x.c,sc:x.v/(cost[x.c.l]||2)})).sort((a,b)=>b.sc-a.sc).slice(0,4);
st.rev=`Confianza ${lvl} (${conf} %). Zona probable: ${Z[z1]||z1}. Plan sugerido: `+plan.map((x,i)=>(i+1)+") "+x.c.n).join("; ");

}

function startMic(){
  if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      micStream = stream;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      source.connect(analyser);
      st.audioState = "listening";
      peakHistory = [];
      go();
      setTimeout(drawScope, 100);
    }).catch(err => {
      alert("No se pudo acceder al micrófono: " + err.message);
    });
  } else {
    alert("Tu navegador no soporta captura de micrófono.");
  }
}

function stopMic(){
  if(micStream){
    micStream.getTracks().forEach(t => t.stop());
    micStream = null;
  }
  if(audioCtx){
    audioCtx.close();
    audioCtx = null;
  }
  if(animFrameId){
    cancelAnimationFrame(animFrameId);
  }
  st.audioState = "idle";
  go();
}

function drawScope(){
  const canvas = document.getElementById("scope");
  if(!canvas || !analyser) return;
  const ctx = canvas.getContext("2d");
  const bufferLength = analyser.frequencyBinCount;
  const timeData = new Uint8Array(bufferLength);
  const freqData = new Uint8Array(bufferLength);

  const renderFrame = () => {
    if(st.audioState !== 'listening') return;
    animFrameId = requestAnimationFrame(renderFrame);

    analyser.getByteTimeDomainData(timeData);
    analyser.getByteFrequencyData(freqData);

    ctx.fillStyle = '#0A1215';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.lineWidth = 2;
    ctx.strokeStyle = '#45C2B8';
    ctx.beginPath();
    const sliceWidth = canvas.width / bufferLength;
    let x = 0;
    let maxVal = 0;
    let maxFreqBin = 0;
    let peakVol = 0;

    for(let i = 0; i < bufferLength; i++) {
      const v = timeData[i] / 128.0;
      const y = v * canvas.height / 2;
      if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      x += sliceWidth;

      const diff = Math.abs(timeData[i] - 128);
      if(diff > maxVal) maxVal = diff;
      if(freqData[i] > peakVol){
        peakVol = freqData[i];
        maxFreqBin = i;
      }
    }
    ctx.stroke();

    // Detección de picos / transientes de clic
    const now = Date.now();
    if(maxVal > 30){
      if(peakHistory.length === 0 || (now - peakHistory[peakHistory.length - 1] > 180)){
        peakHistory.push(now);
        if(peakHistory.length > 8) peakHistory.shift();
      }
    }

    // Cálculo de BPM
    if(peakHistory.length >= 3){
      let intervals = [];
      for(let i=1; i<peakHistory.length; i++){
        intervals.push(peakHistory[i] - peakHistory[i-1]);
      }
      const avgInterval = intervals.reduce((a,b)=>a+b, 0) / intervals.length;
      const bpm = Math.round(60000 / avgInterval);
      if(bpm >= 40 && bpm <= 450){
        st.audioBPM = bpm;
        const bpmEl = document.getElementById("audio-bpm");
        if(bpmEl) bpmEl.textContent = bpm + " BPM";
        
        const subEl = document.getElementById("audio-bpm-sub");
        if(subEl){
          if(bpm <= 110){
            subEl.textContent = "Ritmo de pedaleo (60–90 rpm)";
            st.audioZone = "Transmisión, pedalier o bielas (ritmo de pedaleo)";
            st.audioConfidence = "88 %";
          } else {
            subEl.textContent = "Ritmo de giro de rueda (>150 rpm)";
            st.audioZone = "Ruedas, disco de freno o buje (ritmo de rueda)";
            st.audioConfidence = "85 %";
          }
        }
      }
    }

    // Frecuencia acústica dominante
    const sampleRate = audioCtx ? audioCtx.sampleRate : 44100;
    const dominantFreq = Math.round(maxFreqBin * sampleRate / 512);
    if(dominantFreq > 50){
      st.audioFreq = dominantFreq;
      const freqEl = document.getElementById("audio-freq");
      if(freqEl) freqEl.textContent = dominantFreq + " Hz";
      const diagEl = document.getElementById("audio-diag");
      if(diagEl){
        if(dominantFreq > 1800){
          diagEl.innerHTML = "<b>Diagnóstico acústico:</b> Frecuencia muy aguda (" + dominantFreq + " Hz) detectada. Apunta a <b>pastillas de freno contaminadas o disco</b>.";
        } else {
          diagEl.innerHTML = "<b>Diagnóstico acústico:</b> " + st.audioZone + " (Confianza: " + st.audioConfidence + ")";
        }
      }
    }
  };
  renderFrame();
}

function playSynth(type){
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);

  if(type === 'creak'){
    // Crujido de pedalier: tono grave modulado descendente con clic
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(160, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(70, ctx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.16);
    osc.start();
    osc.stop(ctx.currentTime + 0.18);
  } else if(type === 'click'){
    // Clic seco metálico
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(800, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.05);
    gain.gain.setValueAtTime(0.4, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.06);
    osc.start();
    osc.stop(ctx.currentTime + 0.07);
  } else if(type === 'squeal'){
    // Chirrido agudo de pastillas
    osc.type = 'sine';
    osc.frequency.setValueAtTime(2200, ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(2450, ctx.currentTime + 0.25);
    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.45);
    osc.start();
    osc.stop(ctx.currentTime + 0.5);
  } else if(type === 'slap'){
    // Traqueteo de cadena contra vaina
    osc.type = 'square';
    osc.frequency.setValueAtTime(240, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.35, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
    osc.start();
    osc.stop(ctx.currentTime + 0.12);
  }
}

const vCalc=()=>{
  const w = parseFloat(st.calcWeight) || 75;
  const isTubeless = st.calcSystem === 'tubeless';
  const widthNum = parseFloat(st.calcWidth) || 2.4;
  
  // Cálculo de presión de cubiertas adaptada
  let baseBarFront, baseBarRear;
  if(st.calcWidth.includes("28") || st.calcBike.includes("Carretera")){
    // Carretera 28c
    baseBarFront = 4.4 + (w - 70) * 0.035;
    baseBarRear = 4.8 + (w - 70) * 0.035;
  } else if(st.calcWidth.includes("40") || st.calcBike.includes("Gravel")){
    // Gravel 40c
    baseBarFront = 2.4 + (w - 70) * 0.02;
    baseBarRear = 2.7 + (w - 70) * 0.02;
  } else {
    // MTB 2.25 - 2.6
    baseBarFront = 1.35 + (w - 70) * 0.015 - (widthNum - 2.2) * 0.2;
    baseBarRear = 1.55 + (w - 70) * 0.015 - (widthNum - 2.2) * 0.2;
  }

  if(!isTubeless){
    baseBarFront += 0.3;
    baseBarRear += 0.3;
  }
  if(st.calcBike.includes("eMTB")){
    baseBarFront += 0.15;
    baseBarRear += 0.2;
  }

  const pFrontBar = Math.max(1.0, Math.min(8.0, baseBarFront)).toFixed(2);
  const pRearBar = Math.max(1.1, Math.min(8.5, baseBarRear)).toFixed(2);
  const pFrontPsi = Math.round(pFrontBar * 14.5038);
  const pRearPsi = Math.round(pRearBar * 14.5038);

  // Cálculo de SAG y presión de amortiguador/horquilla
  const forkPsi = Math.round(w * 1.15 + (st.calcBike.includes("eMTB") ? 15 : 0));
  const shockPsi = Math.round(w * 2.3 + (st.calcBike.includes("eMTB") ? 25 : 0));
  const sagPercent = st.calcBike.includes("Enduro") ? "30–35 % (descenso y tracción)" : st.calcBike.includes("XC") ? "20–25 % (firmeza)" : "25–30 % (polivalente)";

  return `

      <div>
        <label class="zn"><b>Tipo de bici:</b></label>
        <select id="inp-bike">
          ${TP_DETAILED.map(([n])=>`<option value="${n}" ${st.calcBike===n?'selected':''}>${n}</option>`).join("")}
        </select>
      </div>
      <div>
        <label class="zn"><b>Ancho de rueda:</b></label>
        <select id="inp-width">
          <option value="28" ${st.calcWidth==='28'?'selected':''}>700x28c Carretera</option>
          <option value="40" ${st.calcWidth==='40'?'selected':''}>700x40c Gravel</option>
          <option value="2.25" ${st.calcWidth==='2.25'?'selected':''}>29 x 2.25" XC</option>
          <option value="2.4" ${st.calcWidth==='2.4'?'selected':''}>29 x 2.40" Trail/Enduro</option>
          <option value="2.6" ${st.calcWidth==='2.6'?'selected':''}>29 x 2.60" eMTB</option>
        </select>
      </div>
    </div>

    <div class="opts" style="grid-template-columns:1fr 1fr; margin-bottom:16px;">
      <button class="opt ${st.calcSystem==='tubeless'?'sm':''}" data-a="setCalcSys" data-v="tubeless" aria-pressed="${st.calcSystem==='tubeless'}">
        <b>💧</b>Tubeless / Con Líquido
      </button>
      <button class="opt ${st.calcSystem==='tube'?'sm':''}" data-a="setCalcSys" data-v="tube" aria-pressed="${st.calcSystem==='tube'}">
        <b>⭕</b>Cámara convencional

    <h3 class="grp">Presión recomendada de neumáticos</h3>

      ${FR.map(([v,n,e])=>card("fr",v,n,e,st.fr===v)).join("")}
    </div>

    <h3 class="grp" style="margin-top:24px;">📊 Mantenimiento predictivo</h3>
    <p class="sub">Estado de salud de tu bici según las fechas de tus revisiones:</p>
    ${predictiveCards}

    <h3 class="grp" style="margin-top:24px;">💾 Copia de seguridad</h3>
    <div class="data-box">
      <button class="btn g" data-a="exportData">Exportar perfil y fechas (JSON)</button>
      <button class="btn g" data-a="importData">Importar perfil</button>
      <button class="btn g" data-a="clearDone">Limpiar historial</button>
    </div>
  </section>`;
};

function render(){
document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.v===st.tab));
document.getElementById("mine").textContent=[st.m,st.tipo].filter(Boolean).join(" · ");
document.querySelectorAll(".theme-pill").forEach(p=>p.setAttribute("aria-pressed",p.dataset.v===st.theme));
app.innerHTML=({home:vHome,noise:vNoise,audio:vAudio,sos:vSos,shop:vShop,calc:vCalc,bike:vBike})[st.tab]();
}

const go=()=>{render();scrollTo(0,0)};

function sheet(id){
const t=M.find(x=>x[0]===id);
if(!t)return;
dlg.innerHTML=`<div class="sh"><h2>${t[1]}</h2><div class="chips2"><span class="dg ${t[3][0]}">${t[3]}</span><span class="pill">⏱ ${t[4]}</span><span class="pill">📅 ${t[7]}</span></div><div class="price"><div><small>Hazlo tú mismo</small><b>${t[5]}</b></div><div><small>En taller mecánico</small><b>${t[6]}</b></div></div><h3>Herramientas necesarias</h3><p>${t[8]}</p><h3>Antes de empezar</h3><p>${(CP[t[2]]||CP["Transmisión"])[0]}</p><h3>Procedimiento paso a paso</h3><ol class="st">${t[9].map(s=>`<li><label><input type="checkbox"><span>${s}</span></label></li>`).join("")}</ol><h3>Al terminar</h3><p>${(CP[t[2]]||CP["Transmisión"])[1]}</p><p class="tip">${t[10]}</p><p class="zn">${st.done[id]?"Completado "+ago(st.done[id])+".":"Aún no marcado en tu historial."}</p><div class="nav"><button class="btn g" data-a="close">Cerrar</button><button class="btn" data-a="done" data-v="${id}">Marcar realizado hoy</button></div></div>`;
if(!dlg.open)dlg.showModal();
}

const same=(a,f)=>document.querySelectorAll(`[data-a=${a}]`).forEach(b=>b.setAttribute("aria-pressed",f(b)));

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  const pwaBtn = document.getElementById("pwa-btn");
  if(pwaBtn) pwaBtn.style.display = "inline-flex";
});

const act={
tab(el){st.tab=el.dataset.v;go()},
toBolts(){st.tab="noise";st.nv="res";st.sub="tornillos";go()},
sub(el){st.sub=el.dataset.v;go()},
setTheme(el){
  st.theme=el.dataset.v;
  document.documentElement.setAttribute("data-style",st.theme);
  save();
  same("setTheme",b=>b.dataset.v===st.theme);
  render();
},
next(){st.i++;if(st.i>=STEPS.length){st.nv="res";st.sub="zona";st.i=STEPS.length-1}go()},
wback(){st.i--;go()},back(){st.nv="wiz";go()},
reset(){st.nv="wiz";st.i=0;st.sub="zona";st.ask=false;st.fin=false;st.more=false;st.qa=[];["w","s","z","t"].forEach(k=>st[k].clear());go()},
begin(){st.ask=true;go()},more(){st.more=true;st.fin=false;go()},finish(){st.fin=true;go()},
ans(el){st.qa.push([st.cur,el.dataset.v]);go()},undo(){st.qa.pop();st.fin=false;go()},
tipo(el){st.tipo=el.dataset.v;save();same("tipo",b=>b===el);render()},
fr(el){st.fr=st.fr===el.dataset.v?"":el.dataset.v;save();same("fr",b=>b.dataset.v===st.fr)},
tog(el){const{k,v}=el.dataset;st[k].has(v)?st[k].delete(v):st[k].add(v);el.setAttribute("aria-pressed",st[k].has(v))},
shop(el){st.shop=el.dataset.v;st.dif="Todas";st.cat="Todas";go()},
cat(el){st.cat=el.dataset.v;go()},dif(el){st.dif=el.dataset.v;go()},
task(el){sheet(el.dataset.v)},close(){dlg.close()},
done(el){st.done[el.dataset.v]=Date.now();ls.set("bici-hechos",st.done);sheet(el.dataset.v);render()},
startMic(){startMic()},
stopMic(){stopMic()},
playSynth(el){playSynth(el.dataset.v)},
setCalcSys(el){st.calcSystem=el.dataset.v;render()},
exportData(){
  const blob=new Blob([JSON.stringify({perfil:{m:st.m,tipo:st.tipo,shock:st.shock,fork:st.fork,drivetrain:st.drivetrain,fr:st.fr,theme:st.theme},hechos:st.done},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="mi-bici-taller.json";a.click();
},
importData(){
  const input=document.createElement("input");input.type="file";input.accept=".json";
  input.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(d.perfil){
          st.m=d.perfil.m||"";st.tipo=d.perfil.tipo||"XC / Cross Country";
          st.shock=d.perfil.shock||"air_inline";st.fork=d.perfil.fork||"trail";
          st.drivetrain=d.perfil.drivetrain||"1x12_mech";st.fr=d.perfil.fr||"disco_hid";
          st.theme=d.perfil.theme||"mint";
          document.documentElement.setAttribute("data-style",st.theme);save();
        }
        if(d.hechos){st.done=d.hechos;ls.set("bici-hechos",st.done);}
        alert("Datos importados con éxito");go();
      }catch(err){alert("Archivo no válido");}
    };
    r.readAsText(file);
  };
  input.click();
},
clearDone(){
  if(confirm("¿Seguro que quieres borrar el registro de tareas hechas?")){
    st.done={};ls.set("bici-hechos",st.done);go();
  }
},
installPWA(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(()=>{deferredPrompt = null;});
  } else {
    alert("Para instalar en iOS: toca Compartir -> 'Añadir a pantalla de inicio'.\nEn Android / Chrome: toca el menú de 3 puntos -> 'Instalar app'.");
  }
},
async copy(el){
 const l=(k,o)=>[...st[k]].map(i=>o[i]).join(", ")||"–",f=FR.find(x=>x[0]===st.fr);
 try{
   await navigator.clipboard.writeText(`Bici: ${st.m||"sin especificar"} (${st.tipo}${f?", "+f[1]:""})
Amortiguador: ${st.shock}
Horquilla: ${st.fork}
Transmisión: ${st.drivetrain}
Terreno: ${l("t",TL)}
Cuándo suena: ${l("w",W)}
Tipo de ruido: ${l("s",S)}
Componentes: ${l("z",CL)}${st.qa.length?"\nPruebas: "+st.qa.map(([i,a])=>QS[i].t+" → "+({s:"Sí",n:"No",x:"No sé"})[a]).join("; "):""}${st.rev?"\nInforme: "+st.rev:""}`);
   el.textContent="¡Copiado al portapapeles!";
 }catch(e){el.textContent="No se pudo copiar";}
 setTimeout(()=>el.textContent="Copiar diagnóstico",1800);
}
};

document.body.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(el&&act[el.dataset.a])act[el.dataset.a](el)});
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
document.body.addEventListener("input",e=>{
 if(e.target.id==="q"){st.q=e.target.value;document.getElementById("list").innerHTML=listHTML();}
 if(e.target.id==="mod"){st.m=e.target.value;save();document.getElementById("mine").textContent=[st.m,st.tipo].filter(Boolean).join(" · ");}
 if(e.target.id==="inp-w"){st.calcWeight=e.target.value;render();}
});

document.body.addEventListener("change",e=>{
  if(e.target.id==="sel-tipo"){st.tipo=e.target.value;save();render();}
  if(e.target.id==="sel-shock"){st.shock=e.target.value;save();}
  if(e.target.id==="sel-fork"){st.fork=e.target.value;save();}
  if(e.target.id==="sel-drivetrain"){st.drivetrain=e.target.value;save();}
  if(e.target.id==="inp-bike"){st.calcBike=e.target.value;render();}
  if(e.target.id==="inp-width"){st.calcWidth=e.target.value;render();}
});

render();
</script>
</body>
</html>
