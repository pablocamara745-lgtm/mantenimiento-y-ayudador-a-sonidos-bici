*,*::before,*::after{box-sizing:border-box}

.opts.sm{grid-template-columns:repeat(auto-fill,minmax(125px,1fr));margin-bottom:6px}.opt.sm{padding:12px 8px;font-size:15px;border-radius:18px}.grp{font-size:16px;font-weight:800;margin:18px 0 8px}
.card+.card{margin-top:16px}.bike{width:100%;height:auto;display:block;margin:0 0 12px}.bike .fr{stroke:var(--ink);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.bike .wh{stroke:var(--mu);stroke-width:6;fill:none}.dot{fill:var(--ln)}.hot{fill:var(--ac)}.bike text{fill:var(--on);font:800 16px var(--font-family);text-anchor:middle}

.chk{list-style:none;padding:0;margin:0}.chk li{margin-bottom:8px}.chk label{display:grid;grid-template-columns:24px 1fr;gap:10px;cursor:pointer}.chk input{width:20px;height:20px;accent-color:var(--ac)}.chk input:checked+span{text-decoration:line-through;color:var(--mu)}
.alert{background:var(--wa);color:var(--on);border-radius:18px;padding:12px 16px;margin:0 0 10px;font-weight:700}
.opt:active{transform:scale(.96)}
.opt[aria-pressed=true]{background:var(--ac);color:var(--on);border-color:var(--ac)}
@media (hover:hover) and (pointer:fine){.opt:hover{border-color:var(--ac)}}
input[type=text],input[type=number],select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid transparent;border-radius:99px;padding:12px 18px;margin-bottom:14px}
select{border-radius:20px}

details.r{background:var(--bg);border-radius:22px;margin-bottom:10px;overflow:hidden}

.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;background:var(--sf);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20;overflow-x:auto}

.tabs b{font-size:18px;line-height:1}.tabs button[aria-current=true]{background:var(--ac2);color:var(--ink)}

.hero h2{margin:6px 0 4px}.big{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin:16px 0 14px}

.tile b{font-size:38px;line-height:1}.tile .tt{font-size:20px;font-weight:800}.tile .ts{opacity:.92;font-size:14px}.tile.a{background:var(--ac)}.tile.b{background:var(--wa)}.tile.c{background:#2E6047}.tile.d{background:#0284C7}.tile:active{transform:scale(.98)}
.mini{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.mini .opt{flex-direction:row;padding:10px 14px;border-radius:99px;font-size:14px}
.seg{display:flex;gap:6px;background:var(--sf);border-radius:99px;padding:4px;margin-bottom:14px;overflow-x:auto}
.seg button{flex:1;font:inherit;font-weight:700;border:0;border-radius:99px;padding:8px 12px;background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap;font-size:14px}
.seg button[aria-selected=true]{background:var(--ac);color:var(--on)}
.step{color:var(--ac);font-weight:800;margin:0 0 4px}
.fl{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}.fl .opt{flex:none;flex-direction:row;padding:8px 12px;border-radius:99px;font-size:13px}
.tk{font:inherit;color:var(--ink);text-align:left;width:100%;background:var(--sf);border:0;border-radius:20px;padding:14px 16px;margin-bottom:8px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;transition:transform 140ms}
.tk:active{transform:scale(.99)}.tk .zn{grid-column:1/-1}
.dg{border-radius:99px;padding:2px 10px;font-size:12px;font-weight:800;background:var(--ac2);color:var(--ink);white-space:nowrap}.dg.M{background:var(--wa);color:var(--on)}.dg.T{background:var(--ink);color:var(--bg)}
dialog{border:0;border-radius:28px 28px 0 0;padding:0;max-width:640px;width:100%;margin:auto auto 0;background:var(--sf);color:var(--ink)}
dialog::backdrop{background:rgba(10,20,25,.55)}dialog[open]{animation:in 220ms cubic-bezier(.23,1,.32,1)}
.sh{padding:22px 18px calc(24px + env(safe-area-inset-bottom,0px));overflow:auto;max-height:88vh}
.chips2{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.price{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.price div{background:var(--bg);border-radius:18px;padding:10px 14px}.price small{display:block;color:var(--mu)}
.data-box{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.theme-picker{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.theme-picker button{font:inherit;font-size:13px;font-weight:700;border:2px solid transparent;border-radius:99px;padding:6px 14px;cursor:pointer;background:var(--bg);color:var(--ink);transition:all 140ms}
.theme-picker button[aria-pressed=true]{border-color:var(--ac);background:var(--ac2);color:var(--ink)}

.scope-canvas{width:100%;height:100%}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px}
.status-pill.ok{background:#DCFCE7;color:#166534}

.calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.calc-result{background:var(--bg);border-radius:20px;padding:14px;text-align:center}
.calc-result b{font-size:26px;display:block;color:var(--ac)}
.rep-card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:14px;margin-bottom:8px}
.rep-card h4{margin:0 0 4px;font-size:15px;font-weight:800}
.rep-card .p-tag{font-size:13px;font-weight:800;color:var(--ac)}

.sound-btn:active{transform:scale(.97)}
</style>

<script>
const THEMES=[["mint","🌿 Menta & Bio"],["industrial","🏁 Industrial Mono"],["stealth","⚡ Racing Pro"],["gravel","🚵 Gravel Aventura"]];
const W={pedal_fuerte:"Pedaleando fuerte o subiendo",pedal_suave:"Pedaleando suave",vuelta:"Una vez por vuelta de pedal",parado:"De pie sobre los pedales",freno:"Al frenar",cambio:"Al cambiar de marcha",bache:"En baches o terreno roto",sinpedal:"Rodando sin pedalear",curva:"En curvas",humedad:"Con lluvia o humedad"};
const S={crujido:"Crujido",click:"Clic o chasquido",chirrido:"Chirrido",roce:"Roce o frote",zumbido:"Zumbido",golpeteo:"Golpeteo o traqueteo",rechinar:"Rechinar metálico",silbido:"Silbido"};
const Z={pedales:"Pedales",pedalier:"Pedalier y bielas",cadena:"Cadena y transmisión",cassette:"Cassette y rueda libre",cambio:"Cambios y desviadores",frenos:"Frenos",ruedas:"Ruedas y radios",buje:"Bujes",direccion:"Dirección y manillar",sillin:"Sillín y tija",cuadro:"Cuadro, cables y accesorios",suspension:"Suspensión",neumaticos:"Neumáticos",motor:"Motor eléctrico"};

const C = [{"n":"Caja de pedalier seca o floja","pr":"Grasa 5 € · caja nueva 15–80 € · taller 20–35 €","k":["eje_biela","pedalier"],"z":"pedalier","w":["pedal_fuerte","vuelta","parado"],"s":["crujido","click","golpeteo"],"p":5,"l":"Media","t":"30–60 min","h":"Extractor de cazoletas, grasa, llave dinamométrica","why":"Es la causa más habitual de crujidos al pedalear fuerte. El agua y el polvo resecan roscas o encajes a presión y el metal roza cuando el cuadro flexa.","st":["Descarta antes lo fácil: quita los pedales, prueba de pie y engrasa la tija. Si el crujido sigue en cada vuelta de biela y bajo carga, continúa con la caja.","Identifica tu tipo de caja: roscada (cazoletas que se enroscan en el cuadro, BSA o italiana) o a presión (BB86, BB30, PF30: se encajan sin rosca). Míralo en las cazoletas o en el manual de tu cuadro.","Desmonta las bielas siguiendo el sistema de tu marca (Hollowtech, DUB, cuadradillo…). Saca la cadena del plato o quita el pedalier con la cadena suelta.","Extrae las cazoletas con la llave específica de tu caja. En rosca inglesa (BSA) el lado de la transmisión tiene rosca inversa; en rosca italiana ambos lados son normales. Mira las flechas grabadas antes de forzar.","Limpia el interior del tubo del cuadro y las cazoletas con desengrasante y un trapo. Revisa roscas dañadas, óxido o restos de pintura.","Monta: en caja roscada pon grasa en las roscas; en caja a presión usa retenedor de rodamientos (fijación media) y no pongas grasa en el encaje. Aprieta al par que marque la caja (en roscadas suele estar entre 35 y 50 N·m).","Monta las bielas con el par de tu sistema y comprueba que el eje gira suave con la cadena quitada.","Pruébalo pedaleando fuerte y de pie, y repite tras 10–20 km porque algunas cajas se asientan."],"er":"Apretar las cazoletas en el sentido contrario, poner grasa en un encaje a presión, o dar por hecho que el crujido es del pedalier sin descartar pedales, tija y sillín.","ok":"Con la cadena quitada, el eje gira suave y sin ruido. En una cuesta, pedaleando fuerte, ya no cruje.","tip":"Un crujido al pedalear con fuerza suele venir de pedalier, bielas o pedales, pero también de sillín, tija o potencia: descártalos antes."},{"n":"Bielas, platos o tornillos flojos","pr":"Gratis · tornillos 5–15 €","k":["monoplato","eje_biela","biela","platos"],"z":"pedalier","w":["vuelta","pedal_fuerte"],"s":["click","crujido"],"p":3,"l":"Fácil","t":"15 min","h":"Llaves allen, grasa, llave dinamométrica","why":"Los tornillos de biela y de platos se aflojan con la carga y dejan un pequeño juego que suena una vez por vuelta.","st":["Con la bici sujeta, agarra cada biela y empújala de lado a lado y hacia ti: no debe moverse nada.","Localiza el sistema de fijación de tu biela: tornillo central con tapa (Hollowtech), tornillo y tuerca (DUB), cuadradillo con tornillo grande. Cada uno tiene su orden y su par.","Aprieta el tornillo o las abrazaderas al par que marque tu biela con una llave dinamométrica. No lo hagas a ojo: un exceso daña el eje y un defecto deja juego.","Revisa uno a uno los tornillos de los platos; aprieta en cruz y al par del fabricante (suelen estar entre 8 y 12 N·m).","Si sigue habiendo juego, desmonta la biela y mira las estrías del eje: si están redondeadas, hay que cambiar biela o eje.","Limpia la interfaz biela-eje y engrasa solo si el fabricante lo permite; en algunas bielas de carbono se usa pasta de montaje o nada.","Gira los platos y mira que pasen rectos junto a un punto fijo (por ejemplo, el cuadro): si bailan, hay un plato torcido o un tornillo flojo.","Prueba pedaleando fuerte de pie."],"er":"Apretar sin llave dinamométrica, mezclar tornillos de platos de distintos modelos o seguir pedaleando con una biela floja (daña el eje).","ok":"La biela no se mueve al empujarla, los platos giran rectos y no hay crujido al acelerar.","tip":"Aprieta los tornillos de los platos en estrella, de forma alterna."},{"n":"Pedales o ejes de pedal secos","pr":"Grasa 5 € · pedales nuevos 15–80 €","k":["pedales"],"z":"pedales","w":["vuelta","pedal_fuerte","parado"],"s":["click","crujido","chirrido"],"p":4,"l":"Fácil","t":"20 min","h":"Llave de pedal, grasa","why":"La rosca seca o el eje con holgura producen clics en cada pedalada, muy confundidos con el pedalier.","st":["Aísla cuál suena: pedalea con un solo pie en el pedal y el otro pie apoyado sin presionar, y alterna.","Quita el pedal sospechoso con llave de pedal de 15 mm o allen de 8 mm por detrás. El pedal derecho se afloja girando hacia atrás; el izquierdo tiene rosca inversa y se afloja girando hacia adelante.","Limpia la rosca del pedal y la de la biela con trapo y desengrasante.","Pon grasa en la rosca del pedal y empieza a enroscarlo a mano para no cruzar la rosca; luego aprieta a unos 35–55 N·m.","Mueve el eje del pedal con la mano: si tiene juego o gira áspero, el rodamiento está dañado; cámbialo si es recambiable o cambia el pedal.","En pedales automáticos revisa también el mecanismo y el muelle de retención según el manual del pedal.","Comprueba que las calas estén bien apretadas (ver causa de calas)."],"er":"Cruzar la rosca (se nota duro al principio) o olvidar que el pedal izquierdo es de rosca inversa.","ok":"El eje gira suave y sin juego, y pedaleando con un solo pie no hay clics.","tip":"Prueba a pedalear con unos pedales de otra bici: es el descarte más rápido."},{"n":"Cadena seca o sucia","pr":"Lubricante 6–15 €","k":["guia","falsa","cadena"],"z":"cadena","w":["pedal_suave","humedad","cambio"],"s":["chirrido","roce","click"],"p":4,"l":"Fácil","t":"20 min","h":"Desengrasante, trapo, lubricante","why":"Una cadena sin lubricar chirría, sobre todo tras lluvia. La suciedad en los rodillos añade clics y desgaste.","st":["Observa la cadena: si está marrón o negra con polvo pegado, o si suena a chirrido fino, le falta lubricante o está sucia.","Si tienes limpiacadenas, úsalo; si no, pasa un trapo con desengrasante por la cadena mientras giras las bielas hacia atrás durante 30–60 segundos.","Limpia también platos, piñones y roldanas del cambio con un cepillo, porque la suciedad vuelve a la cadena.","Seca la cadena por completo: restos de desengrasante o agua diluyen el lubricante nuevo.","Con la bici sujeta, aplica una gota de lubricante en cada rodillo girando las bielas hacia atrás. Usa lubricante húmedo para lluvia o barro, y seco o de cera para polvo.","Deja actuar 10–15 minutos y luego presiona un trapo contra la cadena mientras giras: la parte exterior debe quedar casi seca.","Mide el desgaste con un medidor para descartar que la cadena esté estirada (ver causa de cadena desgastada)."],"er":"Lubricar por fuera en exceso (atrae suciedad), usar un desplazador de agua como lubricante duradero o lubricar sobre cadena sucia.","ok":"La cadena gira en silencio en todas las marchas durante cinco minutos de prueba.","tip":"Lubricante húmedo para lluvia, seco para polvo. Demasiado aceite atrae más suciedad."},{"n":"Cadena desgastada o eslabón rígido","pr":"Cadena 15–60 € · taller 10–20 €","k":["falsa","guia","cadena"],"z":"cadena","w":["pedal_fuerte","cambio","vuelta"],"s":["click","golpeteo","crujido"],"p":3,"l":"Media","t":"30 min","h":"Medidor de desgaste, tronchacadenas, cadena nueva","why":"Un eslabón que no flexiona salta al pasar por el desviador y hace clic con una frecuencia fija. Una cadena estirada además salta bajo carga.","st":["Pedalea hacia atrás despacio y observa cada eslabón al pasar por las roldanas: uno que se quede rígido o que salte indica un eslabón rígido.","Flexiona ese eslabón con los dedos de lado a lado hasta que se afloje. Si no mejora, sustituye el eslabón o la cadena.","Mide el desgaste con un medidor: alrededor del 0,5 % es el momento de cambiar la cadena en 11–12 velocidades; con más desgaste, el cassette empieza a dañarse y habrá que cambiarlo también.","Para cambiar la cadena, haz una foto del recorrido por el cambio y ábrela con la falsa unión o con el tronchacadenas.","Iguala la longitud de la cadena nueva a la vieja y comprueba con la bici en el plato grande y el piñón más grande: el cambio no debe quedar totalmente estirado.","Cierra la falsa unión nueva (no reutilices la de otra cadena) hasta oír el clic y flexiona el eslabón para comprobar que no queda rígido.","Lubrica y prueba todas las marchas."],"er":"Reutilizar una falsa unión usada, mezclar velocidades distintas o poner una cadena nueva sobre un cassette muy gastado (salta bajo carga).","ok":"La cadena pasa sin saltos y sin clic en todos los piñones bajo carga.","tip":"Cambiar la cadena a tiempo alarga la vida de cassette y platos."},{"n":"Desviadores desajustados o con roce","pr":"Gratis · taller 10–25 €","k":["jaula","patilla","desv_tras","desv_del","mandos"],"z":"cambio","w":["cambio","pedal_suave","pedal_fuerte"],"s":["roce","chirrido","zumbido","click"],"p":5,"l":"Media","t":"20–40 min","h":"Llaves allen, destornillador, lubricante","why":"Si el ruido depende de la marcha, casi siempre es tensión de cable, límites mal ajustados o una patilla del cambio ligeramente torcida.","st":["Con la bici en el soporte, pedalea y observa: anota si suena en el cambio trasero o en el desviador delantero y en qué marchas.","Cambio trasero: si la cadena tarda en subir a un piñón más grande, gira el ajustador de barril un cuarto de vuelta en sentido antihorario (tensa el cable); si tarda en bajar, gira en sentido contrario.","Si roza en el piñón vecino, mueve el barril un cuarto en el sentido contrario hasta que el roce desaparezca.","Comprueba los tornillos de límite H y L: con la cadena en el piñón más pequeño y en el más grande, el cambio no debe pasarse. Mueve los límites en medios giros.","Mira el cambio desde atrás: debe quedar alineado con los piñones. Si queda torcido, puede estar doblada la patilla (ver tarea de patilla).","Desviador delantero: debe quedar paralelo al plato y a 1–3 mm sobre el plato grande. Ajusta los límites L y H para que la cadena no se pase.","Revisa cables y fundas: oxidados o aplastados hacen que el cambio no vuelva bien. Cámbialos si dudas."],"er":"Mover varios tornillos a la vez, ajustar el barril con la cadena en un piñón grande o ignorar una patilla torcida.","ok":"Cambios limpios subiendo y bajando, sin roce ni saltos.","tip":"Un cable oxidado o con funda sucia da cambios lentos y ruido. Cámbialos cada año."},{"n":"Cassette o rueda libre","pr":"Cassette 25–120 € · rueda libre 20–60 €","k":["rueda_libre","cassette","buje_tras"],"z":"cassette","w":["pedal_fuerte","sinpedal"],"s":["click","crujido","zumbido"],"p":3,"l":"Media","t":"30 min","h":"Llave de cassette, látigo, grasa","why":"El cierre del cassette flojo o el cuerpo de rueda libre seco producen crujidos bajo carga. El zumbido al no pedalear suele ser normal.","st":["Con la rueda trasera en el aire, gira el pedal y escucha: un trinquete que hace clic al rodar sin pedalear es normal; un crujido o roce al pedalear con fuerza no lo es.","Quita la rueda trasera y comprueba que el cierre del cassette esté apretado (unos 40 N·m) con la llave de cassette y el látigo.","Si el cassette se mueve, desmóntalo y limpia las estrías del cuerpo de rueda libre; engrasa ligeramente y monta de nuevo.","Comprueba que los espaciadores estén en el orden correcto y no falte ninguno.","Mira el cuerpo de rueda libre: si hay arañazos profundos o juego, cámbialo o llévalo al taller.","Si el trinquete patina, límpialo y lubrica con aceite ligero según el manual del buje; si sigue patinando, cámbialo."],"er":"Apretar el cierre sin látigo, mezclar espaciadores o usar grasa gruesa en el trinquete (se pega y patina).","ok":"No hay crujido al pedalear fuerte de pie y la rueda libre no patina bajo carga.","tip":"Un zumbido al rodar sin pedalear no suele ser un fallo."},{"n":"Radios sueltos o rueda descentrada","pr":"Taller 15–35 €","k":["cinta","nipples","radios","llanta"],"z":"ruedas","w":["bache","pedal_fuerte","curva"],"s":["click","crujido","golpeteo"],"p":3,"l":"Taller","t":"Taller","h":"Llave de radios, soporte de centrado","why":"Los radios con poca tensión crujen al cargar la rueda, y un eje pasante mal apretado hace clic en los baches.","st":["Gira la rueda y mira si roza o salta en algún punto del freno o del cuadro; marca el punto.","Pellizca pares de radios con la mano: todos deben tener una tensión parecida y ninguno debe estar flojo.","Golpea cada radio con la punta de una llave: deben dar un tono parecido; uno más grave está flojo.","Con llave de radios, aprieta el nipple de un radio flojo un cuarto de vuelta, alternando lados, y comprueba el efecto.","Revisa que ningún nipple esté torcido o roto.","Si varios radios están flojos o la rueda sigue descentrada, llévala a un taller con soporte de centrado."],"er":"Apretar sin soporte de centrado, apretar mucho un solo radio (deforma la llanta) o ignorar radios rotos.","ok":"La rueda gira recta y no hay tic en cada vuelta.","tip":"Un clic metálico cada vuelta de rueda, en vez de cada pedalada, apunta a la rueda."},{"n":"Rodamientos de buje con juego","pr":"Rodamientos 5–20 € · taller 25–50 €","k":["buje_del","buje_tras"],"z":"buje","w":["sinpedal","curva","bache"],"s":["zumbido","rechinar","golpeteo"],"p":3,"l":"Media","t":"45 min","h":"Llaves de conos, grasa, rodamientos","why":"Un rodamiento seco o picado deja un zumbido continuo al rodar y juego lateral en la rueda.","st":["Con la rueda fuera de la bici, agarra el eje por ambos lados y empuja de lado a lado: no debe haber juego.","Gira el eje con los dedos: debe ir suave y sin zonas ásperas.","Si hay juego en un buje de conos, ajusta el cono con las llaves de conos hasta quitar el juego sin dejarlo duro.","Si el buje usa rodamientos de cartucho, desmonta y cámbialos con las herramientas adecuadas.","Limpia y engrasa con grasa para rodamientos antes de montar.","Monta y comprueba que gira suave y sin juego."],"er":"Apretar el cono hasta que el eje queda duro (destruye el rodamiento) o usar grasa inadecuada.","ok":"La rueda gira libre y sin zumbido ni juego.","tip":"Un ruido que sube con la velocidad y sigue sin pedalear suele ser buje, freno o cubierta."},{"n":"Dirección, potencia o manillar con juego","pr":"Grasa 5 € · cazoletas 15–40 € · taller 20–45 €","k":["tapa","punos","direccion","potencia","manillar"],"z":"direccion","w":["freno","bache","parado","pedal_fuerte"],"s":["golpeteo","crujido","click"],"p":4,"l":"Media","t":"30–45 min","h":"Llaves allen, llave dinamométrica, grasa","why":"Un clac al frenar con la rueda delantera indica juego en la dirección. Un crujido de pie suele venir de potencia o manillar.","st":["Con el freno delantero apretado, mece la bici adelante y atrás: un golpe seco (clac) indica juego en la dirección.","Afloja los tornillos de la potencia en el tubo de dirección y aprieta suavemente el tornillo de la tapa superior para quitar el juego; la dirección debe girar libre.","Aprieta los tornillos de la potencia en el tubo de dirección al par del fabricante (suele estar entre 5 y 8 N·m), alternando entre ellos.","Si persiste, desmonta la dirección: saca la potencia, la horquilla y las cazoletas, limpia y revisa rodamientos y asientos.","Engrasa los rodamientos o cámbialos si hay muescas o dureza.","Monta en orden y vuelve a ajustar la precarga.","Comprueba los tornillos de la potencia al manillar (suelen estar entre 4 y 6 N·m) y los de las manetas."],"er":"Apretar el tornillo de la tapa como si fuera de fijación (solo da precarga) o apretar la potencia sin quitar el juego primero.","ok":"No hay golpe al frenar y mecer, y la dirección gira libre y sin dureza.","tip":"En piezas de carbono nunca superes el par: se agrietan sin avisar."},{"n":"Sillín, tija o abrazadera","pr":"Grasa o pasta 5–12 € · tija 20–90 €","k":["sillin","tija"],"z":"sillin","w":["pedal_fuerte","parado","bache"],"s":["crujido","chirrido","click"],"p":4,"l":"Fácil","t":"15 min","h":"Allen, grasa o pasta de carbono","why":"Es una fuente muy común y fácil de confundir con el pedalier. Los raíles y la tija reseca crujen al cargar el peso.","st":["Pedalea de pie: si el crujido desaparece, el origen es sillín o tija.","Aprieta la abrazadera de la tija y el tornillo del sillín a su par (la abrazadera suele estar entre 5 y 7 N·m; en carbono respeta el valor marcado).","Saca la tija, limpia el tubo de sillín y la tija con un trapo.","Engrasa tija y tubo si son de metal, o aplica pasta de montaje si son de carbono, y vuelve a montar a la altura marcada.","Revisa los raíles del sillín y las pinzas: busca grietas o desgaste.","Comprueba que el sillín esté recto y la abrazadera no esté agrietada."],"er":"Poner grasa en una tija de carbono o apretar de más.","ok":"Sin crujidos al pedalear de pie ni al pasar baches.","tip":"Antes de desmontar el pedalier, prueba a pedalear de pie."},{"n":"Suspensión y pivotes","pr":"Grasa 5–10 € · servicio 50–120 €","k":["remoto","retenes","bieleta","amortiguador","horquilla","pivotes"],"z":"suspension","w":["bache","pedal_fuerte","curva"],"s":["golpeteo","chirrido","crujido"],"p":2,"l":"Media","t":"60 min","h":"Llaves, llave dinamométrica, grasa de pivotes","why":"Los pivotes y casquillos secos o flojos crujen al comprimirse. El vástago sucio de la horquilla chirría.","st":["Limpia vástagos y estancos de la horquilla con un trapo y mira si hay aceite.","Comprueba la presión y el SAG según las tablas del fabricante.","Agita el basculante lateralmente y comprueba si hay juego en los pivotes.","Revisa los tornillos de los pivotes con llave dinamométrica y el par del fabricante.","Si cruje al comprimir, desmonta y engrasa pivotes y casquillos.","Haz el servicio de horquilla y amortiguador según las horas de uso.","Revisa el mando remoto y los cables."],"er":"Aplicar chorro a presión sobre retenes y pivotes o usar grasa inadecuada.","ok":"La suspensión comprime en silencio y no hay juego lateral.","tip":"Ruido en cada compresión del amortiguador apunta casi siempre a pivotes o casquillos."},{"n":"Cables y accesorios sueltos","pr":"Bridas 2–5 €","k":["guardabarros","portabultos","botellero","luces","cables"],"z":"cuadro","w":["bache","curva","sinpedal"],"s":["golpeteo","roce","zumbido"],"p":3,"l":"Fácil","t":"15 min","h":"Bridas, cinta, destornillador","why":"Fundas que golpean el cuadro, botellero, portabultos, guardabarros o luz mal fijados suenan igual que un fallo mecánico.","st":["Sacude la bici en el suelo y escucha dónde suena: el golpe de un cable o accesorio es inmediato.","Fija cables y fundas con bridas o con protectores de cuadro.","Revisa botellero, portabultos, guardabarros, luces y soportes: aprieta tornillos y pon arandelas de goma si tienen holgura.","Retira accesorios uno a uno y prueba después de cada uno.","Comprueba que nada roce la cubierta ni la llanta."],"er":"Apretar de más tornillos de botellero en carbono o dejar un cable roce contra el cuadro sin protector.","ok":"La bici no suena al sacudirla ni al pasar baches.","tip":"Antes de desmontar piezas caras, comprueba lo más barato: accesorios y cables."},{"n":"Pastillas de disco contaminadas o glaseadas","pr":"Pastillas 10–35 € el par · alcohol 4 €","b":["disco_hid","disco_mec"],"k":["pastillas","disco"],"z":"frenos","w":["freno","humedad"],"s":["chirrido","silbido"],"p":5,"l":"Fácil","t":"20 min","h":"Alcohol isopropílico, lija fina, pastillas","why":"El aceite, el barro o el sobrecalentamiento dejan la pastilla vitrificada o sucia y el disco vibra al frenar.","st":["Quita la rueda y saca las pastillas siguiendo el sistema de tu pinza.","Mira la superficie: brillante (glaseada) o con manchas oscuras de aceite indica contaminación.","Si solo están glaseadas, lija con papel de grano fino (400 o más fino) sobre una superficie plana hasta quitar el brillo y limpia con alcohol.","Si tienen aceite o grasa, cámbialas: no se recuperan, sobre todo las orgánicas.","Limpia el disco con alcohol isopropílico y un trapo limpio por ambas caras.","Limpia la pinza y los pistones sin dejar fluido.","Monta pastillas y rueda, y asienta con frenadas progresivas."],"er":"Usar spray de cadena o desengrasante cerca del disco, tocar la superficie con los dedos o lijar pastillas con aceite (lo incrusta).","ok":"Frena sin chirrido y con fuerza constante en seco y mojado.","tip":"No toques disco ni pastillas con los dedos ni con spray de cadena."},{"n":"Disco torcido o pinza descentrada","pr":"Disco 15–50 € · taller 10–20 €","b":["disco_hid","disco_mec"],"k":["tdisco","disco","pinza"],"z":"frenos","w":["sinpedal","curva","freno"],"s":["roce","zumbido"],"p":4,"l":"Fácil","t":"20 min","h":"Allen, llave de disco o llave grifa","why":"Un roce rítmico en cada vuelta indica disco alabeado; uno constante, pinza mal centrada.","st":["Gira la rueda y mira por la ranura de la pinza dónde roza el disco: en una zona o durante toda la vuelta.","Si roza toda la vuelta, centra la pinza: afloja un poco los dos tornillos, aprieta la maneta y mantenla apretada mientras aprietas los tornillos.","Si roza en una zona, endereza el disco con la herramienta adecuada con mucho cuidado; si está muy doblado, cámbialo.","Comprueba el grosor del disco: si está por debajo del mínimo grabado, cámbialo.","Comprueba que los tornillos del disco estén apretados.","Vuelve a montar la rueda asegurándote de que asienta bien en las patillas."],"er":"Forzar el disco sin herramienta, apretar los tornillos de la pinza sin mantener la maneta o dejar pastillas casi sin material.","ok":"La rueda gira libre y no roza al mirar por la ranura de la pinza.","tip":"Cámbialo si queda por debajo del grosor mínimo grabado en el disco."},{"n":"Pistones pegados o aire en el circuito","pr":"Kit de purga 15–30 € · taller 25–45 €","b":["disco_hid"],"k":["pinza","maneta","manguera"],"z":"frenos","w":["freno","sinpedal"],"s":["roce","chirrido","golpeteo"],"p":3,"l":"Media","t":"45 min","h":"Kit de purga, fluido correcto, espátula","why":"Un pistón que no retrocede deja la pastilla pegada, y una maneta esponjosa sugiere aire.","st":["Quita la rueda y las pastillas. Mira si los pistones salen de forma pareja.","Empuja los pistones con la espátula de plástico; si uno no vuelve o queda atascado, límpialo con alcohol y un cepillo suave.","Aprieta la maneta con un separador entre pastillas para mover los pistones y límpialos; repite hasta que ambos se muevan parejos.","Si la maneta está esponjosa, purga el circuito con el fluido que indique la marca (DOT o aceite mineral) y un kit de purga.","Comprueba fugas en la pinza y el latiguillo.","Si hay fugas o no se mueven, lleva el freno a un taller."],"er":"Mezclar fluidos, dejar fluido sobre las pastillas o aflojar tornillos de la pinza sin control.","ok":"La maneta queda firme con recorrido corto y los pistones salen parejos.","tip":"DOT y aceite mineral nunca se mezclan: usa el que indique la maneta."},{"n":"Frenos de llanta: zapatas y llanta","pr":"Zapatas 6–20 € el par","b":["llanta"],"k":["brazos","pastillas","disco"],"z":"frenos","w":["freno","humedad"],"s":["chirrido","silbido","roce"],"p":3,"l":"Fácil","t":"20 min","h":"Allen, lija, trapo","why":"Zapatas duras, desgastadas o con mal ángulo chirrían, sobre todo en mojado.","st":["Limpia la llanta con alcohol y quita los restos de zapata.","Comprueba el estado de las zapatas: si están gastadas hasta el indicador o duras y agrietadas, cámbialas.","Orienta las zapatas con convergencia (toe-in): la parte delantera debe tocar antes, unos 1–2 mm, con una cuña o una tarjeta.","Centra el freno con el tornillo de centrado del caliper.","Comprueba que la zapata toque la llanta y no la cubierta.","Prueba el freno en seco y en mojado a baja velocidad."],"er":"Dejar las zapatas rozando la cubierta o montarlas del lado contrario.","ok":"Frena sin chirrido y la rueda gira libre al soltar la maneta.","tip":"Las zapatas se cambian como las pastillas; no basta con lijarlas."},{"n":"Roldanas del cambio sucias o gastadas","pr":"Roldanas 8–25 €","k":["jaula","roldanas","desv_tras"],"z":"cambio","w":["pedal_suave","cambio","pedal_fuerte"],"s":["chirrido","zumbido","roce"],"p":4,"l":"Fácil","t":"20 min","h":"Allen, desengrasante, roldanas nuevas","why":"Las ruedecillas del desviador giran muy rápido y chirrían si están secas o con holgura.","st":["Con la bici en el soporte, pedalea y escucha la jaula del cambio: un chirrido fino y constante suele ser de las roldanas.","Mueve las roldanas lateralmente con los dedos para comprobar el juego.","Desmonta la jaula con allen y saca las roldanas; fíjate en la posición y el sentido de cada una.","Limpia con desengrasante y un cepillo, engrasa los casquillos y vuelve a montar.","Cambia las roldanas si tienen juego excesivo, dientes finos o ruido persistente.","Respeta la posición: la roldana superior suele tener algo de juego lateral y la inferior no."],"er":"Montar las roldanas intercambiadas o sin respetar el sentido.","ok":"La jaula gira en silencio sin juego.","tip":"Un chirrido fino y constante en la parte trasera casi siempre son las roldanas."},{"n":"Cubiertas: piedras, presión o roce","pr":"Cubierta 20–60 € · sellante 8–15 €","k":["valvula","neumatico"],"z":"neumaticos","w":["sinpedal","bache","curva","humedad"],"s":["zumbido","roce","golpeteo","click"],"p":3,"l":"Fácil","t":"10 min","h":"Bomba, manómetro, pinzas","why":"Una piedra clavada, una presión incorrecta o la cubierta rozando el cuadro dan zumbidos y clics en cada vuelta de rueda.","st":["Gira la rueda despacio y escucha un tic regular: mira la banda de rodadura por todos los lados.","Quita piedras o cristales con la punta de una llave; si hay un corte profundo, cambia la cubierta.","Comprueba la presión con manómetro y ajústala a tu peso y al terreno.","Mira si roza con el cuadro o con el guardabarros: centra la rueda y revisa el eje.","En tubeless, revisa la válvula y el sellante.","Comprueba que la cubierta asiente bien en la llanta (la línea de asentamiento debe ser pareja)."],"er":"Hinchar por encima de la presión máxima de la cubierta o de la llanta, o dejar piedras clavadas.","ok":"No hay tic al girar la rueda y la cubierta no roza.","tip":"Un ruido que sigue el ritmo de la rueda y no el de los pedales suele ser de la rueda."},{"n":"Eje pasante o desmontable flojo","pr":"Gratis · eje nuevo 15–40 €","k":["eje"],"z":"ruedas","w":["bache","freno","pedal_fuerte"],"s":["click","golpeteo","crujido"],"p":3,"l":"Fácil","t":"10 min","h":"Allen o palanca, grasa","why":"Un eje flojo o seco deja jugar la rueda en sus patillas y suena con cada impacto.","st":["Abre el eje y saca la rueda.","Limpia el eje y las patillas con un trapo.","Engrasa ligeramente el eje y su asiento.","Coloca la rueda asegurándote de que asiente completamente.","Cierra el eje al par que marque el fabricante (suele estar entre 10 y 15 N·m en ejes pasantes).","Comprueba que la rueda no tenga juego lateral."],"er":"Cerrar el eje sin asentar la rueda o apretarlo de más.","ok":"La rueda está firme y no suena en baches.","tip":"Si la rueda se mueve al empujarla de lado, no salgas hasta arreglarlo."},{"n":"Tija telescópica o casquillos","pr":"Servicio 30–80 €","k":["tija"],"z":"sillin","w":["bache","parado","pedal_fuerte"],"s":["golpeteo","crujido","chirrido"],"p":2,"l":"Media","t":"40 min","h":"Llave del fabricante, grasa","why":"Una tija con holgura golpea al cargar peso y cruje al subir el sillín.","st":["Identifica el tipo de tija (hidráulica o mecánica) y el modelo: cada marca tiene su propio manual de servicio.","Con la tija subida, agarra el sillín y muévelo de lado a lado, adelante y atrás y gíralo: un poco de juego mínimo puede ser normal, un golpeteo claro no.","Comprueba que el cable no esté tenso ni roce y que el mando vuelva solo; un cable mal ajustado impide que la tija suba del todo y hace ruido.","Limpia el tubo expuesto con un trapo y aplica lo que indique el fabricante en la zona del retén (aceite fino o grasa).","Revisa la abrazadera del tubo de sillín: si la tija se desliza o cruje, puede haber suciedad en el tubo; límpialo y aprieta al par.","Si el juego aumenta, haz el servicio (casquillos y retenes) según el manual o llévala a un taller.","Sube y baja la tija varias veces para comprobar que no se atasca."],"er":"Usar cualquier grasa o aceite sin comprobar que sea compatible, o apretar la abrazadera de más (agarrota la tija).","ok":"Sube y baja suave, sin juego apreciable y sin golpeteo al pasar baches.","tip":"El golpeteo al apoyarte en baches apunta a la tija."},{"n":"Motor eléctrico o sensor","pr":"Diagnóstico en taller 30–60 €","k":["sensor","display","cargador","motor"],"z":"motor","w":["pedal_fuerte","pedal_suave","sinpedal"],"s":["zumbido","click","roce"],"p":3,"l":"Taller","t":"Taller","h":"Diagnóstico del fabricante","why":"Un zumbido leve del motor es normal; un clic o golpeteo suele ser el imán, el sensor o un tornillo del soporte.","st":["Descarta que el ruido sea del motor: apaga la asistencia y rueda; si el ruido sigue, es mecánico (ruedas, transmisión, etc.).","Si desaparece sin asistencia, fíjate en qué nivel suena: un zumbido leve es normal; un clic, golpeteo o roce no.","Revisa los tornillos del soporte del motor y de las bielas con el par del fabricante: un soporte flojo es una causa frecuente.","Comprueba el imán del sensor de cadencia o velocidad y su cable: no deben rozar con rueda, cadena o cuadro.","Revisa conectores y cables: bien enchufados, sin roces y sin agua.","Comprueba la tensión de la cadena y el estado de piñón y plato (en las eléctricas se desgastan antes).","Si persiste, no abras el motor: llévala a un taller autorizado con el código de error de la pantalla."],"er":"Abrir el motor, usar chorro a presión sobre motor y conectores o ignorar un error mostrado en la pantalla.","ok":"El ruido cambia o desaparece al corregir el soporte y no hay errores en la pantalla.","tip":"Bielas y pedales de una eléctrica sufren más par y se aflojan antes."},{"n":"Calas y pedales automáticos","pr":"Calas 15–30 €","k":["calas","pedales"],"z":"pedales","w":["pedal_fuerte","vuelta","parado"],"s":["crujido","click","chirrido"],"p":3,"l":"Fácil","t":"15 min","h":"Allen, grasa, calas nuevas","why":"Calas gastadas o flojas suenan en cada pedalada, sobre todo bajo carga.","st":["Pedalea con un solo pie y confirma que el ruido viene del pedal automático o de la cala.","Revisa los tornillos de las calas y apriétalos con llave allen (normalmente entre 4 y 6 N·m; mira las indicaciones de tu cala).","Mira el desgaste de la cala: si el borde está redondeado o hay holgura al engancharte, cámbiala.","Limpia el mecanismo del pedal y de la cala y lubrica el punto de contacto según el manual del pedal.","Al montar calas nuevas, marca con rotulador la posición de las viejas sobre la suela para copiarla.","Comprueba que la dureza de liberación del pedal sea igual en ambos pedales.","Prueba a engancharte y soltarte varias veces con la bici parada antes de salir."],"er":"Mezclar sistemas de calas de distintas marcas o apretar los tornillos de más.","ok":"El enganche es firme, sin clic, y la liberación es suave.","tip":"Cámbialas antes de que se desgasten del todo."},{"n":"Grieta o fallo del cuadro","pr":"Inspección en taller 15–40 €","k":["patilla_tras","cuadro"],"z":"cuadro","w":["pedal_fuerte","bache","parado"],"s":["crujido","click"],"p":1,"l":"Taller","t":"Taller","h":"Inspección profesional","why":"Es poco frecuente, pero una grieta crujiría con la carga y es un tema de seguridad.","st":["Limpia el cuadro con un trapo húmedo y sécalo: la suciedad esconde las grietas.","Con buena luz, revisa soldaduras y uniones: tubo de dirección, caja de pedalier, patillas, tija y bases de suspensión.","Busca líneas finas, pintura agrietada, óxido que sale de una línea, o resina levantada en carbono.","Presiona la zona con la mano y flexiona suavemente: si cruje o ves que se abre, no sigas.","No uses la bici si sospechas una grieta ni intentes soldarla o taparla con cinta.","Lleva la bici a un taller o al fabricante para una inspección: algunas marcas ofrecen garantía por defectos de fabricación."],"er":"Seguir pedaleando con una grieta sospechosa o ignorar un crujido que no se explica por otras causas.","ok":"Un profesional descarta o confirma la grieta tras la inspección.","tip":"Descarta antes las causas fáciles, pero no ignores una grieta visible."},{"n":"Pastillas nuevas sin asentar","pr":"Gratis","z":"frenos","b":["disco_hid","disco_mec","llanta"],"k":["pastillas"],"w":["freno"],"s":["chirrido","silbido","zumbido"],"p":3,"l":"Fácil","t":"15 min","h":"Ninguna","why":"Las pastillas nuevas aún no han transferido material al disco y chirrían o frenan poco hasta asentarse.","st":["Busca una carretera llana y despejada y comprueba que los discos estén limpios.","Acelera hasta unos 20 km/h y frena de forma progresiva hasta casi parar, sin bloquear la rueda; repite 10 veces.","Repite 10 veces desde unos 30 km/h, frenando con más fuerza pero sin bloquear.","Deja que los frenos se enfríen unos minutos; no los mantengas apretados con la bici parada.","Si sigue chirriando, limpia disco y pastillas con alcohol y vuelve a asentar.","El rendimiento completo suele llegar tras varias salidas normales."],"er":"Frenar a fondo desde el principio o ensuciar el disco con los dedos.","ok":"Frena con fuerza constante y sin chirrido.","tip":"El asentamiento completo puede tardar varias salidas."},{"n":"Cable o funda de freno con fricción","pr":"Cable y funda 8–20 €","z":"frenos","b":["disco_mec","llanta"],"k":["manguera","maneta"],"w":["freno"],"s":["chirrido","roce","click"],"p":3,"l":"Fácil","t":"30 min","h":"Cable y funda nuevos, lubricante, alicates","why":"En frenos mecánicos y de llanta, un cable oxidado o una funda aplastada hacen que el freno vuelva despacio y suene.","st":["Comprueba si el freno vuelve despacio al soltar la maneta o si hay roce en la pinza o la zapata.","Suelta el cable en la pinza y en la maneta y tira de la funda: debe deslizar sin resistencia.","Saca el cable y mira si hay óxido, hilos rotos o dobleces; si los hay, cambia cable y funda.","Corta la funda nueva con un cortador específico, quita las rebabas y coloca los topes en los extremos.","Pon una gota de lubricante en el cable y pásalo por la funda y los topes.","Reajusta la tensión: tira del cable, aprieta el tornillo de anclaje y afina con el ajustador de la maneta.","Comprueba que el recorrido de la maneta sea corto y que el freno vuelva sin ruido."],"er":"Cortar la funda con tijeras o dejar rebabas.","ok":"La maneta vuelve sola y el freno responde sin retraso.","tip":"Cambiar cables y fundas una vez al año devuelve el tacto original."},{"n":"Maneta o latiguillo con juego","pr":"Bridas 3 € · latiguillo 15–35 €","z":"frenos","b":["disco_hid","disco_mec"],"k":["maneta","manguera"],"w":["bache","freno"],"s":["golpeteo","click","crujido"],"p":2,"l":"Fácil","t":"15 min","h":"Allen, bridas","why":"Una maneta floja o un latiguillo que golpea cuadro o horquilla suenan al pasar baches.","st":["Mueve cada maneta en su abrazadera con la mano: no debe girar ni bailar.","Afloja un poco la abrazadera, coloca la maneta en su posición y aprieta al par.","Comprueba el pivote de la maneta: lubrica con una gota de aceite fino si cruje.","Mira el latiguillo: que no forme lazos grandes, no roce con el neumático ni con el cuadro y esté fijado con bridas.","Revisa las conexiones del latiguillo en pinza y maneta: sin fugas ni humedad.","Si el latiguillo está doblado o con fuga, cámbialo o llévalo al taller."],"er":"Apretar de más la abrazadera de la maneta o dejar el latiguillo muy tenso.","ok":"La maneta no baila y el latiguillo no golpea.","tip":"Un latiguillo doblado o con fugas debe verlo un taller."},{"n":"Freno de tambor o contrapedal","pr":"Taller 25–60 €","z":"frenos","b":["tambor"],"k":["tambor"],"w":["freno","humedad"],"s":["chirrido","roce","rechinar"],"p":3,"l":"Media","t":"45 min","h":"Llave de eje, grasa específica","why":"Un tambor seco o con zapatas desgastadas chirría, y un contrapedal con holgura hace clac al pedalear hacia atrás.","st":["Comprueba que el brazo de reacción esté sujeto al cuadro con su tornillo y abrazadera.","Aprieta las tuercas del eje y revisa que no haya juego en la rueda.","Si chirría, desmonta la tapa del tambor y quita el polvo de las zapatas con un trapo seco (sin aceite ni desengrasante).","Mira el desgaste de las zapatas y cámbialas si están por debajo del mínimo.","Ajusta la tensión del cable o la varilla hasta que el freno actúe sin roce.","Si el contrapedal hace clac al pedalear hacia atrás, revisa la tensión de la cadena y el juego de la rueda libre."],"er":"Echar aceite dentro del tambor.","ok":"Frena sin chirrido y el contrapedal no hace clac.","tip":"Nunca eches aceite dentro del tambor: elimina el agarre."},{"n":"Batería o soporte flojos","pr":"Gratis · soporte 15–40 €","z":"motor","k":["cargador","bateria"],"w":["bache","curva","sinpedal"],"s":["golpeteo","roce","click"],"p":2,"l":"Fácil","t":"10 min","h":"Llave del fabricante","why":"Una batería que baila en su soporte suena en baches y curvas.","st":["Apaga el sistema y retira la batería.","Limpia los contactos con un trapo seco y revisa el carril y el cierre.","Mira las gomas o topes del soporte y cámbialos si están gastados.","Coloca la batería, gírala y comprueba que cierre con llave sin holgura.","Aprieta los tornillos del soporte al par del fabricante.","Sacude la bici para comprobar que la batería no suena."],"er":"Poner grasa convencional en los contactos eléctricos.","ok":"La batería no baila y no suena en baches.","tip":"No pongas grasa convencional sobre contactos eléctricos."},{"n":"Pivotes del basculante secos o con juego","pr":"Grasa 5–10 € · rodamientos 20–80 € · taller 40–100 €","z":"suspension","k":["bieleta","pivotes","casquillos","amortiguador"],"w":["bache","pedal_fuerte","curva"],"s":["crujido","golpeteo","chirrido"],"p":3,"l":"Media","t":"1–2 h","h":"Llaves allen y torx, llave dinamométrica, grasa para rodamientos","why":"Los pivotes de la suspensión trasera giran con cada bache. Si el rodamiento se seca o el eje se afloja, crujen o golpetean al comprimirse.","st":["Con la bici en un soporte, mueve el basculante de lado a lado y comprueba si hay juego.","Haz fotos de cada pivote y anota el orden y la posición de cada eje, arandela y espaciador antes de desmontar.","Limpia la zona con un trapo (sin chorro a presión) y desmonta los tornillos en el orden que indique el fabricante.","Saca los ejes y comprueba que los rodamientos giren suaves, sin dureza ni juego; cambia los que estén dañados.","Limpia ejes y rodamientos y engrasa con grasa para rodamientos.","Monta en el orden inverso y aprieta al par del fabricante siguiendo su orden de apriete.","Comprime la suspensión varias veces y mueve el basculante para comprobar que no hay juego."],"er":"Lavar a presión los pivotes o apretar sin respetar el orden.","ok":"Sin juego lateral y sin crujido al comprimir.","tip":"El lavado a presión es el mayor enemigo de los rodamientos de pivote."},{"n":"Pivotes del cambio, desviadores o maneta secos","pr":"Lubricante 6–15 €","z":"cambio","k":["piv_cambio","piv_maneta","mandos"],"w":["cambio","pedal_suave"],"s":["click","chirrido","roce"],"p":2,"l":"Fácil","t":"20 min","h":"Lubricante fino, trapo, allen","why":"Los pivotes y muelles del cambio y de las manetas se resecan y dejan clics o una respuesta lenta.","st":["Limpia con desengrasante los pivotes y muelles del cambio y del desviador.","Mira que los muelles estén en su sitio y sin óxido.","Pon una gota de lubricante fino en cada pivote y mueve el mecanismo varias veces.","Comprueba que la maneta vuelva sola sin quedarse a medias.","Limpia el exceso para no atraer suciedad.","Prueba todas las marchas con la bici en el soporte."],"er":"Usar grasas gruesas que se endurecen con el frío.","ok":"El cambio y las manetas responden sin clic.","tip":"Evita grasas gruesas en pivotes de cambio: se endurecen con el frío."},{"n":"Cassette o platos desgastados: la cadena salta","pr":"Cassette 25–120 € · plato 25–120 € · cadena 15–60 €","k":["cassette","platos","monoplato","cadena"],"z":"cassette","w":["pedal_fuerte","cambio"],"s":["golpeteo","click","crujido"],"p":3,"l":"Media","t":"45–60 min","h":"Medidor de desgaste, llave de cassette, látigo, llaves allen, cadena nueva","why":"Con los dientes desgastados la cadena no engrana bien: salta bajo carga con un golpe seco, sobre todo en los piñones más usados.","st":["Fíjate en cuándo salta: en un solo piñón (ese piñón está gastado), en todos (cadena estirada) o solo en el plato grande o pequeño (plato gastado).","Mide el desgaste de la cadena: si está estirada, cassette y plato ya se han desgastado con ella.","Mira los dientes con buena luz: los puntiagudos y ganchudos (forma de aleta de tiburón) indican desgaste.","Prueba con una cadena nueva si cassette y plato aún están razonables; si sigue saltando, hay que cambiar piñones o plato.","Para el cassette sigue la tarea «Cambiar el cassette»; para el plato, «Cambiar los platos o el monoplato».","Cambia siempre cadena nueva con cassette nuevo para que engranen bien.","Prueba bajo carga en todas las marchas, sobre todo en los piñones más usados."],"er":"Montar una cadena nueva sobre un cassette muy gastado: salta y se desgasta antes.","ok":"La cadena no salta bajo carga en ningún piñón.","tip":"Si salta solo en un piñón concreto, suele ser ese piñón; si salta en todos, la cadena."},{"n":"Cadena muy cruzada o mala línea de cadena","pr":"Gratis","z":"cadena","k":["cadena","desv_del","desv_tras","guia"],"w":["pedal_suave","cambio","pedal_fuerte"],"s":["roce","chirrido","zumbido"],"p":3,"l":"Fácil","t":"10 min","h":"Ninguna","why":"Si usas el plato grande con los piñones grandes (o el pequeño con los pequeños), la cadena va muy torcida, roza el desviador y chirría.","st":["Fíjate en qué combinación suena: plato grande con piñones grandes, o plato pequeño con piñones pequeños.","Cambia de plato para que la cadena quede más recta: plato grande con piñones pequeños y medios, plato pequeño con piñones medios y grandes.","Con un solo plato, algo de roce en los piñones extremos es normal; si es excesivo, revisa el ajuste del cambio.","Si el roce aparece en combinaciones normales, ajusta el desviador delantero (límites y tensión).","Comprueba con una regla que plato y cassette estén alineados: la cadena debe ir en línea recta.","En monoplato, comprueba la alineación y la tensión de la cadena."],"er":"Forzar cambios en combinaciones muy cruzadas: gastan antes cadena y piñones.","ok":"El ruido desaparece al cambiar de plato o piñón y la cadena va en línea.","tip":"Evitar las combinaciones extremas reduce el ruido y alarga la vida de la transmisión."},{"n":"Puños, cinta o manetas sueltos en el manillar","pr":"Puños 5–25 € · cinta 5–25 €","z":"direccion","k":["manillar","punos","maneta","mandos"],"w":["bache","freno","pedal_fuerte"],"s":["crujido","click","chirrido"],"p":2,"l":"Fácil","t":"15 min","h":"Allen, fijador de puños, llave dinamométrica","why":"Puños que giran, manetas flojas o una potencia sin apretar dejan crujidos al apoyar las manos o al frenar.","st":["Agarra los puños y gíralos con la mano: no deben moverse.","Si giran, límpialos por dentro con alcohol y vuelve a montarlos con fijador, o cámbialos por puños con abrazadera.","Revisa las abrazaderas de las manetas de freno y cambio y apriétalas al par.","Comprueba que la potencia esté bien apretada al manillar y que no cruje al apoyarte.","Mira si el manillar tiene grietas, sobre todo en carbono, en la zona de las abrazaderas.","Prueba apoyándote y frenando con la bici parada."],"er":"Apretar de más las abrazaderas en piezas de carbono.","ok":"Los puños no giran y las manetas no crujen.","tip":"Un crujido al apoyar las manos suele venir de manillar o potencia, no del pedalier."},{"n":"Rodamientos de la dirección secos","pr":"Grasa 5 € · rodamientos 15–45 € · taller 30–60 €","z":"direccion","k":["direccion","tapa"],"w":["curva","freno","bache"],"s":["crujido","rechinar","golpeteo"],"p":3,"l":"Media","t":"60 min","h":"Allen, llave dinamométrica, grasa, extractor de cazoletas","why":"Con los rodamientos secos o corroídos la dirección rechina al girar el manillar y cruje al frenar o en curvas.","st":["Levanta la rueda delantera y gira el manillar: no debe haber puntos duros ni crujidos.","Con la rueda en el suelo y el freno delantero apretado, mece la bici: un golpe indica juego.","Afloja la potencia, retira la tapa y saca la horquilla con cuidado.","Limpia cazoletas y rodamientos y busca muescas, óxido o dureza.","Engrasa o cambia los rodamientos si están dañados.","Monta en orden, ajusta la precarga y alinea la potencia.","Aprieta la potencia al par y comprueba que la dirección gira libre."],"er":"Apretar la tapa para quitar el juego sin soltar antes la potencia.","ok":"La dirección gira libre, sin dureza ni ruido.","tip":"Si cruje solo al girar el manillar, sospecha de los rodamientos."},{"n":"Zapatilla o talón rozando biela, cuadro o cadena","pr":"Gratis","z":"pedales","k":["pedales","calas"],"w":["vuelta","pedal_suave","pedal_fuerte"],"s":["roce","golpeteo","click"],"p":2,"l":"Fácil","t":"10 min","h":"Ninguna","why":"Un talón o una zapatilla que roza la biela, la vaina o el guardabarros hace un ruido repetido en cada vuelta de pedal.","st":["Pedalea con la bici en el soporte y mira los pies: observa si talón o zapatilla tocan la biela o la vaina.","Cambia la posición de la cala (más hacia atrás o hacia fuera) o la posición del pie.","En pedales de plataforma, desplaza el pie sobre el pedal.","Si hace falta, prueba con arandelas separadoras en el pedal.","Comprueba que ningún guardabarros o protector roce la zapatilla."],"er":"Cambiar la cala sin marcar antes la posición anterior.","ok":"El ruido desaparece al cambiar la posición del pie.","tip":"Un roce en cada pedalada puede ser el calzado, no la bici."},{"n":"Piedra o suciedad entre disco y pinza","pr":"Gratis","z":"frenos","b":["disco_hid","disco_mec"],"k":["pinza","disco","pastillas"],"w":["sinpedal","freno","bache"],"s":["roce","click","golpeteo"],"p":3,"l":"Fácil","t":"10 min","h":"Cepillo suave, alcohol isopropílico","why":"Una piedra, barro o una hoja entre disco y pinza produce un roce o un clic al girar la rueda.","st":["Levanta la rueda y gírala: escucha si el roce o el clic se repite en cada vuelta.","Mira entre el disco, la pinza y las pastillas: busca piedras o suciedad.","Retira piedras o barro con un cepillo suave o con aire.","Limpia disco y pastillas con alcohol isopropílico.","Comprueba que el disco no esté doblado ni la pinza descentrada.","Gira la rueda para confirmar que no hay roce."],"er":"Usar un destornillador para quitar piedras y rayar el disco.","ok":"La rueda gira en silencio y sin roce.","tip":"Tras salir por grava o barro, revisa el disco y la pinza."},{"n":"Suspensión que llega al final del recorrido (bottom-out)","pr":"Espaciadores 8–20 € · servicio 50–120 €","z":"suspension","k":["amortiguador","horquilla","bieleta","topes"],"w":["bache"],"s":["golpeteo"],"p":3,"l":"Media","t":"30–60 min","h":"Bomba de suspensión, espaciadores, llave del fabricante","why":"Si la horquilla o el amortiguador llegan al tope en cada aterrizaje, se oye un golpe seco al final del recorrido y los componentes sufren.","st":["Mide el SAG con la bici cargada y compáralo con el recomendado (suele estar entre el 20 y el 30 %, según el uso).","Mira el aro o la goma de recorrido del vástago: si llega al final tras cada salida, la suspensión usa todo el recorrido.","Sube la presión en pasos pequeños (2–5 psi) y repite la medida.","Si sigue llegando al tope, añade espaciadores de volumen según el manual de tu horquilla o amortiguador.","Ajusta el rebote: demasiado rápido provoca golpes al final del recorrido y demasiado lento acumula compresión.","Revisa los topes de goma del amortiguador: si están rotos o falta alguno, cámbialos.","Si el golpe viene de dentro, haz el servicio de horquilla o amortiguador."],"er":"Subir la presión de golpe o ignorar topes dañados.","ok":"Usas casi todo el recorrido en los saltos, pero sin golpe seco al final.","tip":"Usar todo el recorrido de vez en cuando es normal; en cada aterrizaje, no."},{"n":"Llanta abollada o con aterrizajes duros","pr":"Taller 15–35 € · llanta 40–200 €","z":"ruedas","k":["llanta","radios","nipples","neumatico"],"w":["bache","curva"],"s":["golpeteo","click"],"p":3,"l":"Taller","t":"Taller","h":"Soporte de centrado, llave de radios","why":"Los aterrizajes duros y las escaleras abollan las llantas y aflojan radios, con golpes y tics en cada vuelta.","st":["Gira la rueda y mira si la llanta tiene abolladuras o planos; en el punto abollado suele notarse el golpe.","Revisa los bordes y los agujeros de los radios: busca grietas, sobre todo en aluminio y llantas ligeras.","Pellizca los radios cercanos y golpéalos con una llave: el tono debe ser parecido.","Comprueba que las cubiertas asientan bien y que no hay pinchazos por pellizco por baja presión.","Si la abolladura es leve, un taller puede enderezar y centrar; con grietas o abolladuras profundas, cambia la llanta.","Tras reparar, revisa la tensión de radios y el centrado."],"er":"Seguir usando una llanta con grietas.","ok":"La rueda gira recta, sin golpes ni tics.","tip":"Más presión o una llanta reforzada reduce las abolladuras en saltos."},{"n":"Cadena golpeando la vaina (chain slap)","pr":"Protector 5–15 € · embrague taller 40–100 €","z":"cadena","k":["cadena","guia","jaula","embrague","protector"],"w":["bache","sinpedal"],"s":["golpeteo","roce"],"p":3,"l":"Fácil","t":"15–30 min","h":"Allen, protector de vaina, bridas","why":"En terreno roto la cadena rebota contra la vaina y da un traqueteo metálico característico.","st":["Rueda por terreno irregular sin pedalear y escucha: un traqueteo que desaparece al pedalear es la cadena golpeando.","Comprueba el embrague (clutch) del cambio: debe estar activado y ofrecer resistencia.","Mira el protector de vaina: si falta o está gastado, pon uno nuevo.","Comprueba la longitud de la cadena: si es demasiado larga cuelga y golpea más.","Revisa la guía de cadena o el tensor si los llevas.","Si persiste, ajusta o repara el embrague según el manual del cambio."],"er":"Dejar el embrague desactivado en terreno roto.","ok":"El traqueteo desaparece o se reduce mucho.","tip":"Un protector de vaina es barato y evita también rozaduras de pintura."},{"n":"Embrague del cambio trasero flojo o desactivado","pr":"Taller 40–100 €","z":"cambio","k":["embrague","jaula","desv_tras"],"w":["bache","pedal_suave"],"s":["golpeteo","click"],"p":2,"l":"Media","t":"20–30 min","h":"Allen, trapo, lubricante","why":"Un embrague desactivado o sin tensión deja que la cadena rebote y golpee en terreno roto.","st":["Localiza el mando del embrague (palanca o botón en el cambio) y comprueba que esté activado.","Mueve la jaula del cambio hacia delante con la mano: debe oponer resistencia al principio; si cede sin resistencia, el embrague no funciona.","Limpia la zona del cambio y del pivote con un trapo y lubrica ligeramente.","Comprueba que los tornillos del cambio y de la patilla estén al par.","Si no opone resistencia, cambia el cambio o llévalo a un taller: no se repara con herramientas básicas.","Revisa cadena y pivotes del cambio para descartar otras causas."],"er":"Abrir el cambio sin el manual del fabricante.","ok":"La jaula opone resistencia y no hay golpeteo de cadena.","tip":"El embrague reduce el rebote de la cadena y el golpeteo."},{"n":"Tornillos flojos tras saltos, escaleras o impactos","pr":"Gratis · llave dinamométrica 30–90 €","z":"cuadro","k":["cuadro","potencia","manillar","tija","botellero","portabultos","pivotes","tdisco"],"w":["bache","parado"],"s":["crujido","golpeteo","click"],"p":4,"l":"Fácil","t":"30–45 min","h":"Allen, torx, llave dinamométrica","why":"Los aterrizajes y los golpes repetidos aflojan tornillos de potencia, manillar, tija, pivotes y accesorios.","st":["Con la bici parada, sacúdela y escucha dónde suena.","Revisa uno a uno con llave dinamométrica: potencia, manillar, manetas, tija, sillín, ejes de rueda, pinzas de freno y discos.","Revisa los tornillos de pivotes y del amortiguador según el manual de tu bici.","Mira cuadro y piezas en busca de grietas o deformaciones.","Marca los tornillos con un rotulador para ver si se mueven.","Repite la revisión tras cada sesión de saltos o bike park."],"er":"Apretar de más sin llave dinamométrica.","ok":"No hay golpes ni crujidos al sacudir y rodar.","tip":"Marcar los tornillos con rotulador es una forma barata de ver si se aflojan."},{"n":"Bieleta o linkage de la suspensión con juego","pr":"Rodamientos 20–80 € · taller 40–100 €","z":"suspension","k":["bieleta","pivotes","casquillos","amortiguador"],"w":["bache","pedal_fuerte"],"s":["crujido","golpeteo"],"p":3,"l":"Media","t":"90 min","h":"Llaves allen y torx, llave dinamométrica, grasa, extractor","why":"La bieleta y sus rodamientos soportan muchos impactos: con juego dan un golpeteo o crujido al comprimir.","st":["Con la bici sin carga, mueve la bieleta con la mano y comprueba el juego.","Comprime la suspensión lentamente y escucha de dónde viene el ruido.","Anota el orden y la posición de ejes, arandelas y espaciadores antes de desmontar.","Desmonta los ejes de la bieleta y comprueba que los rodamientos giren suaves y sin juego.","Cambia los rodamientos ásperos o con juego y engrasa los ejes.","Monta y aprieta al par del fabricante siguiendo su orden de apriete.","Comprime la suspensión varias veces para comprobar que no hay juego."],"er":"Reutilizar rodamientos con dureza.","ok":"No hay juego y la suspensión comprime sin crujido.","tip":"Los rodamientos de bieleta suelen ser los primeros en gastarse en bicis de enduro y descenso."},{"n":"Horquilla con juego en el tren inferior","pr":"Servicio 50–90 € · casquillos 30–80 €","z":"suspension","k":["horquilla","retenes"],"w":["freno","bache"],"s":["golpeteo","crujido"],"p":3,"l":"Taller","t":"Taller","h":"Llave del fabricante, kit de servicio","why":"Casquillos desgastados dejan juego entre botellas y vástagos, y se oye un golpe al frenar o en baches.","st":["Con el freno delantero apretado, mece la bici adelante y atrás: un golpe en la horquilla indica juego.","Descarta la dirección: apoya los dedos en la unión de la corona con el tubo de dirección mientras meces.","Con la horquilla sin peso, mueve la rueda de lado a lado para detectar juego entre botellas y vástagos.","Limpia los vástagos y revisa fugas de aceite.","Haz el servicio completo con la periodicidad del fabricante.","Si el juego sigue, cambia casquillos y retenes en un taller."],"er":"Confundir juego de la dirección con juego de la horquilla.","ok":"No hay golpe al frenar ni juego en los vástagos.","tip":"Antes de culpar a la horquilla, descarta la dirección."},{"n":"Presión baja: el neumático golpea la llanta al aterrizar","pr":"Gratis · cubierta reforzada 30–70 €","z":"neumaticos","k":["neumatico","valvula","llanta"],"w":["bache"],"s":["golpeteo","roce"],"p":3,"l":"Fácil","t":"10 min","h":"Bomba con manómetro","why":"Con poca presión, el neumático toca la llanta en aterrizajes y bordillos: se oye un golpe seco y hay riesgo de pinchazo por pellizco.","st":["Mide la presión con un manómetro fiable.","Busca marcas en los laterales de la cubierta o abolladuras en la llanta.","Sube la presión en pasos pequeños (1–2 psi) hasta que desaparezca el golpe en aterrizajes.","Revisa que la cubierta asiente bien y que no haya fugas en la válvula.","Si usas tubeless, comprueba el sellante.","Valora cubiertas y llantas reforzadas si saltas a menudo."],"er":"Pasarte con la presión y perder agarre.","ok":"Sin golpes en aterrizajes ni marcas nuevas en la llanta.","tip":"La presión ideal depende del peso, el ancho de cubierta y el terreno."},{"n":"Pivotes del freno (maneta y brazos de llanta) secos","pr":"Lubricante 6–15 €","z":"frenos","k":["piv_maneta","maneta","brazos"],"w":["freno"],"s":["click","crujido","chirrido"],"p":2,"l":"Fácil","t":"15 min","h":"Aceite fino, trapo, allen","why":"Los pivotes de la maneta y de los brazos del freno de llanta se resecan y dejan clics o un retorno lento.","st":["Acciona la maneta y escucha: un clic o roce al accionar o al soltar apunta al pivote.","Limpia el pivote de la maneta con un trapo.","Pon una gota de aceite fino en el pivote sin tocar discos ni pastillas.","En freno de llanta, lubrica los pivotes de los brazos y comprueba que los muelles estén en su sitio.","Comprueba que la maneta vuelve sola sin quedarse a medias.","Revisa los tornillos de pivotes y anclajes."],"er":"Poner aceite cerca de discos o pastillas.","ok":"La maneta se mueve suave y sin clic.","tip":"Los pivotes del freno suelen olvidarse en el mantenimiento."},{"n":"Trinquetes o sistema Ratchet del buje secos o trabados","pr":"Grasa ligera de núcleo 8–15 € · taller 20–40 €","k":["trinquetes","rueda_libre","buje_tras"],"z":"buje","w":["sinpedal","pedal_fuerte"],"s":["zumbido","crujido","golpeteo","rechinar"],"p":4,"l":"Media","t":"30–45 min","h":"Grasa especial muy ligera de trinquetes, trapo, llaves de buje","why":"El mecanismo libre (muelles con trinquetes o anillos Star Ratchet) acumula mugre o grasa resecada. Provoca zumbidos secos al rodar sin pedalear o patinazos con un golpe metálico brutal al acelerar.","st":["Gira la rueda en el aire sin pedalear: el sonido debe ser regular y limpio; si suena apagado, seco o metálico irregular, necesita servicio.","Quita la rueda trasera y extrae el cassette junto con el núcleo (en bujes modernos tipo DT Swiss o Mavic sale tirando a mano).","Limpia a fondo los dientes del sistema Ratchet o los trinquetes y sus muelles con desengrasante y un cepillo.","Comprueba que los muelles tengan tensión y que los dientes no estén mellados o redondeados.","Aplica una película muy fina de grasa específica para núcleos libres (grasa roja muy ligera); jamás grasa densa de rodamientos.","Vuelve a montar el núcleo asegurando que el retén antipolvo asiente perfectamente.","Prueba un par de pedaladas fuertes en parado para asegurar el enganche."],"er":"Echar grasa densa de teflón o litio: apelmaza los trinquetes y al pedalear fuerte patina en falso y puedes caerte.","ok":"El enganche al pedalear es instantáneo sin golpes secos ni saltos.","tip":"Usa siempre grasa muy ligera específica para trinquetes o Star Ratchet: la grasa normal provoca caídas por patinazos."},{"n":"Patilla universal SRAM UDH floja o desalineada","pr":"Gratis · patilla UDH 15–20 €","k":["patilla_udh","patilla","desv_tras"],"z":"cambio","w":["cambio","pedal_fuerte","bache"],"s":["click","crujido","roce"],"p":4,"l":"Fácil","t":"15 min","h":"Allen de 8 mm, llave dinamométrica","why":"La patilla UDH estándar de bicicletas modernas se afloja con vibraciones y saltos. Al aflojarse desalinea el cambio, produce saltos y cruje en subidas.","st":["Quita la rueda trasera o afloja el eje pasante.","Comprueba el tornillo central de fijación de la patilla UDH (allen de 8 mm). Recuerda: ¡LA PATILLA UDH TIENE ROSCA INVERSA! Se aprieta a izquierdas (sentido antihorario).","Comprueba que la patilla asiente plana contra el cuadro y descanse en su tope.","Aprieta el tornillo con llave dinamométrica a exactamente 25 N·m.","Monta la rueda y aprieta el eje pasante a su par (12–15 N·m).","Comprueba el indexado de marchas."],"er":"Intentar apretar hacia la derecha (sentido horario) dañando la rosca.","ok":"El cambio no tiene juego lateral y cambia en silencio sin crujidos.","tip":"La patilla UDH se aprieta a izquierdas (sentido antihorario) y requiere 25 N·m de par."},{"n":"Cambio electrónico (Di2 / AXS) descalibrado o con roce","pr":"Gratis · taller 10–20 €","k":["cambio_elec","desv_tras","desv_del"],"z":"cambio","w":["cambio","pedal_suave","pedal_fuerte"],"s":["roce","click","zumbido"],"p":3,"l":"Fácil","t":"10–20 min","h":"App del fabricante o pulsador de microajuste","why":"En grupos electrónicos un ligero desajuste genera un chirrido constante porque el servomotor mantiene la jaula fija sin la flexibilidad de un cable.","st":["Comprueba en la app o en el led del cambio que la batería no esté por debajo del 20 %.","Pon la cadena en el piñón central de la piñonera.","Activa el modo de microajuste: en SRAM pulsa el botón AXS de la maneta mientras tocas la leva; en Shimano activa el ajuste desde la app E-Tube o la centralita.","Mueve el cambio paso a paso (0,2 mm por clic) hacia el piñón más grande hasta escuchar un ligero roce; retrocede 2 o 3 clics hasta el silencio absoluto.","Sal del modo de ajuste y prueba todos los piñones pedaleando."],"er":"Forzar la jaula del cambio con la mano con el servomotor bloqueado.","ok":"La cadena rueda sin roce en todas las marchas y el cambio es instantáneo.","tip":"Los cambios electrónicos se calibran mediante microajuste de 0,2 mm desde la maneta o la app oficial."},{"n":"Correa dentada (Gates Carbon Drive) sucia o destensada","pr":"Spray silicona 6–12 € · correa 40–90 €","k":["correa","platos","cassette"],"z":"cadena","w":["pedal_fuerte","pedal_suave","humedad"],"s":["chirrido","crujido","rechinar"],"p":4,"l":"Fácil","t":"15–20 min","h":"Agua, spray de silicona seca pura, app Gates","why":"Las correas de carbono no llevan aceite. Si el polvo o la arena se incrusta en los dientes de la polea, chirrían intensamente bajo esfuerzo.","st":["Lava la correa y los dientes de los platos y poleas con agua abundante y cepillo suave. Nunca uses disolventes ni desengrasante agresivo.","Seca bien con trapo limpio.","Aplica un spray lubricante de silicona seca pura por el lado interno dentado (jamás aceite o grasa de cadena tradicional).","Comprueba la tensión con la app móvil de Gates (mide la frecuencia sonora al pellizcar la correa como una cuerda de guitarra, entre 35 y 50 Hz).","Comprueba la alineación recta entre plato delantero y polea trasera con una regla."],"er":"Echar grasa o aceite convencional en una correa: deteriora el compuesto y atrae arenilla.","ok":"Pedaleo completamente silencioso en cualquier pendiente o esfuerzo.","tip":"Una correa Gates solo se lubrica con agua o spray de silicona seca, jamás con aceite de bici."},{"n":"Cableado interno golpeando dentro del cuadro","pr":"Espuma aislante 5–12 € · taller 20–35 €","k":["cable_interno","cuadro","cables"],"z":"cuadro","w":["bache","curva","sinpedal"],"s":["golpeteo","click"],"p":4,"l":"Fácil","t":"20–45 min","h":"Espuma antivibración de 10–12 mm, bridas, tijeras","why":"En cuadros modernos de carbono y aluminio con guiado interno, las fundas y latiguillos rebotan contra las paredes internas del tubo diagonal al pasar por terreno irregular.","st":["Levanta la rueda delantera 10 cm y déjala caer: si suena un traqueteo hueco dentro del tubo, es cableado interno.","Tensa ligeramente con la mano las fundas que entran por los puertos del cuadro mientras reproduces el rebote para ver si el sonido cesa.","Comprueba que los pasacables de goma de las entradas del cuadro estén firmes.","Introduce una funda de espuma de neopreno/espuma antivibración de 10–12 mm sobre cada cable o latiguillo en todo el tramo interno del cuadro.","Vuelve a tensar las fundas en los puertos usando bridas o retenedores de goma."],"er":"Tirar con fuerza de los cables y desconectar conectores electrónicos o latiguillos hidráulicos dentro del cuadro.","ok":"El traqueteo hueco en baches desaparece por completo y el cuadro suena sólido.","tip":"Una funda de espuma antirruido de 10 € elimina el 90 % de los grillos en cuadros de carbono."},{"n":"Remaches de portabidón flojos (nutserts en el cuadro)","pr":"Gratis · remache 5–15 € · taller 10–20 €","k":["remaches","botellero","cuadro"],"z":"cuadro","w":["pedal_fuerte","bache","parado"],"s":["crujido","click"],"p":3,"l":"Fácil","t":"15 min","h":"Allen, tornillo M5 largo con tuerca y arandela","why":"Los casquillos roscados incrustados en el tubo diagonal o del sillín cogen holgura con el peso del bidón en baches, produciendo un crujido idéntico al del pedalier cuando el cuadro flexa.","st":["Quita los tornillos y saca el portabidón.","Intenta girar o mover con los dedos el casquillo roscado metálico empotrado en el cuadro: no debe moverse ni girar ni un milímetro.","Si se mueve o gira, apriétalo con un truco casero: enrosca una tuerca en un tornillo M5 largo, pon una arandela engrasada, enrosca a tope en el casquillo del cuadro, sujeta el tornillo con una llave allen y aprieta la tuerca con una llave fija para tirar del remache y volver a expandirlo contra el tubo.","Aplica una gota de fijador de roscas medio (azul) y arandelas de goma entre portabidón y cuadro.","Monta el portabidón y aprieta a 3–4 N·m."],"er":"Apretar con fuerza excesiva y pasar la rosca de aluminio o abollar el tubo del cuadro.","ok":"El casquillo queda completamente inmóvil y el crujido bajo carga desaparece.","tip":"Un crujido que parece venir del pedalier al pedalear sentado o de pie muchas veces es un remache del botellero."},{"n":"Remaches de disco flotante con holgura o rozando la pinza","pr":"Disco nuevo 30–75 € · taller 10–20 €","k":["disco_flotante","disco","pinza"],"z":"frenos","b":["disco_hid","disco_mec"],"w":["freno","sinpedal","curva"],"s":["click","roce","golpeteo"],"p":3,"l":"Fácil","t":"20 min","h":"Galgas de espesor, linterna, llave de disco","why":"Los discos de freno de dos piezas (araña de aluminio y pista de acero unidas por remaches o botones) permiten dilatación térmica. Si un remache coge holgura o roza con la pinza, suena un clic metálico al frenar.","st":["Levanta la rueda y gírala lentamente mirando por la ranura superior de la pinza de freno.","Observa si los remaches circulares pasan a menos de 1 mm de la pinza o del soporte de las pastillas.","Mueve la pista de freno con los dedos en frío: debe permitir mínima dilatación axial, pero si tiene holgura rotacional u oscila con juego perceptible, los remaches están gastados.","Comprueba que los tornillos de anclaje de la araña al buje estén apretados al par correcto (5–6 N·m en 6 tornillos, 40 N·m en CenterLock).","Si el disco tiene holgura entre pista y araña, cámbialo inmediatamente por seguridad."],"er":"Frenar en bajadas prolongadas con remaches que presentan juego rotacional suelto.","ok":"No hay clics en frenadas bruscas y los remaches pasan holgados sin tocar la pinza.","tip":"En discos flotantes, comprueba siempre que los remaches no rocen con el cuerpo o pasador de la pinza."},{"n":"Tuerca de la válvula tubeless floja o tintineando","pr":"Gratis · junta tórica 1 €","k":["valvula_tuerca","valvula","llanta"],"z":"neumaticos","w":["bache","curva","sinpedal"],"s":["golpeteo","click","zumbido"],"p":3,"l":"Fácil","t":"5 min","h":"Mano, arandela o tórica de goma","why":"La tuerca moleteada que fija la válvula a la llanta se afloja por vibraciones. La tuerca metálica baila contra el aro de aluminio o carbono y produce un tintineo o zumbido metálico constante.","st":["Toca la tuerca exterior de la válvula con los dedos en ambas ruedas: comprueba si gira libremente o se mueve de arriba abajo.","Si baila, apriétala a mano firmemente contra la llanta. No uses alicates con fuerza bruta porque puedes romper la base de goma de la válvula dentro de la llanta.","Coloca una junta tórica de goma (O-ring) entre la tuerca moleteada y la llanta: absorberá las vibraciones y evitará que vuelva a aflojarse.","Comprueba que la válvula esté recta y no pierda aire."],"er":"Apretar la tuerca de la válvula tubeless con alicates a lo bestia: deformará la base de goma interior.","ok":"La válvula queda firme y desaparece el tintineo metálico en baches y rodadura.","tip":"Pon una pequeña tórica de goma bajo la tuerca de la válvula para eliminar ruidos y proteger la llanta."},{"n":"Inserto tubeless (mousse) descolocado o desbalanceado","pr":"Sellante 8–15 € · taller 15–25 €","k":["mousse","neumatico","valvula"],"z":"neumaticos","w":["sinpedal","bache","curva"],"s":["golpeteo","zumbido","roce"],"p":2,"l":"Media","t":"30–45 min","h":"Desmontables reforzados, sellante tubeless, bomba","why":"Los insertos de espuma antipinchazos absorben líquido con los meses, desbalancean la rueda o se retuercen en el asiento provocando golpes internos a cada giro.","st":["Levanta la rueda del suelo y dale un giro rápido en el aire: si la bici tiembla o la rueda oscila violentamente hacia arriba y abajo con la llanta centrada, el inserto o el sellante están acumulados en un punto.","Desinfla y comprueba si el mousse está aplastado o doblado palpando la cubierta con las manos en todo el perímetro.","Desmonta un flanco de la cubierta usando desmontables para insertos.","Revisa el estado del mousse: si ha absorbido líquido, está pesado o roto, límpialo o cámbialo.","Añade sellante nuevo compatible y talona con bomba rápida."],"er":"No revisar la válvula específica para mousse: debe tener ranuras laterales para no quedar taponada.","ok":"La rueda gira sin vibraciones ni inercias raras y el neumático rueda totalmente redondo.","tip":"Los insertos tubeless absorben algo de sellante con el tiempo: revisa su peso y añade líquido cada 3–4 meses."},{"n":"Raíles del sillín o tornillos de la nuez con suciedad","pr":"Grasa o pasta 5 €","k":["sillin","tija"],"z":"sillin","w":["pedal_fuerte","bache","parado"],"s":["crujido","click"],"p":4,"l":"Fácil","t":"15 min","h":"Llave allen, trapo, grasa o pasta de carbono","why":"El polvo fino entra en la unión entre los raíles del sillín y las mordazas de la nuez de la tija. Cada vez que pedaleas sentado y balanceas la pelvis, suena un crujido seco muy molesto.","st":["Prueba de pedaleo: pedalea sentado (suena) y luego ponte de pie sobre los pedales sin tocar el sillín (si desaparece al 100%, no es pedalier ni pedales).","Afloja los tornillos de la nuez que sujetan los raíles del sillín y retira el sillín.","Limpia a fondo las mordazas de la tija, los raíles del sillín y las roscas de los tornillos con trapo y alcohol.","Aplica una fina película de grasa en las zonas de contacto entre raíles metálicos y mordazas (o pasta de montaje si los raíles son de carbono).","Engrasa también las roscas de los tornillos de apriete de la tija para que den una lectura de apriete real.","Vuelve a montar el sillín y aprieta los tornillos alternándolos al par recomendado (8–12 N·m)."],"er":"Engrasar raíles de carbono con grasa mineral convencional o apretar sin dinamométrica.","ok":"Desaparece cualquier crujido al sentarse, pedalear fuerte con cadencia alta o pasar baches sentado.","tip":"Nueve de cada diez crujidos que parecen ser del pedalier desaparecen limpiando los raíles del sillín."}];
