const M=[["chain-lube","Limpiar y lubricar la cadena","Transmisión","Fácil","15–20 min","6–15 €","—","Cada 150–300 km o tras lluvia","Desengrasante, trapo, lubricante",["Pon la bici en un soporte o apoyada en una pared.","Pasa un trapo con desengrasante por la cadena mientras giras las bielas hacia atrás.","Déjala secar por completo.","Pon una gota en cada rodillo y gira las bielas varias vueltas.","Espera 10–15 minutos y quita el exceso con un trapo limpio."],"Lubricante húmedo para lluvia, seco para polvo."],["chain-wear","Medir el desgaste y cambiar la cadena","Transmisión","Media","30 min","15–60 €","10–20 € de mano de obra","Mide cada 500–1.000 km","Medidor de desgaste, tronchacadenas, falsa unión nueva",["Con la cadena limpia, coloca el medidor entre dos rodillos: si el lado «bien» entra y el otro no, el desgaste es bajo; si el segundo lado entra, hay que cambiarla.","Mide en varios puntos de la cadena.","Haz una foto del recorrido por el cambio y cuenta los eslabones.","Abre la cadena vieja con la falsa unión (con unas pinzas) o con el tronchacadenas.","Pasa la cadena nueva por roldanas y desviador delantero, iguálala en longitud con la vieja y comprueba con plato grande y piñón grande que el cambio no queda totalmente estirado.","Cierra con la falsa unión nueva y flexiona el eslabón en ambos sentidos para comprobar que no queda rígido.","Lubrica y prueba todas las marchas; si salta bajo carga, el cassette también está gastado."],"Cambiarla a tiempo alarga la vida de cassette y platos."],["cassette","Cambiar el cassette","Transmisión","Media","30 min","25–120 €","10–20 € de mano de obra","Cuando salta con cadena nueva","Llave de cassette, látigo, grasa",["Identifica el cuerpo de rueda libre (Shimano HG, SRAM XD, Microspline) y comprueba que el cassette nuevo es compatible con él y con tu número de velocidades.","Quita la rueda trasera y el eje.","Coloca el látigo en un piñón y la llave de cassette en el cierre; afloja girando en sentido antihorario.","Saca los piñones y anota el orden y los espaciadores.","Limpia las estrías del cuerpo de rueda libre y engrasa ligeramente.","Monta el cassette nuevo en orden y aprieta el cierre a unos 40 N·m.","Cambia también la cadena si no es nueva y reajusta el indexado."],"Cassette y cadena se cambian juntos para que engranen bien."],["indexado","Ajustar el cambio trasero","Transmisión","Media","30–45 min","0 €","10–25 €","Cuando cambia mal o salta","Allen, destornillador",["Pon la bici en un soporte, la cadena en el plato pequeño (o único) y en el piñón más pequeño.","Comprueba cable y funda: sin óxido, sin dobleces y bien asentados en sus topes. Si dudas, cámbialos antes de ajustar.","Gira el ajustador de barril del cambio y de la maneta hasta el fondo y luego medio giro hacia fuera para dejar margen en ambos sentidos.","Límite H: con la cadena en el piñón más pequeño, ajusta el tornillo H hasta que la roldana superior quede alineada con ese piñón sin que la cadena roce el siguiente.","Tensa el cable: deja la maneta en la posición del piñón más pequeño, tira del cable con el alicate y aprieta el tornillo de anclaje.","Cambia una marcha: la cadena debe subir al segundo piñón sin dudar. Si tarda, gira el barril un cuarto de vuelta en sentido antihorario (más tensión); si salta dos piñones, al contrario.","Recorre todas las marchas subiendo y bajando y ajusta el barril en cuartos de vuelta hasta que no haya roce.","Límite L: en el piñón más grande, ajusta el tornillo L para que la cadena no caiga hacia los radios. Ajusta el tornillo B para que la roldana superior quede lo más cerca posible del piñón grande sin tocarlo (normalmente unos 5–6 mm)."],"Gira el ajustador de barril un cuarto de vuelta cada vez."],["cables-cambio","Cambiar cables y fundas del cambio","Transmisión","Media","60 min","15–30 €","30–50 €","Una vez al año o cada 4.000 km","Alicates de cables, cortador de fundas, lubricante",["Pon la cadena en el piñón más pequeño y suelta el tornillo de anclaje del cable en el cambio.","Saca el cable viejo desde la maneta y extrae las fundas.","Mide y corta fundas nuevas con un cortador, quita las rebabas y coloca los topes.","Lubrica ligeramente el cable nuevo y pásalo por la maneta, las fundas y el cambio.","Tensa el cable con el alicate y aprieta el anclaje.","Ajusta el indexado (ver tarea «Ajustar el cambio trasero»).","Corta el sobrante y coloca el capuchón."],"Corta las fundas con un cortador específico: unas tijeras las aplastan."],["roldanas","Limpiar o cambiar las roldanas","Transmisión","Fácil","20 min","8–25 €","10–15 €","Cada 2.000 km o cuando chirrían","Allen, desengrasante",["Quita la jaula del cambio.","Saca las roldanas y límpialas.","Cámbialas si tienen juego o dientes afilados.","Móntalas en su posición y aprieta."],"Cada roldana tiene su posición y sentido: fíjate al desmontar."],["pedalier","Engrasar o cambiar la caja de pedalier","Transmisión","Media","45–60 min","15–80 €","20–35 € de mano de obra","Cada 6–12 meses o si cruje","Extractor de cazoletas, grasa, llave dinamométrica",["Identifica tu caja (roscada o a presión) y consigue la llave adecuada.","Saca las bielas siguiendo el sistema de tu marca.","Extrae las cazoletas; en rosca inglesa (BSA), la del lado de la transmisión tiene rosca inversa.","Limpia roscas y el tubo del cuadro, y revisa que no haya daños.","Monta con grasa en las roscas o retenedor en el encaje a presión.","Aprieta al par del fabricante (en cajas roscadas suele estar entre 35 y 50 N·m).","Monta las bielas con el par de tu sistema y comprueba que el eje gire suave."],"En rosca, grasa; en encaje a presión, retenedor."],["pedales","Engrasar o cambiar los pedales","Transmisión","Fácil","20 min","5–80 €","10–15 €","Una vez al año","Llave de pedal, grasa",["Desmonta cada pedal.","Limpia la rosca y engrasa.","Monta y aprieta; el izquierdo tiene rosca inversa.","Comprueba que el eje gire suave."],"El pedal izquierdo se afloja girando hacia la derecha."],["pastillas","Cambiar las pastillas de disco","Frenos","Fácil","20–30 min","10–35 € el par","10–20 €","Cuando quede cerca de 1 mm de material","Allen, alicates, espátula de plástico",["Quita la rueda y retira el pasador o tornillo de las pastillas.","Saca las pastillas y observa el material que queda: con aproximadamente 1 mm hay que cambiarlas.","Empuja los pistones con la espátula hasta el fondo y limpia la zona con alcohol.","Coloca las pastillas nuevas con su muelle y fija el pasador.","Monta la rueda y acciona la maneta varias veces hasta que haga tope.","Asienta con 10 frenadas progresivas desde unos 20 km/h y otras 10 desde unos 30 km/h.","Comprueba que no roce al girar la rueda."],"No toques pastillas ni disco con los dedos."],["purga","Purgar los frenos hidráulicos","Frenos","Taller","60 min","23–45 € (kit y fluido)","20–40 € por freno","Cada 1–2 años o si la maneta está esponjosa","Kit de purga, fluido correcto, guantes",["Identifica el fluido que indique el fabricante (DOT o aceite mineral) y usa el kit correcto.","Coloca la bici en soporte y deja la maneta en posición horizontal.","Quita las pastillas y pon un separador entre los pistones.","Conecta el kit en la pinza y en el depósito de la maneta según el manual de la marca.","Empuja el fluido desde la pinza hacia la maneta y golpea suavemente el latiguillo para sacar las burbujas.","Cierra la purga, retira el kit, limpia el fluido y cierra el depósito.","Monta pastillas y rueda y comprueba que la maneta queda firme.","Limpia cualquier gota con alcohol: el fluido contamina las pastillas."],"DOT y aceite mineral nunca se mezclan."],["disco","Cambiar o enderezar el disco","Frenos","Fácil","30 min","15–50 €","10–20 €","Si roza o está por debajo del grosor mínimo","Torx, llave dinamométrica",["Quita la rueda y apóyala sobre una superficie plana.","Afloja los tornillos en cruz y retira el disco.","Limpia el asiento del disco en el buje.","Monta el disco nuevo con el sentido de giro marcado y aprieta en cruz con llave dinamométrica (Shimano ≈2 N·m, SRAM ≈6 N·m; mira el valor marcado).","Limpia el disco nuevo con alcohol isopropílico.","Monta la rueda y centra la pinza si roza."],"Limpia el disco nuevo con alcohol antes de usarlo."],["zapatas","Cambiar las zapatas de llanta","Frenos","Fácil","20 min","6–20 € el par","8–15 €","Cuando se llegue al indicador de desgaste","Allen",["Suelta el tornillo de la zapata y retírala.","Coloca la nueva respetando el sentido de giro.","Oriéntala con 1–2 mm de convergencia (toe-in).","Aprieta y comprueba el recorrido de la maneta."],"Revisa las zapatas tras salidas con lluvia."],["presion","Revisar presión y estado de los neumáticos","Ruedas","Fácil","5 min","0 €","—","Antes de cada salida","Bomba con manómetro",["Mide la presión con el manómetro.","Ajusta según tu peso, ancho de cubierta y terreno.","Revisa cortes, grietas y piedras clavadas.","Comprueba que la válvula esté recta y cerrada."],"Mide justo antes de salir."],["pinchazo","Reparar un pinchazo o cambiar la cámara","Ruedas","Fácil","20 min","3–10 €","8–15 €","Cuando haya un pinchazo","Desmontables, bomba, parches",["Quita la rueda; con freno de llanta, abre antes el freno para sacarla.","Desinfla y despega un lado de la cubierta con los desmontables, de uno en uno; no uses un destornillador.","Saca la cámara y localiza el pinchazo: hincha y escucha o mira en agua.","Revisa el interior de la cubierta con los dedos, con cuidado, para encontrar la espina.","Aplica el parche (limpia, lija ligero, pega con pegamento y deja secar) o pon una cámara nueva.","Hincha un poco la cámara y colócala dentro de la cubierta, empezando por la válvula.","Mete la cubierta con las manos sin pellizcar la cámara e hincha a la presión correcta.","Comprueba que la cubierta asienta bien en la llanta."],"Pasa un dedo por dentro de la cubierta para encontrar la espina."],["tubeless","Cambiar el sellante tubeless","Ruedas","Fácil","20–30 min","8–15 €","10–20 €","Cada 3–6 meses","Inyector o jeringa, sellante",["Quita la rueda y desinfla la cubierta.","Saca el núcleo de la válvula y vacía el sellante viejo.","Despega un lado de la cubierta y limpia los restos de sellante seco.","Vuelve a colocar la cubierta y prepara la dosis recomendada de sellante (suele estar entre 30 y 60 ml por rueda).","Inyecta el sellante por la válvula con el inyector.","Hincha con bomba de alta presión o compresor para asentar la cubierta y gira la rueda.","Baja a la presión de uso y comprueba que no pierde."],"Revisa el sellante antes de salidas largas."],["centrado","Centrar la rueda y revisar radios","Ruedas","Taller","30–45 min","—","15–30 €","Si la rueda baila o suenan radios","Llave de radios, soporte de centrado",["Gira la rueda y mira dónde roza o salta.","Comprueba la tensión de los radios.","Ajusta los radios del lado que corresponda en pequeños pasos.","Repite hasta que gire recta."],"Sin soporte de centrado es mejor dejarlo al taller."],["bujes","Engrasar y revisar los bujes","Ruedas","Media","45–60 min","5–20 €","25–50 €","Cada 6–12 meses","Llaves de conos, grasa",["Identifica el tipo de buje (conos o cartucho) y consigue las llaves y el manual.","Quita la rueda y el eje y desmonta las tapas laterales.","Limpia rodamientos, conos y tazas con desengrasante.","Revisa muescas o corrosión y cambia las piezas dañadas.","Engrasa con grasa para rodamientos y monta con la precarga correcta.","Ajusta los conos hasta quitar el juego sin dejarlo duro y aprieta las contratuercas.","Comprueba que gira suave y sin juego."],"El eje debe girar suave y sin tope."],["direccion","Engrasar y ajustar la dirección","Dirección y cuadro","Media","45 min","5–10 €","25–45 €","Una vez al año","Allen, llave dinamométrica, grasa",["Afloja la potencia del tubo de dirección y retira la tapa.","Saca la horquilla con cuidado de no perder rodamientos, espaciadores y anillos.","Limpia cazoletas, rodamientos y el tubo de dirección con desengrasante.","Revisa muescas o corrosión y cambia las piezas dañadas.","Engrasa y vuelve a montar en orden.","Coloca la potencia y la tapa y aprieta el tornillo de la tapa hasta quitar el juego.","Alinea la potencia con la rueda y aprieta sus tornillos al par.","Comprueba que la dirección gira libre y sin juego."],"La tapa solo da precarga: no es para apretar fuerte."],["cinta","Cambiar cinta o puños del manillar","Dirección y cuadro","Fácil","20 min","5–25 €","10–20 €","Cuando estén gastados","Cúter, cinta o puños nuevos",["Quita la cinta o los puños viejos.","Limpia el manillar.","Coloca los nuevos con tensión uniforme.","Fija los extremos con tapones."],"Empieza por la parte baja y sube."],["pivotes-mant","Revisar y engrasar los pivotes de la suspensión","Suspensión y pivotes","Media","1–2 h","5–10 € de grasa · 20–80 € de rodamientos","40–100 €","Cada 6–12 meses o tras barro","Llaves allen y torx, llave dinamométrica, grasa",["Mueve el basculante de lado a lado para buscar juego.","Anota el orden de ejes, arandelas y espaciadores.","Limpia, engrasa y cambia los rodamientos con juego.","Monta y aprieta al par del fabricante."],"Haz una foto antes de desmontar."],["horquilla","Servicio de la horquilla de suspensión","Suspensión y pivotes","Taller","60 min","20–60 €","50–90 €","Cada 50 horas o 6–12 meses","Kit de servicio, aceite, herramientas específicas",["Anota la presión y el rebote actuales.","Quita la rueda y limpia la horquilla.","Desmonta las botellas siguiendo el manual del fabricante.","Vacía el aceite del tren inferior y limpia.","Cambia retenes, espumas y juntas que incluya el kit.","Rellena de aceite en la cantidad indicada.","Monta, ajusta presión y rebote."],"Sin herramientas específicas, mejor al taller."],["sag","Ajustar presión y SAG de la suspensión","Suspensión y pivotes","Fácil","15 min","20–40 € (bomba)","—","Al cambiar de terreno o de equipo","Bomba de suspensión",["Ponte en posición de marcha con el equipo.","Coloca el aro (o goma) del vástago en la posición cero.","Siéntate en posición de pedaleo sin rebotar y baja con cuidado.","Mide cuánto ha recorrido el aro: ese es el SAG.","Compáralo con el recomendado (suele estar entre el 20 y el 30 %, según el uso).","Ajusta la presión y repite la medida.","Ajusta el rebote y anota la presión."],"Cada fabricante da una tabla de partida."],["ebike","Revisar batería, contactos y conexiones","Eléctrica","Fácil","15 min","0 €","—","Cada mes","Trapo seco, llave del fabricante",["Quita la batería y limpia los contactos.","Revisa el soporte y el cierre.","Comprueba que no haya cables rozados.","Mira si el fabricante publica una actualización de firmware."],"No uses chorro a presión sobre motor ni batería."],["tornillos","Reapretar todos los tornillos","General","Fácil","30 min","0 €","—","Cada mes y tras caídas","Allen, torx, llave dinamométrica",["Sigue el checklist de tornillos.","Aprieta al par indicado en la pieza.","No sobrepases el par en carbono.","Comprueba que nada baile."],"Marca los tornillos con rotulador para ver si se mueven."],["limpieza","Limpiar la bici a fondo","General","Fácil","30–45 min","5–15 €","15–30 €","Cada mes o tras barro","Agua suave, cepillo, desengrasante",["Humedece con agua suave, sin presión.","Limpia la transmisión con desengrasante.","Lava el cuadro con jabón y aclara.","Seca y lubrica la cadena."],"Evita el chorro a presión en bujes, pedalier y dirección."],["revision","Revisión rápida antes de salir","General","Fácil","5–10 min","0 €","—","Antes de cada salida","Ninguna",["Aire: comprueba la presión.","Frenos: acciona ambos y revisa el recorrido.","Cadena: mira que esté lubricada.","Ejes y cierres: comprueba que estén cerrados.","Da una vuelta corta escuchando ruidos."],"Si ves u oyes algo raro, no salgas hasta resolverlo."],["freno-llanta","Ajustar los frenos de llanta y la tensión del cable","Frenos","Fácil","20 min","0 €","8–15 €","Cuando el recorrido de la maneta sea largo","Allen, alicates",["Afloja el tornillo de anclaje del cable en el brazo del freno.","Acerca las zapatas a la llanta a 1–2 mm y fija su altura.","Tensa el cable con alicates y aprieta el anclaje.","Afina con el ajustador de barril.","Comprueba que la rueda gira libre y que las zapatas tocan a la vez.","Prueba la frenada a baja velocidad."],"Las zapatas deben tocar la llanta a la vez."],["cable-freno","Cambiar el cable y la funda del freno","Frenos","Media","45 min","8–20 €","20–35 €","Una vez al año","Alicates de cables, cortador de fundas, lubricante",["Suelta el cable en la pinza y en la maneta.","Saca cable y funda viejos y mira si hay óxido, hilos rotos o dobleces.","Corta la funda nueva con un cortador, quita las rebabas y pon los topes.","Pon una gota de lubricante en el cable y pásalo por la funda.","Tensa el cable y aprieta el anclaje.","Afina con el ajustador de la maneta.","Comprueba que el freno vuelve sin ruido."],"Una funda aplastada hace que el freno vuelva lento."],["pinza-limpieza","Limpiar la pinza y los pistones del freno de disco","Frenos","Media","30 min","3–6 €","15–25 €","Cada 6 meses o si un pistón se pega","Alcohol isopropílico, espátula de plástico, trapo",["Quita la rueda y las pastillas.","Limpia la pinza con alcohol y un cepillo suave.","Empuja los pistones con la espátula y límpialos con alcohol sin dejar fluido.","Si un pistón se atasca, alterna entre empujarlo y accionar la maneta con un separador.","Comprueba que los pistones vuelven por igual.","Monta las pastillas y la rueda.","Prueba el freno y comprueba que no roza."],"No dejes fluido sobre las pastillas."],["rueda-libre","Engrasar el cuerpo de rueda libre","Transmisión","Media","30–45 min","3–8 €","20–35 €","Una vez al año","Allen, grasa o aceite ligero",["Quita la rueda y el cassette.","Retira el cuerpo de rueda libre si tu buje lo permite.","Limpia y aplica aceite ligero en el mecanismo.","Monta y comprueba que gire suave y sin juego."],"Mira el manual de tu buje: cambia según el fabricante."],["platos","Cambiar los platos o el monoplato","Transmisión","Media","40 min","25–120 €","15–30 €","Cuando los dientes estén afilados","Allen o torx, llave de platos, grasa",["Quita la biela de la transmisión siguiendo el sistema de tu marca.","Anota la posición y la orientación del plato.","Afloja los tornillos del plato en cruz con la llave específica.","Retira el plato y limpia la araña.","Monta el plato nuevo en la posición correcta.","Aprieta los tornillos en cruz y al par (suele estar entre 8 y 12 N·m).","Monta la biela y la cadena y revisa el cambio."],"Cambia cadena y cassette a la vez si el desgaste es alto."],["biela","Revisar bielas y sus tornillos","Transmisión","Fácil","15 min","0 €","—","Cada mes","Allen, llave dinamométrica",["Empuja cada biela de lado a lado: no debe haber juego.","Comprueba el par de los tornillos.","Mira si hay grietas en la biela.","Revisa el estado de las estrías."],"Un juego en la biela suena como crujido de pedalier."],["desviador-del","Ajustar el desviador delantero","Transmisión","Media","30 min","0 €","10–20 €","Cuando roza o cae la cadena","Allen, destornillador",["Pon la cadena en el plato pequeño y el piñón grande para ajustar el límite L, y en el plato grande y el piñón pequeño para el H.","Comprueba que el desviador esté a 1–3 mm del plato grande y paralelo.","Ajusta el tornillo L hasta que la cadena no caiga del plato pequeño hacia dentro.","Ajusta el tornillo H hasta que no se pase del plato grande hacia fuera.","Tensa el cable y afina con el barril hasta que cambie limpio.","Prueba todas las combinaciones y evita la cruzada extrema.","Comprueba que el roce ha desaparecido."],"Una separación de 1–3 mm con el plato grande es la habitual."],["patilla","Comprobar y alinear la patilla del cambio","Transmisión","Taller","15 min","—","10–20 €","Tras caídas o golpes en la rueda trasera","Alineador de patilla (taller)",["Mira desde atrás si el cambio queda en línea con los piñones.","Si queda torcido, no lo fuerces con la mano.","Lleva la bici a un taller con alineador.","Revisa el indexado después."],"Una patilla torcida causa saltos y ruido que ningún ajuste arregla."],["eje-pasante","Limpiar y engrasar ejes pasantes y cierres","Ruedas","Fácil","10 min","3–5 €","—","Cada 3 meses","Trapo, grasa",["Saca el eje y limpia la rosca.","Pon una capa fina de grasa.","Monta y aprieta al par del fabricante.","Comprueba que la rueda quede bien asentada."],"Un eje seco puede crujir en cada bache."],["valvula","Cambiar la cinta de llanta o la válvula","Ruedas","Media","20 min","3–10 €","8–15 €","Cuando haya pinchazos por los radios o la válvula pierda","Desmontables, bomba",["Desmonta la cubierta.","Sustituye la cinta o la válvula.","Comprueba que cubra todos los agujeros de los radios.","Monta la cubierta e hincha."],"Una cinta movida pincha la cámara."],["sillin-tija","Engrasar la tija y el sillín","Dirección y cuadro","Fácil","15 min","5 €","—","Cada 6 meses","Allen, grasa, trapo",["Saca la tija y limpia el tubo de sillín.","Aplica grasa (metal) o pasta de carbono.","Monta a la altura marcada.","Aprieta la abrazadera al par."],"En carbono, pasta de montaje y llave dinamométrica."],["tija-telesc","Servicio de la tija telescópica","Dirección y cuadro","Media","45 min","10–30 €","30–60 €","Cada 100–200 horas de uso","Llaves del fabricante, grasa, aceite",["Limpia la zona del tubo.","Desmonta el cartucho según el modelo.","Limpia y lubrica los casquillos.","Monta y comprueba el recorrido."],"Cada fabricante marca su propio intervalo."],["retenes","Cambiar los retenes de la horquilla","Suspensión y pivotes","Taller","60 min","15–40 €","40–80 €","Cuando haya fugas de aceite","Herramientas del fabricante, aceite",["Desmonta las botellas.","Retira el retén y limpia el alojamiento.","Monta el retén nuevo con la herramienta adecuada.","Rellena de aceite y ajusta."],"Un vástago sucio es la causa nº 1 de fugas."],["casquillos","Cambiar los casquillos del amortiguador","Suspensión y pivotes","Taller","60–90 min","15–50 €","40–80 €","Cuando haya juego en el ojal","Prensa de casquillos, llaves",["Desmonta el amortiguador.","Saca los casquillos viejos con la prensa.","Instala los nuevos sin golpearlos.","Monta y comprueba que no haya juego."],"El juego en el ojal da un golpeteo en cada bache."],["ebike-sensor","Revisar sensores, conectores y pantalla","Eléctrica","Fácil","15 min","0 €","—","Cada 3 meses","Trapo seco, llave del fabricante",["Revisa el sensor de velocidad y de cadencia.","Comprueba conectores y cables sin roces.","Mira que la pantalla funcione y esté fija.","Limpia sin agua a presión."],"Un sensor desalineado puede cortar la asistencia."],["bateria-carga","Cuidar la batería y la carga","Eléctrica","Fácil","5 min","0 €","—","Siempre","Cargador original",["Usa el cargador original.","No cargues con la batería muy caliente o helada.","Guarda a media carga si no la usas.","Revisa el conector de carga y mantenlo limpio."],"Evita dejarla totalmente descargada mucho tiempo."],["guardabarros","Montar y ajustar guardabarros y portabultos","General","Fácil","30 min","15–60 €","10–20 €","Al montarlos y cada mes","Allen, bridas, destornillador",["Presenta el guardabarros y centra respecto a la rueda.","Fija los soportes sin apretar del todo.","Ajusta la distancia con la cubierta.","Aprieta y comprueba que no roce."],"El roce en el guardabarros suena como un problema de rueda."],["luces","Revisar luces y reflectantes","General","Fácil","10 min","0–30 €","—","Antes de salir de noche","Destornillador",["Comprueba que enciendan y la batería.","Fija el soporte para que no vibre.","Limpia reflectantes y lente.","Ajusta la altura para no deslumbrar."],"Una luz suelta vibra y se confunde con ruido de cuadro."],["invierno","Preparar la bici para el invierno","General","Fácil","45 min","15–30 €","—","Antes de la época fría","Lubricante húmedo, desengrasante, trapo",["Lubrica la cadena con lubricante húmedo.","Revisa el estado de pastillas y cubiertas.","Revisa luces y guardabarros.","Engrasa pivotes y ejes."],"En frío, el aceite y la grasa se endurecen."],["almacenaje","Guardar la bici varios meses","General","Fácil","30 min","5–10 €","—","Antes de guardarla","Trapo, lubricante, bomba",["Limpia y seca la bici a fondo.","Lubrica la cadena y los pivotes.","Hincha las cubiertas y guárdala en seco.","Si es eléctrica, deja la batería a media carga."],"Cuélgala o muévela de vez en cuando para que las cubiertas no se deformen."],["cubiertas","Cambiar las cubiertas","Ruedas","Fácil","20–30 min por rueda","20–70 € cada una","8–15 € por rueda","Cuando el dibujo se agote o aparezcan cortes","Desmontables, bomba, jabón",["Desinfla y despega un lado de la cubierta con los desmontables.","Saca la cubierta y la cámara.","Revisa la llanta y la cinta de llanta.","Mira el sentido de giro marcado en la cubierta y colócala siguiendo la flecha.","Coloca la cámara o el sellante según tu sistema.","Asienta la cubierta con bomba y gira la rueda.","Ajusta la presión de uso."],"Respeta la flecha de sentido de giro."],["alcance-maneta","Ajustar el alcance y el punto de contacto de la maneta","Frenos","Fácil","5–10 min","0 €","—","Cuando la maneta quede lejos o cerca","Allen",["Localiza los tornillos de alcance y de punto de contacto en la maneta.","Gira el de alcance hasta que llegues cómodo con el dedo.","Prueba a frenar con la bici parada.","Ajusta el punto de contacto si tu maneta lo permite.","Comprueba que la maneta recorra libre y no toque el manillar."],"Un ajuste cómodo mejora el control en bajadas."],["vastagos","Limpiar y lubricar los vástagos de la horquilla","Suspensión y pivotes","Fácil","10 min","5–10 €","—","Después de cada salida con barro","Trapo limpio, aceite para suspensión",["Limpia los vástagos con un trapo limpio.","Aplica una gota de aceite de suspensión en el trapo y pásalo por los vástagos.","Comprime la horquilla varias veces.","Quita el exceso con un trapo limpio.","Mira si hay fugas de aceite en los retenes."],"Un vástago sucio acorta la vida de los retenes."],["rodamientos-direccion","Cambiar los rodamientos de la dirección","Dirección y cuadro","Media","60 min","15–45 €","30–60 €","Cuando haya durez  if(st.fr==="llanta"&&["pinza","disco"].some(k=>st.z.has(k)))bad.push("Has indicado frenos de llanta pero marcas pinza o disco: revisa el tipo de freno en Mi bici.");
 if(st.fr.startsWith("disco")&&st.z.has("brazos"))bad.push("Has indicado frenos de disco pero marcas los brazos del freno de llanta: revisa el tipo de freno en Mi bici.");
 if(st.fr==="tambor"&&["pinza","disco","pastillas"].some(k=>st.z.has(k)))bad.push("Has indicado freno de tambor pero marcas pinza, disco o pastillas: revisa el tipo de freno en Mi bici.");
 const t2=top.slice(0,2).map(t=>t[0]);
 if(t2.includes("frenos"))al.push("Los frenos son seguridad: no salgas a bajadas ni a velocidad hasta comprobarlos con la bici parada y a baja velocidad.");
 if(c.r.slice(0,8).some(x=>x.c.n.startsWith("Grieta")))al.push("Una grieta en el cuadro es un riesgo serio: si ves cualquier señal, no uses la bici y llévala a un taller.");
 if([...st.t].some(t=>["saltos","freeride","escaleras"].includes(t))&&t2.some(z=>["suspension","ruedas","direccion","cuadro"].includes(z)))al.push("Tras saltos o escaleras, revisa pares, pivotes y llantas antes de volver a salir.");
 if(/carbon|carbono/i.test(st.m)&&t2.some(z=>["direccion","sillin","cuadro"].includes(z)))al.push("Piezas de carbono: no sobrepases el par, usa pasta de montaje y revisa si hay grietas.");
 if(t2.some(z=>["direccion","ruedas"].includes(z)))al.push("Dirección y ruedas son piezas críticas: si hay juego, no sigas usando la bici.");
 if(!st.w.size)miss.push("Cuándo suena: es el dato más útil.");if(!st.s.size)miss.push("Cómo suena.");if(!st.z.size)miss.push("Qué pieza sospechas (opcional: puedes dejarlo en blanco y usar «Afinar»).");if(!st.t.size)miss.push("En qué terreno ocurre.");if(st.qa.length<3)miss.push("Las pruebas de «Afinar»: bastan 3–5 respuestas.");
 const cost={"Fácil":1,"Media":2,"Taller":3},plan=c.r.slice(0,6).map(x=>({c:x.c,sc:x.v/(cost[x.c.l]||2)})).sort((a,b)=>b.sc-a.sc).slice(0,4);
 st.rev=`Confianza ${lvl} (${conf} %). Zona probable: ${Z[z1]}. Plan: `+plan.map((x,i)=>(i+1)+") "+x.c.n).join("; ");
 return `<section class="card"><h2>🤖 Revisor automático</h2><p class="sub">Repaso tus respuestas y el resultado. Son reglas del propio archivo: no es una IA ni usa internet.</p><div class="rw"><span class="nm">Confianza: ${lvl}</span><span class="pc">${conf} %</span><span class="bar"><i style="width:${conf}%"></i></span></div><p class="sub">${conf<40?"Hay poca información para estar seguro: completa lo que falta o usa «Afinar».":conf<65?"Hay una pista razonable, pero conviene confirmarla con las pruebas.":"La pista es clara: confirma con la prueba rápida de la zona."}</p>${al.map(a=>`<p class="alert">⚠️ ${a}</p>`).join("")}${bad.length?`<h3 class="grp">Cosas que no cuadran</h3>${bad.map(b=>`<p class="hint">${b}</p>`).join("")}`:'<p class="hint">✅ No veo contradicciones en tus respuestas.</p>'}${miss.length?`<h3 class="grp">Qué falta por saber</h3><ul class="chk">${miss.map(m=>`<li>• ${m}</li>`).join("")}</ul>`:""}</section><section class="card"><h2>Plan recomendado</h2><p class="sub">Ordenado de lo más fácil y probable a lo más difícil.</p><ol class="loc">${plan.map((x,i)=>`<li><span class="nb">${i+1}</span><span class="nm">${x.c.n}</span><span class="dg ${x.c.l[0]}">${x.c.l}</span><p>⏱ ${x.c.t} · 💶 ${x.c.pr||"—"}</p></li>`).join("")}</ol><p class="hint">Haz una cosa cada vez y prueba después. Si nada lo resuelve, ve a un taller con el resumen copiado.</p></section>`}
function vNoise(){if(st.nv==="wiz")return wiz();const c=calc();
 return `<div class="seg" role="tablist">${[["zona","📍 Dónde"],["causas","🔎 Causas"],["tornillos","🔩 Tornillos"],["afinar","❓ Afinar"],["revision","✅ Revisión"]].map(([v,n])=>`<button role="tab" data-a="sub" data-v="${v}" aria-selected="${st.sub===v}">${n}</button>`).join("")}</div>${({zona:()=>zona(c),causas:()=>causas(c),tornillos:bolts,afinar,revision:()=>revision(c)})[st.sub]()}<div class="nav"><button class="btn g" data-a="back">Cambiar respuestas</button><button class="btn g" data-a="copy">Copiar resumen</button><button class="btn" data-a="reset">Nuevo ruido</button></div>`}
function taskList(){const q=n2(st.q);return M.filter(t=>(st.cat==="Todas"||t[2]===st.cat)&&(st.dif==="Todas"||t[3]===st.dif)&&(!q||n2(t[1]+" "+t[2]+" "+t[8]).includes(q))).map(t=>`<button class="tk" data-a="task" data-v="${t[0]}"><span class="nm">${t[1]}</span><span class="dg ${t[3][0]}">${t[3]}</span><span class="zn">⏱ ${t[4]} · 💶 ${t[5]}${st.done[t[0]]?" · ✅ "+ago(st.done[t[0]]):""}</span></button>`).join("")||'<p class="empty">No hay tareas con esos filtros.</p>'}
const toolList=()=>{const q=n2(st.q);return TOOLS.filter(t=>(st.dif==="Todas"||t[3]===st.dif)&&(!q||n2(t[0]+" "+t[1]).includes(q))).map(t=>`<details class="r"><summary><span class="nm">${t[0]}</span><span class="dg ${LV[t[3]]}">${t[3]}</span><span class="zn">💶 ${t[2]}</span></summary><div class="bd"><p>${t[1]}</p>${t[4]?`<p class="tip">${t[4]}</p>`:""}</div></details>`).join("")||'<p class="empty">No hay herramientas con esos filtros.</p>'};
const listHTML=()=>st.shop==="herr"?toolList():taskList();
const vShop=()=>{const h=st.shop==="herr";return `<section class="hero"><h2>Taller</h2><p class="sub">${h?TOOLS.length+" herramientas y productos: para qué sirven y cuánto cuestan.":M.length+" tareas con tiempo, precio, dificultad y paso a paso."} Precios en euros, orientativos.</p></section><div class="seg">${[["tareas","🛠️ Tareas"],["herr","🧰 Herramientas"]].map(([v,n])=>`<button data-a="shop" data-v="${v}" aria-selected="${st.shop===v}">${n}</button>`).join("")}</div><input type="text" id="q" placeholder="${h?"Buscar: llave, grasa, bomba…":"Buscar: cadena, pivotes, frenos…"}" autocomplete="off" value="${esc(st.q)}">${h?"":`<div class="fl">${CATS.map(c=>card("cat",c,c,"",st.cat===c)).join("")}</div>`}<div class="fl">${(h?["Todas","Básica","Útil","Avanzada"]:DIFS).map(c=>card("dif",c,c==="Todas"?"Cualquier nivel":c,"",st.dif===c)).join("")}</div><div id="list">${listHTML()}</div>`};
const vBike=()=>`<section class="card"><h2>Mi bici</h2><p class="sub">Se guarda solo en este dispositivo y personaliza el diagnóstico.</p><input type="text" id="mod" placeholder="Modelo (opcional): Trek Domane, Rockhopper…" autocomplete="off" value="${esc(st.m)}"><h3 class="grp">Tipo</h3><div class="opts">${TP.map(([n,e])=>card("tipo",n,n,e,st.tipo===n)).join("")}</div><h3 class="grp">🛑 ¿Qué frenos tiene?</h3><div class="opts">${FR.map(([v,n,e])=>card("fr",v,n,e,st.fr===v)).join("")}</div><p class="sub">Tareas marcadas como hechas: <b>${Object.keys(st.done).length}</b></p></section>`;
function render(){document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.v===st.tab));document.getElementById("mine").textContent=[st.m,st.tipo].filter(Boolean).join(" · ");app.innerHTML=({home:vHome,noise:vNoise,shop:vShop,bike:vBike})[st.tab]()}
const go=()=>{render();scrollTo(0,0)};
function sheet(id){const t=M.find(x=>x[0]===id);
 dlg.innerHTML=`<div class="sh"><h2>${t[1]}</h2><div class="chips2"><span class="dg ${t[3][0]}">${t[3]}</span><span class="pill">⏱ ${t[4]}</span><span class="pill">📅 ${t[7]}</span></div><div class="price"><div><small>Hazlo tú</small><b>${t[5]}</b></div><div><small>En taller</small><b>${t[6]}</b></div></div><h3>Herramientas</h3><p>${t[8]}</p><h3>Antes de empezar</h3><p>${CP[t[2]][0]}</p><h3>Paso a paso</h3><ol class="st">${t[9].map(s=>`<li><label><input type="checkbox"><span>${s}</span></label></li>`).join("")}</ol><h3>Al terminar</h3><p>${CP[t[2]][1]}</p><p class="tip">${t[10]}</p><p class="zn">${st.done[id]?"Hecho "+ago(st.done[id])+".":"Aún sin marcar como hecho."} Precios orientativos en euros: cambian según marca y taller.</p><div class="nav"><button class="btn g" data-a="close">Cerrar</button><button class="btn" data-a="done" data-v="${id}">Marcar hecho hoy</button></div></div>`;
 if(!dlg.open)dlg.showModal()}
const same=(a,f)=>document.querySelectorAll(`[data-a=${a}]`).forEach(b=>b.setAttribute("aria-pressed",f(b)));
const act={
 tab(el){st.tab=el.dataset.v;go()},
 toBolts(){st.tab="noise";st.nv="res";st.sub="tornillos";go()},
 sub(el){st.sub=el.dataset.v;go()},
 next(){st.i++;if(st.i>=STEPS.length){st.nv="res";st.sub="zona";st.i=STEPS.length-1}go()},
 wback(){st.i--;go()},back(){st.nv="wiz";go()},
 reset(){st.nv="wiz";st.i=0;st.sub="zona";st.ask=false;st.fin=false;st.more=false;st.qa=[];["w","s","z","t"].forEach(k=>st[k].clear());go()},
 begin(){st.ask=true;go()},more(){st.more=true;st.fin=false;go()},finish(){st.fin=true;go()},
 ans(el){st.qa.push([st.cur,el.dataset.v]);go()},undo(){st.qa.pop();st.fin=false;go()},
 tipo(el){st.tipo=el.dataset.v;save();same("tipo",b=>b===el);document.getElementById("mine").textContent=[st.m,st.tipo].filter(Boolean).join(" · ")},
 fr(el){st.fr=st.fr===el.dataset.v?"":el.dataset.v;save();same("fr",b=>b.dataset.v===st.fr)},
 tog(el){const{k,v}=el.dataset;st[k].has(v)?st[k].delete(v):st[k].add(v);el.setAttribute("aria-pressed",st[k].has(v))},
 shop(el){st.shop=el.dataset.v;st.dif="Todas";st.cat="Todas";go()},
 cat(el){st.cat=el.dataset.v;go()},dif(el){st.dif=el.dataset.v;go()},
 task(el){sheet(el.dataset.v)},close(){dlg.close()},
 done(el){st.done[el.dataset.v]=Date.now();ls.set("bici-hechos",st.done);sheet(el.dataset.v);if(st.tab==="shop")document.getElementById("list").innerHTML=listHTML()},
 async copy(el){const l=(k,o)=>[...st[k]].map(i=>o[i]).join(", ")||"–",f=FR.find(x=>x[0]===st.fr);try{await navigator.clipboard.writeText(`Bici: ${st.m||"sin indicar"} (${st.tipo}${f?", "+f[1]:""})\nTerreno: ${l("t",TL)}\nCuándo: ${l("w",W)}\nSonido: ${l("s",S)}\nPiezas: ${l("z",CL)}${st.qa.length?"\nPruebas: "+st.qa.map(([i,a])=>QS[i].t+" → "+({s:"Sí",n:"No",x:"No sé"})[a]).join("; "):""}${st.rev?"\nRevisión: "+st.rev:""}`);el.textContent="Copiado"}catch(e){el.textContent="No se pudo copiar"}setTimeout(()=>el.textContent="Copiar resumen",1600)}};
document.body.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(el&&act[el.dataset.a])act[el.dataset.a](el)});
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
document.body.addEventListener("input",e=>{if(e.target.id==="q"){st.q=e.target.value;document.getElementById("list").innerHTML=listHTML()}
 if(e.target.id==="mod"){st.m=e.target.value;save();document.getElementById("mine").textContent=[st.m,st.tipo].filter(Boolean).join(" · ")}});
render();
</script>
