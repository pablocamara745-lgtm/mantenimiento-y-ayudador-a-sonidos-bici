<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diagnóstico de ruidos de bici</title>
<style>
:root{--bg:#E6F2EF;--sf:#FFFFFF;--ink:#15303A;--mu:#5A727A;--ac:#0F8179;--ac2:#CFEBE6;--wa:#B26A00;--ln:#CFE0DC;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A1E;--sf:#18272C;--ink:#E6F1EF;--mu:#93AAB0;--ac:#45C2B8;--ac2:#1E3B3C;--wa:#EBA94F;--ln:#2A3E44;--on:#0F1A1E;color-scheme:dark}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 120px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{font-size:30px}
h1{font-size:22px;margin:0;font-weight:800;line-height:1.1}
.prog{display:flex;gap:8px;margin:0 0 18px}
.prog i{flex:1;height:8px;border-radius:99px;background:var(--ln);transition:background-color 200ms}
.prog i.on{background:var(--ac)}
.card{background:var(--sf);border-radius:32px;padding:24px 20px;box-shadow:0 8px 30px rgba(21,48,58,.08);animation:in 220ms cubic-bezier(.23,1,.32,1)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
h2{font-size:26px;margin:0 0 4px;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--mu);margin:0 0 18px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:22px}
.opt{font:inherit;font-weight:600;color:var(--ink);background:var(--bg);border:2px solid transparent;border-radius:22px;padding:16px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;transition:transform 140ms cubic-bezier(.23,1,.32,1),background-color 140ms}
.opt b{font-size:28px;line-height:1}
.opts.sm{grid-template-columns:repeat(auto-fill,minmax(125px,1fr));margin-bottom:6px}.opt.sm{padding:12px 8px;font-size:15px;border-radius:18px}.grp{font-size:16px;font-weight:800;margin:18px 0 8px}
.card+.card{margin-top:16px}.bike{width:100%;height:auto;display:block;margin:0 0 12px}.bike .fr{stroke:var(--ink);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.bike .wh{stroke:var(--mu);stroke-width:6;fill:none}.dot{fill:var(--ln)}.hot{fill:var(--ac)}.bike text{fill:var(--on);font:800 16px ui-rounded,system-ui,sans-serif;text-anchor:middle}
.loc{list-style:none;padding:0;margin:0}.loc li{display:grid;grid-template-columns:30px 1fr auto;gap:2px 10px;margin-bottom:14px}.loc p{grid-column:2/-1;margin:0;color:var(--mu);font-size:15px}.nb{font-weight:800;color:var(--on);background:var(--ac);border-radius:99px;width:26px;height:26px;display:grid;place-items:center;font-size:13px}
.opts.a3{grid-template-columns:repeat(3,1fr)}.qt{font-size:19px;font-weight:700;margin:0 0 16px}.rw{display:grid;grid-template-columns:1fr auto;gap:4px 14px;margin-bottom:12px}.alt{display:grid;gap:10px;margin:18px 0}
.chk{list-style:none;padding:0;margin:0}.chk li{margin-bottom:8px}.chk label{display:grid;grid-template-columns:24px 1fr;gap:10px;cursor:pointer}.chk input{width:20px;height:20px;accent-color:var(--ac)}.chk input:checked+span{text-decoration:line-through;color:var(--mu)}
.opt:active{transform:scale(.96)}
.opt[aria-pressed=true]{background:var(--ac);color:var(--on);border-color:var(--ac)}
@media (hover:hover) and (pointer:fine){.opt:hover{border-color:var(--ac)}}
input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid transparent;border-radius:99px;padding:14px 20px;margin-bottom:16px}
input:focus-visible,button:focus-visible,summary:focus-visible,[role=button]:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.nav{display:flex;gap:10px;justify-content:space-between}
.btn{font:inherit;font-weight:800;border:0;border-radius:99px;padding:14px 26px;cursor:pointer;background:var(--ac);color:var(--on);transition:transform 140ms cubic-bezier(.23,1,.32,1)}
.btn:active{transform:scale(.96)}
.btn.g{background:var(--ac2);color:var(--ink)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.pill{background:var(--ac2);border-radius:99px;padding:4px 12px;font-size:14px;font-weight:600}
.hint{background:var(--ac2);border-radius:20px;padding:12px 16px;font-size:14px;margin:0 0 12px}
details.r{background:var(--bg);border-radius:24px;margin-bottom:12px;overflow:hidden}
summary{list-style:none;cursor:pointer;padding:16px 20px;display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center}
summary::-webkit-details-marker{display:none}
.nm{font-weight:800;font-size:17px}
.pc{font-weight:800;color:var(--ac)}
.zn{color:var(--mu);font-size:14px}
.bar{grid-column:1/-1;height:8px;background:var(--sf);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px}
.bd{padding:0 20px 20px}
.bd h3{font-size:14px;margin:16px 0 6px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--mu)}
.meta b{color:var(--ink)}
ol.st{padding:0;list-style:none;margin:0;counter-reset:s}
ol.st li{counter-increment:s;margin-bottom:8px}
ol.st label{display:grid;grid-template-columns:30px 1fr;gap:8px;cursor:pointer}
ol.st label::before{content:counter(s);font-weight:800;color:var(--on);background:var(--ac);border-radius:99px;width:26px;height:26px;display:grid;place-items:center;font-size:13px}
ol.st input{position:absolute;opacity:0}
ol.st input:checked+span{text-decoration:line-through;color:var(--mu)}
ol.st input:focus-visible+span{outline:3px solid var(--ac);outline-offset:2px}
.tip{border-left:4px solid var(--wa);padding:2px 0 2px 12px;margin:14px 0 0}
.empty{background:var(--bg);border-radius:20px;padding:20px;color:var(--mu)}
@media(prefers-reduced-motion:reduce){.card{animation:none}.opt,.btn,.prog i{transition:none}}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;background:var(--sf);border-top:1px solid var(--ln);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{flex:1;max-width:150px;font:inherit;font-size:13px;font-weight:700;border:0;background:transparent;color:var(--mu);border-radius:20px;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs b{font-size:22px;line-height:1}.tabs button[aria-current=true]{background:var(--ac2);color:var(--ink)}
.chipm{margin-left:auto;font-size:13px;color:var(--mu);font-weight:700;text-align:right}
.hero h2{margin:8px 0 4px}.big{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin:18px 0 14px}
.tile{font:inherit;text-align:left;border:0;border-radius:36px;padding:28px 24px;cursor:pointer;display:grid;gap:6px;color:var(--on);transition:transform 140ms cubic-bezier(.23,1,.32,1)}
.tile b{font-size:44px;line-height:1}.tile .tt{font-size:22px;font-weight:800}.tile .ts{opacity:.92}.tile.a{background:var(--ac)}.tile.b{background:var(--wa)}.tile:active{transform:scale(.98)}
.mini{display:flex;gap:10px;flex-wrap:wrap}.mini .opt{flex-direction:row}
.seg{display:flex;gap:6px;background:var(--sf);border-radius:99px;padding:5px;margin-bottom:16px;overflow-x:auto}
.seg button{flex:1;font:inherit;font-weight:700;border:0;border-radius:99px;padding:10px 12px;background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap}
.seg button[aria-selected=true]{background:var(--ac);color:var(--on)}
.step{color:var(--ac);font-weight:800;margin:0 0 4px}
.fl{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}.fl .opt{flex:none;flex-direction:row;padding:8px 14px;border-radius:99px;font-size:14px}
.tk{font:inherit;color:var(--ink);text-align:left;width:100%;background:var(--sf);border:0;border-radius:24px;padding:16px 18px;margin-bottom:10px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;transition:transform 140ms}
.tk:active{transform:scale(.99)}.tk .zn{grid-column:1/-1}
.dg{border-radius:99px;padding:2px 12px;font-size:13px;font-weight:800;background:var(--ac2);color:var(--ink);white-space:nowrap}.dg.M{background:var(--wa);color:var(--on)}.dg.T{background:var(--ink);color:var(--bg)}
dialog{border:0;border-radius:32px 32px 0 0;padding:0;max-width:640px;width:100%;margin:auto auto 0;background:var(--sf);color:var(--ink)}
dialog::backdrop{background:rgba(10,20,25,.55)}dialog[open]{animation:in 220ms cubic-bezier(.23,1,.32,1)}
.sh{padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));overflow:auto;max-height:88vh}
.chips2{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.price{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.price div{background:var(--bg);border-radius:20px;padding:12px 14px}.price small{display:block;color:var(--mu)}
</style>
</head>
<body>
<main class="wrap"><div class="top"><span class="logo">🚲</span><h1>Taller de bici</h1><span class="chipm" id="mine"></span></div><div id="app"></div></main>
<nav class="tabs" id="tabs" aria-label="Secciones"></nav>

<script>const W={pedal_fuerte:"Pedaleando fuerte o subiendo",pedal_suave:"Pedaleando suave",vuelta:"Una vez por vuelta de pedal",parado:"De pie sobre los pedales",freno:"Al frenar",cambio:"Al cambiar de marcha",bache:"En baches o terreno roto",sinpedal:"Rodando sin pedalear",curva:"En curvas",humedad:"Con lluvia o humedad"};
const S={crujido:"Crujido",click:"Clic o chasquido",chirrido:"Chirrido",roce:"Roce o frote",zumbido:"Zumbido",golpeteo:"Golpeteo o traqueteo",rechinar:"Rechinar metálico",silbido:"Silbido"};
const Z={pedales:"Pedales",pedalier:"Pedalier y bielas",cadena:"Cadena",cassette:"Cassette y rueda libre",cambio:"Cambios y desviadores",frenos:"Frenos",ruedas:"Ruedas y radios",buje:"Bujes",direccion:"Dirección y manillar",sillin:"Sillín y tija",cuadro:"Cables y accesorios",suspension:"Suspensión",neumaticos:"Neumáticos",motor:"Motor eléctrico"};
const C=[
{n:"Caja de pedalier seca o floja",pr:"Grasa 5 € · caja nueva 15–80 € · taller 20–35 €",k:["eje_biela","pedalier"],z:"pedalier",w:["pedal_fuerte","vuelta","parado"],s:["crujido","click","golpeteo"],p:5,l:"Media",t:"30–60 min",h:"Extractor de cazoletas, grasa, llave dinamométrica",
why:"Es la causa más habitual de crujidos al pedalear fuerte. El agua y el polvo resecan roscas o encajes a presión y el metal roza cuando el cuadro flexa.",
st:["Quita pedales y bielas y gira el eje a mano: si el crujido desaparece, el problema está en otra pieza.","Extrae las cazoletas y limpia las roscas con desengrasante.","Monta con grasa en las roscas (o retenedor en encaje a presión) y aprieta al par del fabricante.","Prueba tras 10 km. Si en BB30 o PressFit vuelve, cambia a una caja con casquillos roscados."],
tip:"Un crujido que solo aparece al pedalear con fuerza casi siempre es pedalier, bielas o pedales."},
{n:"Bielas, platos o tornillos flojos",pr:"Gratis · tornillos 5–15 €",k:["monoplato","eje_biela","biela","platos"],z:"pedalier",w:["vuelta","pedal_fuerte"],s:["click","crujido"],p:3,l:"Fácil",t:"15 min",h:"Llaves allen, grasa, llave dinamométrica",
why:"Los tornillos de biela y de platos se aflojan con la carga y dejan un pequeño juego que suena una vez por vuelta.",
st:["Agarra cada biela y empújala de lado a lado: no debe haber juego.","Aprieta tornillos de biela y de platos al par indicado.","Si hay juego, desmonta, limpia la interfaz con el eje y engrasa antes de montar.","Revisa que las bielas no tengan grietas."],
tip:"Aprieta los tornillos de los platos en estrella, de forma alterna."},
{n:"Pedales o ejes de pedal secos",pr:"Grasa 5 € · pedales nuevos 15–80 €",k:["pedales"],z:"pedales",w:["vuelta","pedal_fuerte","parado"],s:["click","crujido","chirrido"],p:4,l:"Fácil",t:"20 min",h:"Llave de pedal, grasa",
why:"La rosca seca o el eje con holgura producen clics en cada pedalada, muy confundidos con el pedalier.",
st:["Pedalea con un solo pie para ver qué pedal suena.","Desmonta, limpia la rosca y engrasa. El pedal izquierdo tiene rosca inversa.","Mueve el eje con la mano: si baila, hay que cambiar rodamientos o el pedal.","En pedales automáticos, engrasa las calas y revisa que sus tornillos estén firmes."],
tip:"Prueba a pedalear con unos pedales de otra bici: es el descarte más rápido."},
{n:"Cadena seca o sucia",pr:"Lubricante 6–15 €",k:["guia","falsa","cadena"],z:"cadena",w:["pedal_suave","humedad","cambio"],s:["chirrido","roce","click"],p:4,l:"Fácil",t:"20 min",h:"Desengrasante, trapo, lubricante",
why:"Una cadena sin lubricar chirría, sobre todo tras lluvia. La suciedad en los rodillos añade clics y desgaste.",
st:["Limpia la cadena y los platos con desengrasante y un trapo.","Déjala secar por completo.","Aplica una gota en cada rodillo mientras giras las bielas hacia atrás.","Espera 15 minutos y quita el exceso con un trapo."],
tip:"Lubricante húmedo para lluvia, seco para polvo. Demasiado aceite atrae más suciedad."},
{n:"Cadena desgastada o eslabón rígido",pr:"Cadena 15–60 € · taller 10–20 €",k:["falsa","guia","cadena"],z:"cadena",w:["pedal_fuerte","cambio","vuelta"],s:["click","golpeteo","crujido"],p:3,l:"Media",t:"30 min",h:"Medidor de desgaste, tronchacadenas, cadena nueva",
why:"Un eslabón que no flexiona salta al pasar por el desviador y hace clic con una frecuencia fija. Una cadena estirada además salta bajo carga.",
st:["Pedalea hacia atrás y busca un eslabón que se levante o no flexione.","Mide el desgaste con el medidor: 0,5 % ya pide cambio en 11–12 velocidades.","Afloja el eslabón con los dedos o sustitúyelo.","Si cambias cadena con mucho desgaste, comprueba también cassette y platos."],
tip:"Cambiar la cadena a tiempo alarga la vida de cassette y platos."},
{n:"Desviadores desajustados o con roce",pr:"Gratis · taller 10–25 €",k:["jaula","patilla","desv_tras","desv_del","mandos"],z:"cambio",w:["cambio","pedal_suave","pedal_fuerte"],s:["roce","chirrido","zumbido","click"],p:5,l:"Media",t:"20–40 min",h:"Llaves allen, destornillador, lubricante",
why:"Si el ruido depende de la marcha, casi siempre es tensión de cable, límites mal ajustados o una patilla del cambio ligeramente torcida.",
st:["Anota en qué marchas suena. Si solo en cadena muy cruzada, es normal.","Gira el ajustador de barril un cuarto de vuelta hasta que cambie limpio.","Revisa los tornillos de límite H y L y la alineación del desviador delantero.","Comprueba la patilla del cambio: tras una caída suele quedar doblada."],
tip:"Un cable oxidado o con funda sucia da cambios lentos y ruido. Cámbialos cada año."},
{n:"Cassette o rueda libre",pr:"Cassette 25–120 € · rueda libre 20–60 €",k:["rueda_libre","cassette","buje_tras"],z:"cassette",w:["pedal_fuerte","sinpedal"],s:["click","crujido","zumbido"],p:3,l:"Media",t:"30 min",h:"Llave de cassette, látigo, grasa",
why:"El cierre del cassette flojo o el cuerpo de rueda libre seco producen crujidos bajo carga. El zumbido al no pedalear suele ser normal.",
st:["Quita la rueda y gira el cuerpo de rueda libre: debe ser suave y silencioso.","Comprueba que el cierre del cassette esté apretado al par.","Desmonta el cassette, limpia y engrasa las estrías.","Si el trinquete patina o cruje, cambia el cuerpo de rueda libre."],
tip:"Un zumbido al rodar sin pedalear no suele ser un fallo."},
{n:"Radios sueltos o rueda descentrada",pr:"Taller 15–35 €",k:["cinta","nipples","radios","llanta"],z:"ruedas",w:["bache","pedal_fuerte","curva"],s:["click","crujido","golpeteo"],p:3,l:"Taller",t:"Taller",h:"Llave de radios, soporte de centrado",
why:"Los radios con poca tensión crujen al cargar la rueda, y un eje pasante mal apretado hace clic en los baches.",
st:["Pellizca pares de radios: deben sentirse parecidos.","Golpea cada radio con una llave y compara el tono.","Comprueba que eje pasante o desmontable esté bien cerrado.","Si la rueda baila al girar, llévala a centrar."],
tip:"Un clic metálico cada vuelta de rueda, en vez de cada pedalada, apunta a la rueda."},
{n:"Rodamientos de buje con juego",pr:"Rodamientos 5–20 € · taller 25–50 €",k:["buje_del","buje_tras"],z:"buje",w:["sinpedal","curva","bache"],s:["zumbido","rechinar","golpeteo"],p:3,l:"Media",t:"45 min",h:"Llaves de conos, grasa, rodamientos",
why:"Un rodamiento seco o picado deja un zumbido continuo al rodar y juego lateral en la rueda.",
st:["Levanta la rueda y gírala: debe rodar sin ruido.","Agarra la llanta y balancéala de lado a lado: cualquier juego es un mal signo.","Desmonta el buje, limpia y engrasa o cambia los rodamientos.","En bujes de conos, reajusta la precarga hasta eliminar el juego sin que quede duro."],
tip:"El ruido que sube con la velocidad y se mantiene sin pedalear es casi siempre buje o freno."},
{n:"Dirección, potencia o manillar con juego",pr:"Grasa 5 € · cazoletas 15–40 € · taller 20–45 €",k:["tapa","punos","direccion","potencia","manillar"],z:"direccion",w:["freno","bache","parado","pedal_fuerte"],s:["golpeteo","crujido","click"],p:4,l:"Media",t:"30–45 min",h:"Llaves allen, llave dinamométrica, grasa",
why:"Un clac al frenar con la rueda delantera indica juego en la dirección. Un crujido de pie suele venir de potencia o manillar.",
st:["Frena la rueda delantera y balancea la bici adelante y atrás: si notas un golpe, hay juego.","Reajusta el casquillo de dirección y aprieta la potencia al par.","Desmonta manillar y potencia, limpia la interfaz y vuelve a montar con grasa o pasta de carbono.","Si persiste, cambia las cazoletas o rodamientos de dirección."],
tip:"En piezas de carbono nunca superes el par: se agrietan sin avisar."},
{n:"Sillín, tija o abrazadera",pr:"Grasa o pasta 5–12 € · tija 20–90 €",k:["sillin","tija"],z:"sillin",w:["pedal_fuerte","parado","bache"],s:["crujido","chirrido","click"],p:4,l:"Fácil",t:"15 min",h:"Allen, grasa o pasta de carbono",
why:"Es una fuente muy común y fácil de confundir con el pedalier. Los raíles y la tija reseca crujen al cargar el peso.",
st:["Aprieta la abrazadera y el tornillo del sillín al par.","Saca la tija, limpia el tubo y monta con grasa (metal) o pasta de carbono.","Revisa los raíles del sillín y su soporte: busca grietas.","Pedalea de pie un rato: si el ruido desaparece, el origen es esta zona."],
tip:"Antes de desmontar el pedalier, prueba a pedalear de pie."},
{n:"Suspensión y pivotes",pr:"Grasa 5–10 € · servicio 50–120 €",k:["remoto","retenes","bieleta","amortiguador","horquilla","pivotes"],z:"suspension",w:["bache","pedal_fuerte","curva"],s:["golpeteo","chirrido","crujido"],p:2,l:"Media",t:"60 min",h:"Llaves, llave dinamométrica, grasa de pivotes",
why:"Los pivotes y casquillos secos o flojos crujen al comprimirse. El vástago sucio de la horquilla chirría.",
st:["Limpia los vástagos y revisa si hay fugas de aceite.","Comprueba los tornillos de pivotes con par.","Agita el basculante de lado a lado para detectar juego.","Haz el servicio de horquilla y amortiguador según el intervalo del fabricante."],
tip:"Ruido en cada compresión del amortiguador apunta casi siempre a pivotes o casquillos."},
{n:"Cables y accesorios sueltos",pr:"Bridas 2–5 €",k:["guardabarros","portabultos","botellero","luces","cables"],z:"cuadro",w:["bache","curva","sinpedal"],s:["golpeteo","roce","zumbido"],p:3,l:"Fácil",t:"15 min",h:"Bridas, cinta, destornillador",
why:"Fundas que golpean el cuadro, botellero, portabultos, guardabarros o luz mal fijados suenan igual que un fallo mecánico.",
st:["Sacude la bici en el suelo y escucha dónde vibra.","Fija fundas y cables con bridas o protectores de cuadro.","Retira un accesorio cada vez y prueba de nuevo.","Aprieta los tornillos de botellero, portabultos y guardabarros."],
tip:"Antes de desmontar piezas caras, comprueba lo más barato: accesorios y cables."},
{n:"Pastillas de disco contaminadas o glaseadas",pr:"Pastillas 10–35 € el par · alcohol 4 €",b:["disco_hid","disco_mec"],k:["pastillas","disco"],z:"frenos",w:["freno","humedad"],s:["chirrido","silbido"],p:5,l:"Fácil",t:"20 min",h:"Alcohol isopropílico, lija fina, pastillas",why:"El aceite, el barro o el sobrecalentamiento dejan la pastilla vitrificada o sucia y el disco vibra al frenar.",st:["Quita las pastillas y mira si brillan como un espejo o tienen manchas.","Limpia el disco con alcohol isopropílico y un trapo limpio.","Lija ligeramente las pastillas si solo están glaseadas; si tienen aceite, cámbialas.","Asiéntalas con 10 frenadas progresivas a velocidad media."],tip:"No toques disco ni pastillas con los dedos ni con spray de cadena."},
{n:"Disco torcido o pinza descentrada",pr:"Disco 15–50 € · taller 10–20 €",b:["disco_hid","disco_mec"],k:["tdisco","disco","pinza"],z:"frenos",w:["sinpedal","curva","freno"],s:["roce","zumbido"],p:4,l:"Fácil",t:"20 min",h:"Allen, llave de disco o llave grifa",why:"Un roce rítmico en cada vuelta indica disco alabeado; uno constante, pinza mal centrada.",st:["Gira la rueda y mira por la ranura de la pinza dónde roza.","Afloja los tornillos de la pinza, tira de la maneta y aprieta con ella presionada.","Si roza en un punto, endereza el disco con cuidado o cámbialo.","Comprueba que el disco esté bien apretado en su buje."],tip:"Cámbialo si queda por debajo del grosor mínimo grabado en el disco."},
{n:"Pistones pegados o aire en el circuito",pr:"Kit de purga 15–30 € · taller 25–45 €",b:["disco_hid"],k:["pinza","maneta","manguera"],z:"frenos",w:["freno","sinpedal"],s:["roce","chirrido","golpeteo"],p:3,l:"Media",t:"45 min",h:"Kit de purga, fluido correcto, espátula",why:"Un pistón que no retrocede deja la pastilla pegada, y una maneta esponjosa sugiere aire.",st:["Quita las pastillas y empuja los pistones con una espátula de plástico.","Limpia los pistones con alcohol sin dejar fluido sobre las pastillas.","Si la maneta sigue blanda, purga con el fluido que indique el fabricante.","Si hay fugas, lleva el freno al taller."],tip:"DOT y aceite mineral nunca se mezclan: usa el que indique la maneta."},
{n:"Frenos de llanta: zapatas y llanta",pr:"Zapatas 6–20 € el par",b:["llanta"],k:["brazos","pastillas","disco"],z:"frenos",w:["freno","humedad"],s:["chirrido","silbido","roce"],p:3,l:"Fácil",t:"20 min",h:"Allen, lija, trapo",why:"Zapatas duras, desgastadas o con mal ángulo chirrían, sobre todo en mojado.",st:["Limpia la llanta con alcohol y quita los restos metálicos de las zapatas.","Orienta cada zapata con 1–2 mm de convergencia (toe-in).","Comprueba que la zapata no esté dura o agrietada.","Centra el freno con su tornillo de centrado."],tip:"Las zapatas se cambian como las pastillas; no basta con lijarlas."},
{n:"Roldanas del cambio sucias o gastadas",pr:"Roldanas 8–25 €",k:["jaula","roldanas","desv_tras"],z:"cambio",w:["pedal_suave","cambio","pedal_fuerte"],s:["chirrido","zumbido","roce"],p:4,l:"Fácil",t:"20 min",h:"Allen, desengrasante, roldanas nuevas",why:"Las ruedecillas del desviador giran muy rápido y chirrían si están secas o con holgura.",st:["Pedalea y mira si una roldana baila o se atasca.","Desmonta la jaula, limpia las roldanas y engrásalas.","Vuelve a montarlas en su posición: tienen sentido.","Cámbialas si tienen holgura o dientes afilados."],tip:"Un chirrido fino y constante en la parte trasera casi siempre son las roldanas."},
{n:"Cubiertas: piedras, presión o roce",pr:"Cubierta 20–60 € · sellante 8–15 €",k:["valvula","neumatico"],z:"neumaticos",w:["sinpedal","bache","curva","humedad"],s:["zumbido","roce","golpeteo","click"],p:3,l:"Fácil",t:"10 min",h:"Bomba, manómetro, pinzas",why:"Una piedra clavada, una presión incorrecta o la cubierta rozando el cuadro dan zumbidos y clics en cada vuelta de rueda.",st:["Gira la rueda y revisa la banda de rodadura: busca piedras y cortes.","Comprueba la presión según tu peso y el terreno.","Mira si la cubierta roza cuadro, horquilla o guardabarros.","En tubeless, revisa la válvula y el sellante."],tip:"Un ruido que sigue el ritmo de la rueda y no el de los pedales casi siempre es de la rueda."},
{n:"Eje pasante o desmontable flojo",pr:"Gratis · eje nuevo 15–40 €",k:["eje"],z:"ruedas",w:["bache","freno","pedal_fuerte"],s:["click","golpeteo","crujido"],p:3,l:"Fácil",t:"10 min",h:"Allen o palanca, grasa",why:"Un eje flojo o seco deja jugar la rueda en sus patillas y suena con cada impacto.",st:["Abre y limpia el eje y las patillas.","Engrasa ligeramente el eje y su asiento.","Cierra el eje al par que marque el fabricante.","Comprueba que la rueda esté bien asentada en la patilla."],tip:"Si la rueda se mueve al empujarla de lado, no salgas hasta arreglarlo."},
{n:"Tija telescópica o casquillos",pr:"Servicio 30–80 €",k:["tija"],z:"sillin",w:["bache","parado","pedal_fuerte"],s:["golpeteo","crujido","chirrido"],p:2,l:"Media",t:"40 min",h:"Llave del fabricante, grasa",why:"Una tija con holgura golpea al cargar peso y cruje al subir el sillín.",st:["Agita el sillín en todos los ejes: no debe haber juego.","Limpia y engrasa la parte visible del tubo.","Comprueba la abrazadera y el cable.","Haz el servicio de casquillos según el fabricante."],tip:"El golpeteo al apoyarte en baches apunta a la tija."},
{n:"Motor eléctrico o sensor",pr:"Diagnóstico en taller 30–60 €",k:["sensor","display","cargador","motor"],z:"motor",w:["pedal_fuerte","pedal_suave","sinpedal"],s:["zumbido","click","roce"],p:3,l:"Taller",t:"Taller",h:"Diagnóstico del fabricante",why:"Un zumbido leve del motor es normal; un clic o golpeteo suele ser el imán, el sensor o un tornillo del soporte.",st:["Distingue: si el ruido sigue con el motor apagado, no es el motor.","Revisa que los tornillos del soporte y de la biela estén al par.","Comprueba el imán del sensor y el cable de velocidad.","Si persiste, llévala a un taller autorizado."],tip:"Bielas y pedales de una eléctrica sufren más par y se aflojan antes."},
{n:"Calas y pedales automáticos",pr:"Calas 15–30 €",k:["calas","pedales"],z:"pedales",w:["pedal_fuerte","vuelta","parado"],s:["crujido","click","chirrido"],p:3,l:"Fácil",t:"15 min",h:"Allen, grasa, calas nuevas",why:"Calas gastadas o flojas suenan en cada pedalada, sobre todo bajo carga.",st:["Revisa los tornillos de las calas y apriétalos.","Engrasa el punto de enganche.","Comprueba el desgaste de cala y zapatilla.","Cambia las calas si el enganche es flojo."],tip:"Cámbialas antes de que se desgasten del todo."},
{n:"Grieta o fallo del cuadro",pr:"Inspección en taller 15–40 €",k:["patilla_tras","cuadro"],z:"cuadro",w:["pedal_fuerte","bache","parado"],s:["crujido","click"],p:1,l:"Taller",t:"Taller",h:"Inspección profesional",why:"Es poco frecuente, pero una grieta crujiría con la carga y es un tema de seguridad.",st:["Limpia el cuadro y revisa soldaduras y juntas con buena luz.","Busca líneas finas, óxido o pintura levantada.","No uses la bici si sospechas una grieta.","Llévala a un taller para una inspección."],tip:"Descarta antes las causas fáciles, pero no ignores una grieta visible."},
{n:"Pastillas nuevas sin asentar",pr:"Gratis",z:"frenos",b:["disco_hid","disco_mec","llanta"],k:["pastillas"],w:["freno"],s:["chirrido","silbido","zumbido"],p:3,l:"Fácil",t:"15 min",h:"Ninguna",why:"Las pastillas nuevas aún no han transferido material al disco y chirrían o frenan poco hasta asentarse.",st:["Haz 10 frenadas progresivas desde unos 20 km/h hasta casi parar.","Haz 10 más a mayor velocidad sin bloquear la rueda.","No mantengas la maneta apretada con la bici parada y el disco caliente.","Si sigue chirriando tras unos kilómetros, limpia disco y pastillas."],tip:"El asentamiento completo puede tardar varias salidas."},
{n:"Cable o funda de freno con fricción",pr:"Cable y funda 8–20 €",z:"frenos",b:["disco_mec","llanta"],k:["manguera","maneta"],w:["freno"],s:["chirrido","roce","click"],p:3,l:"Fácil",t:"30 min",h:"Cable y funda nuevos, lubricante, alicates",why:"En frenos mecánicos y de llanta, un cable oxidado o una funda aplastada hacen que el freno vuelva despacio y suene.",st:["Suelta el cable y tira de la funda: debe deslizar sin resistencia.","Sustituye cable y funda si están oxidados o aplastados.","Pon una gota de lubricante en el cable antes de pasarlo de nuevo.","Reajusta la tensión con el tornillo de la maneta."],tip:"Cambiar cables y fundas una vez al año devuelve el tacto original."},
{n:"Maneta o latiguillo con juego",pr:"Bridas 3 € · latiguillo 15–35 €",z:"frenos",b:["disco_hid","disco_mec"],k:["maneta","manguera"],w:["bache","freno"],s:["golpeteo","click","crujido"],p:2,l:"Fácil",t:"15 min",h:"Allen, bridas",why:"Una maneta floja o un latiguillo que golpea cuadro o horquilla suenan al pasar baches.",st:["Mueve cada maneta en su abrazadera: no debe girar ni bailar.","Aprieta tornillos de maneta y abrazadera al par.","Revisa que el latiguillo no roce ni forme un lazo demasiado largo.","Fíjalo con bridas o protectores."],tip:"Un latiguillo doblado o con fugas debe verlo un taller."},
{n:"Freno de tambor o contrapedal",pr:"Taller 25–60 €",z:"frenos",b:["tambor"],k:["tambor"],w:["freno","humedad"],s:["chirrido","roce","rechinar"],p:3,l:"Media",t:"45 min",h:"Llave de eje, grasa específica",why:"Un tambor seco o con zapatas desgastadas chirría, y un contrapedal con holgura hace clac al pedalear hacia atrás.",st:["Comprueba que el brazo de reacción esté bien fijado al cuadro.","Aprieta las tuercas del eje y revisa que no haya juego.","Quita el polvo del tambor con un trapo seco, sin aceite.","Si chirría al frenar, haz que lo revisen o cambia las zapatas."],tip:"Nunca eches aceite dentro del tambor: elimina el agarre."},
{n:"Batería o soporte flojos",pr:"Gratis · soporte 15–40 €",z:"motor",k:["cargador","bateria"],w:["bache","curva","sinpedal"],s:["golpeteo","roce","click"],p:2,l:"Fácil",t:"10 min",h:"Llave del fabricante",why:"Una batería que baila en su soporte suena en baches y curvas.",st:["Retira la batería y limpia contactos y carril.","Revisa las gomas o topes del soporte.","Colócala y comprueba que cierre con llave.","Aprieta los tornillos del soporte al par."],tip:"No pongas grasa convencional sobre contactos eléctricos."},
{n:"Pivotes del basculante secos o con juego",pr:"Grasa 5–10 € · rodamientos 20–80 € · taller 40–100 €",z:"suspension",k:["bieleta","pivotes","casquillos","amortiguador"],w:["bache","pedal_fuerte","curva"],s:["crujido","golpeteo","chirrido"],p:3,l:"Media",t:"1–2 h",h:"Llaves allen y torx, llave dinamométrica, grasa para rodamientos",why:"Los pivotes de la suspensión trasera giran con cada bache. Si el rodamiento se seca o el eje se afloja, crujen o golpetean al comprimirse.",st:["Con la bici en un soporte, mueve el basculante de lado a lado: no debe haber juego.","Anota el orden y la posición de cada eje, arandela y espaciador antes de desmontar.","Limpia ejes y rodamientos, engrasa y comprueba que giren suaves.","Monta y aprieta al par del fabricante siguiendo su orden de apriete.","Si hay juego o dureza, cambia los rodamientos del pivote."],tip:"El lavado a presión es el mayor enemigo de los rodamientos de pivote."},
{n:"Pivotes del cambio, desviadores o maneta secos",pr:"Lubricante 6–15 €",z:"cambio",k:["piv_cambio","piv_maneta","mandos"],w:["cambio","pedal_suave"],s:["click","chirrido","roce"],p:2,l:"Fácil",t:"20 min",h:"Lubricante fino, trapo, allen",why:"Los pivotes y muelles del cambio y de las manetas se resecan y dejan clics o una respuesta lenta.",st:["Limpia pivotes y muelles del cambio y del desviador con desengrasante.","Pon una gota de lubricante fino en cada pivote y mueve el mecanismo.","Comprueba que la maneta vuelva sin quedarse a medias.","Limpia el exceso para no atraer suciedad."],tip:"Evita grasas gruesas en pivotes de cambio: se endurecen con el frío."}];

const ZT={pedales:"Pedalea con un solo pie y alterna: el ruido sigue al pedal que suena.",pedalier:"Si suena una vez por vuelta de biela y bajo carga, empuja el pedal de lado con la bici parada: un crujido apunta a pedalier o bielas.",cadena:"Si suena más en seco o tras lluvia y se calla con unas gotas de lubricante, es la cadena.",cassette:"Si suena al pedalear fuerte y desaparece al rodar sin pedalear, mira cassette y rueda libre.",cambio:"Prueba cada marcha: si el ruido cambia con la marcha, es el cambio o los desviadores.",frenos:"Rueda sin frenar: si roza sin tocar la maneta, es pinza o disco; si solo suena al frenar, son las pastillas.",ruedas:"Levanta la rueda y gírala: un roce o golpe en cada vuelta apunta a llanta, radios o eje.",buje:"Gira la rueda en el aire y balancéala de lado a lado: zumbido o juego es del buje.",direccion:"Frena la rueda delantera y balancea la bici adelante y atrás: un clac indica dirección.",sillin:"Pedalea de pie un rato: si el ruido desaparece, es sillín o tija.",cuadro:"Sacude la bici en el suelo y escucha: cables y accesorios sueltos se oyen al momento.",suspension:"Comprime horquilla y amortiguador con la bici parada y escucha crujidos o golpes.",neumaticos:"Rueda despacio y escucha: un tic en cada vuelta de rueda suele ser una piedra o la cubierta rozando.",motor:"Apaga el motor y rueda: si el ruido sigue, no es el motor."};

 async copy(el){const l=(k,o)=>[...st[k]].map(i=>o[i]).join(", ")||"–",f=FR.find(x=>x[0]===st.fr);try{await navigator.clipboard.writeText(`Bici: ${st.m||"sin indicar"} (${st.tipo}${f?", "+f[1]:""})\nTerreno: ${l("t",TL)}\nCuándo: ${l("w",W)}\nSonido: ${l("s",S)}\nPiezas: ${l("z",CL)}${st.qa.length?"\nPruebas: "+st.qa.map(([i,a])=>QS[i].t+" → "+({s:"Sí",n:"No",x:"No sé"})[a]).join("; "):""}`);el.textContent="Copiado"}catch(e){el.textContent="No se pudo copiar"}setTimeout(()=>el.textContent="Copiar resumen",1600)}};
document.body.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(el&&act[el.dataset.a])act[el.dataset.a](el)});
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
document.body.addEventListener("input",e=>{if(e.target.id==="q"){st.q=e.target.value;document.getElementById("list").innerHTML=listHTML()}
 if(e.target.id==="mod"){st.m=e.target.value;save();document.getElementById("mine").textContent=[st.m,st.tipo].filter(Boolean).join(" · ")}});
render();
